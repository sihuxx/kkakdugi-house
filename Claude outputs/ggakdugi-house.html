"use strict";
/* 뽑기 연출 — 꺅두기 하우스 */

/* ===== 뽑기 연출 씬 (인트로 → 캐릭터 공개 → 결과) ===== */
const CUTC={
  N: {s1:'#E9F6E2',s2:'#FFF8F0',orb:'#8FBF92',ray:'rgba(123,196,127,.16)',
      plate:'#EAF6E4',label:'',intro:3.6,rev:2.4},
  R: {s1:'#DCEFFA',s2:'#FFF8F0',orb:'#8FC0D8',ray:'rgba(169,217,240,.22)',
      plate:'#DFF0FA',label:'귀한 예감!',intro:4.4,rev:2.9},
  SR:{s1:'#FFDFE9',s2:'#FFF7D6',orb:'#FF9EB5',ray:'rgba(255,158,181,.26)',
      plate:'#FFE3EC',label:'아주 귀함!',intro:5.2,rev:3.6}
};
let cut=null;

function startCut(rank, results, onDone){
  const cast=[];
  const pool=CHARS.filter(c=>c.id!==char.id);
  const pick=[char].concat(pool.sort(()=>Math.random()-0.5).slice(0,5));
  pick.forEach((c,i)=>{
    const depth=0.55+Math.random()*0.55;
    cast.push({c, depth,
      tx: W*(0.10+i*0.145)+ (Math.random()-.5)*30,
      delay: i*0.13+Math.random()*0.1,
      yOff: (1-depth)*H*0.10, ph: Math.random()*6.3});
  });
  cast.sort((a,b)=>a.depth-b.depth);
  cut={phase:'intro', t:0, rank, results, idx:0, onDone,
       cast, sparks:[], rings:[], burst:false, plateSeed:Math.random()*6.3};
  sweepUp(CUTC[rank].intro*0.92, rank);
}
function skipCut(){ if(!cut) return; const f=cut.onDone; cut=null; f(); }   // 전부 건너뛰기
function advanceCut(){                                                      // 한 컷 넘기기
  if(!cut) return;
  if(cut.phase==='intro'){ cut.t=Math.max(cut.t, CUTC[cut.rank].intro*0.90); }
  else { nextReveal(); }
}
function nextReveal(){
  cut.idx++;
  if(cut.idx>=cut.results.length){ const f=cut.onDone; cut=null; f(); return; }
  cut.t=0; cut.stamped=false; cut.plateSeed=Math.random()*6.3;
  revealSound(cut.results[cut.idx].rank);
}
function revealSound(rank){
  if(rank==='SR'){ arp([784,1175],0.13,0.16,'square'); setTimeout(shimmer,140); }
  else if(rank==='R') arp([659,988],0.12,0.13);
  else arp([587,880],0.11,0.11);
}
function swish(){
  if(!ctx) return;
  const t=ctx.currentTime, s=ctx.createBufferSource(), g2=ctx.createGain(), f=ctx.createBiquadFilter();
  s.buffer=noise(); f.type='bandpass'; f.frequency.setValueAtTime(600,t);
  f.frequency.exponentialRampToValueAtTime(4200,t+0.25); f.Q.value=1.4;
  g2.gain.setValueAtTime(0.0001,t); g2.gain.exponentialRampToValueAtTime(0.12,t+0.12);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
  s.connect(f); f.connect(g2); g2.connect(master); s.start(t); s.stop(t+0.35);
}
function sprite(key,x,y,h,rot,alpha,flip){
  const img=IMG[key];
  if(!img||!img.complete||!img.naturalWidth) return;
  const w=h*(img.naturalWidth/img.naturalHeight);
  g.save(); g.globalAlpha=alpha===undefined?1:alpha;
  g.translate(x,y); g.rotate(rot||0);
  if(flip) g.scale(-1,1);
  g.drawImage(img,-w/2,-h,w,h); g.restore();
}
function rays(cx,cy,spin,col,alpha,n){
  g.save(); g.translate(cx,cy); g.rotate(spin);
  const R=Math.max(W,H)*1.3;
  for(let i=0;i<(n||14);i++){
    g.rotate(Math.PI*2/(n||14));
    g.beginPath(); g.moveTo(0,0);
    g.lineTo(Math.cos(-0.055)*R,Math.sin(-0.055)*R);
    g.lineTo(Math.cos(0.055)*R,Math.sin(0.055)*R);
    g.closePath(); g.globalAlpha=alpha; g.fillStyle=col; g.fill();
  }
  g.restore(); g.globalAlpha=1;
}
const easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{ const c=1.70158+1; return 1+c*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2); };

/* ── 인트로: 두기들이 모여들고 클로버가 터진다 ── */
function drawIntro(dt){
  const C=CUTC[cut.rank], dur=C.intro, p=Math.min(1,cut.t/dur);
  const ox=W*0.5, oy=H*0.40, gy=H*0.84;
  const heat=Math.max(0,Math.min(1,(p-0.34)/0.52));

  let sx=0,sy=0;
  if(p>0.60 && p<0.90){ const k=(cut.rank==='SR'?8:cut.rank==='R'?5:2.5)*heat;
    sx=(Math.random()-.5)*k; sy=(Math.random()-.5)*k; }
  g.save(); g.translate(sx,sy);

  const grd=g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,C.s1); grd.addColorStop(1,C.s2);
  g.fillStyle=grd; g.fillRect(-20,-20,W+40,H+40);
  if(p>0.10) rays(ox,oy,cut.t*(0.35+heat*2.0),C.ray,0.22+heat*0.7);

  if(Math.random()<0.45+heat) cut.sparks.push({x:Math.random()*W,y:H+10,
    v:50+Math.random()*170*(1+heat), r:2+Math.random()*4, a:1});
  cut.sparks.forEach(s=>{ if(s.vx!==undefined){ s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=480*dt; }
                          else s.y-=s.v*dt; s.a-=dt*0.35; });
  cut.sparks=cut.sparks.filter(s=>s.a>0 && s.y>-30);
  cut.sparks.forEach(s=>{ g.globalAlpha=Math.max(0,s.a)*0.85; g.fillStyle=C.orb;
    g.beginPath(); g.arc(s.x,s.y,s.r,0,6.3); g.fill(); });
  g.globalAlpha=1;

  g.strokeStyle='rgba(120,95,75,.45)'; g.lineWidth=LW();
  g.beginPath(); for(let x=0;x<=W;x+=14) g.lineTo(x,gy+Math.sin((x+cut.t*160)*0.03)*1.6); g.stroke();

  // 두기들이 하나씩 달려 들어와 자리를 잡는다
  cut.cast.forEach(m=>{
    const lt=Math.max(0, cut.t-m.delay), run=Math.min(1, lt/0.85);
    const x=-W*0.15+(m.tx+W*0.15)*easeOut(run);
    const h=Math.min(H*0.20, W*0.13)*m.depth*(m.c.scale||1);
    const base=gy-m.yOff;
    let y=base, rot=0, key=m.c.run;
    if(run<1) y=base-Math.abs(Math.sin(lt*22))*9*m.depth;              // 달려온다
    else if(p<0.86) y=base-Math.abs(Math.sin(cut.t*5+m.ph))*5*(1+heat); // 제자리 통통
    else {                                                              // 놀라서 점프
      const jp=Math.min(1,(p-0.86)/0.14);
      y=base-Math.sin(jp*Math.PI)*H*0.13*m.depth; key=m.c.jump; rot=(m.c.jumpRot||-0.15)*0.8;
    }
    sprite(key, x, y, h, rot, 0.55+0.45*m.depth, m.c.flip);
  });

  // 네잎클로버
  if(p>0.30){
    const drop=Math.min(1,(p-0.30)/0.16);
    const oyy=oy-(1-easeOut(drop))*H*0.6;
    const R=Math.min(W,H)*0.10*(0.6+0.4*drop+heat*0.5);
    const jx=(Math.random()-.5)*7*heat, jy=(Math.random()-.5)*7*heat;
    const hal=g.createRadialGradient(ox+jx,oyy+jy,R*0.4,ox+jx,oyy+jy,R*3);
    hal.addColorStop(0,C.ray); hal.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=hal; g.beginPath(); g.arc(ox+jx,oyy+jy,R*3,0,6.3); g.fill();
    g.save(); g.translate(ox+jx,oyy+jy); g.rotate(cut.t*0.7);
    g.strokeStyle='#5A4A40'; g.lineWidth=LW();
    g.beginPath(); g.moveTo(0,R*0.3); g.quadraticCurveTo(R*0.3,R*1.0,R*0.15,R*1.5); g.stroke();
    for(let i=0;i<4;i++){ g.rotate(Math.PI/2); wobble(0,-R*0.62,R*0.46,i*1.7,C.orb,'#5A4A40'); }
    g.fillStyle='#5A4A40'; g.beginPath(); g.arc(0,0,R*0.10,0,6.3); g.fill();
    if(p>0.66){
      g.strokeStyle='#5A4A40'; g.lineWidth=LW()*0.7; g.globalAlpha=Math.min(1,(p-0.66)/0.18);
      g.beginPath(); g.moveTo(-R*0.5,-R*0.3); g.lineTo(-R*0.1,0); g.lineTo(-R*0.35,R*0.4); g.stroke();
      g.beginPath(); g.moveTo(R*0.45,-R*0.35); g.lineTo(R*0.1,R*0.05); g.stroke();
      g.globalAlpha=1;
    }
    g.restore();
  }

  if(p>=0.88 && !cut.burst){
    cut.burst=true;
    for(let i=0;i<46;i++){ const a=Math.random()*6.283, v=220+Math.random()*560;
      cut.sparks.push({x:ox,y:oy,r:3+Math.random()*5,a:1,vx:Math.cos(a)*v,vy:Math.sin(a)*v}); }
    cut.rings.push({r:10,a:1},{r:10,a:1,d:0.14});
    if(cut.rank==='SR'){ arp([660,880,1175,1568],0.075,0.16,'square'); shimmer(); }
    else if(cut.rank==='R') arp([740,988],0.09,0.13); else arp([680],0,0.11);
  }
  cut.rings.forEach(r=>{ if(r.d>0){ r.d-=dt; return; } r.r+=dt*Math.max(W,H)*1.5; r.a-=dt*1.3; });
  cut.rings=cut.rings.filter(r=>r.a>0);
  cut.rings.forEach(r=>{ g.globalAlpha=Math.max(0,r.a); g.strokeStyle=C.orb; g.lineWidth=LW();
    g.beginPath(); g.arc(ox,oy,r.r,0,6.3); g.stroke(); });
  g.globalAlpha=1;

  if(p>=0.88){
    const f=Math.max(0,1-(p-0.88)/0.10);
    g.globalAlpha=f*0.95; g.fillStyle='#FFF'; g.fillRect(-20,-20,W+40,H+40); g.globalAlpha=1;
    if(C.label){
      const pop=Math.min(1,(p-0.90)/0.06);
      g.save(); g.translate(W/2,H*0.26); g.scale(0.7+0.45*pop,0.7+0.45*pop); g.rotate(-0.04);
      g.textAlign='center'; g.font='700 '+Math.round(Math.min(W,H)*0.11)+'px "Gaegu", sans-serif';
      g.lineWidth=LW(); g.strokeStyle='#5A4A40'; g.strokeText(C.label,0,0);
      g.fillStyle=cut.rank==='SR'?'#FFD36E':'#FFF8F0'; g.fillText(C.label,0,0);
      g.restore();
    }
  }
  g.restore();

  if(p>=1){ cut.phase='reveal'; cut.t=0; cut.idx=0; cut.stamped=false;
            cut.sparks=[]; cut.rings=[]; revealSound(cut.results[0].rank); }
}

/* ── 캐릭터 공개: 한 명씩 이름판과 함께 ── */
function drawReveal(dt){
  const r=cut.results[cut.idx], C=CUTC[r.rank];
  const dur=C.rev, q=Math.min(1,cut.t/dur);
  const cx=W*0.60, gy=H*0.86;

  let sx=0,sy=0;
  if(r.rank==='SR' && q>0.12 && q<0.24){ sx=(Math.random()-.5)*10; sy=(Math.random()-.5)*10; }
  g.save(); g.translate(sx,sy);

  const grd=g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,C.s1); grd.addColorStop(1,C.s2);
  g.fillStyle=grd; g.fillRect(-20,-20,W+40,H+40);
  rays(cx,H*0.42,cut.t*0.45,C.ray,0.30, r.rank==='SR'?18:12);

  // 캐릭터 등장
  const inP=Math.min(1,q/0.30);
  let x=cx, y=gy, rot=0, sc=1;
  if(r.rank==='SR'){                       // 정면에서 쾅
    sc=1+2.0*(1-easeOut(inP)); rot=0.18*(1-inP);
  } else {                                 // 옆에서 슝
    x=cx+(W*0.55)*(1-easeBack(inP)); rot=0.35*(1-inP);
  }
  const squash=q>0.30&&q<0.46 ? 1+0.10*Math.sin((q-0.30)/0.16*Math.PI) : 1;
  const bob=q>0.46 ? Math.sin(cut.t*3.4)*6 : 0;
  const H0=Math.min(H*0.52, W*0.34)*(r.c.scale||1)*sc;
  sprite(r.c.run, x, y-bob, H0/squash, rot, Math.min(1,q/0.12), r.c.flip);

  if(q<0.16){ const f=1-q/0.16;             // 등장 섬광
    g.globalAlpha=f*0.8; g.fillStyle='#FFF'; g.fillRect(-20,-20,W+40,H+40); g.globalAlpha=1; }

  // 이름판 — 왼쪽에서 따단
  if(q>0.30){
    const pp=Math.min(1,(q-0.30)/0.22), e=easeBack(pp);
    const pw=Math.min(W*0.46,340), ph=Math.min(H*0.30,116);
    const px=-pw+(W*0.06+pw)*e, py=H*0.30;
    g.save(); g.translate(px,py); g.rotate(-0.025+Math.sin(cut.t*1.6)*0.006);
    g.fillStyle=C.plate; roundRect(0,0,pw,ph,18); g.fill();
    g.lineWidth=LW(); g.strokeStyle='#5A4A40'; g.stroke();
    g.save(); roundRect(0,0,pw,ph,18); g.clip();      // 빛 훑기
    const sw=((cut.t*0.9)%1.6)/1.6;
    const sg=g.createLinearGradient(pw*(sw*1.6-0.4),0,pw*(sw*1.6-0.1),ph);
    sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(0.5,'rgba(255,255,255,.75)');
    sg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=sg; g.fillRect(0,0,pw,ph); g.restore();

    g.textAlign='left'; g.fillStyle='#C8A94B';
    g.font='700 '+Math.round(ph*0.20)+'px "Gaegu", sans-serif';
    g.fillText('★'.repeat(STARS[r.rank])+'  '+RARITY[r.rank].name, 18, ph*0.28);
    g.fillStyle='#5A4A40';
    g.font='700 '+Math.round(ph*0.36)+'px "Gaegu", sans-serif';
    g.fillText(r.c.name, 16, ph*0.66);
    g.fillStyle='#8A7264'; g.font='400 '+Math.round(ph*0.155)+'px "Gowun Dodum", sans-serif';
    g.fillText(r.c.meta, 18, ph*0.86);
    g.restore();
  }

  // NEW 도장 / 겹침 표시
  if(q>0.50){
    const st=Math.min(1,(q-0.50)/0.16);
    const scl=1+1.6*(1-easeOut(st));
    g.save(); g.translate(W*0.30, H*0.24); g.rotate(-0.30+0.30*(1-st)); g.scale(scl,scl);
    if(r.isNew){
      g.fillStyle='#EFA6B8'; roundRect(-52,-22,104,44,12); g.fill();
      g.lineWidth=LW(); g.strokeStyle='#5A4A40'; g.stroke();
      g.textAlign='center'; g.fillStyle='#5A4A40';
      g.font='700 30px "Gaegu", sans-serif'; g.fillText('NEW', 0, 11);
    } else {
      g.fillStyle='#EAF6E4'; roundRect(-68,-20,136,40,12); g.fill();
      g.lineWidth=LW(); g.strokeStyle='#5A4A40'; g.stroke();
      g.textAlign='center'; g.fillStyle='#4E8A52';
      g.font='700 24px "Gaegu", sans-serif'; g.fillText('겹침 +'+r.refund, 0, 9);
    }
    g.restore();
    if(!cut.stamped){ cut.stamped=true; blip(r.isNew?1180:520, 0.1);
      if(r.rank==='SR') for(let i=0;i<22;i++){ const a=Math.random()*6.283, v=160+Math.random()*320;
        cut.sparks.push({x:cx,y:H*0.55,r:3+Math.random()*4,a:1,vx:Math.cos(a)*v,vy:Math.sin(a)*v}); } }
  }

  // 반짝이
  if(r.rank!=='N' && Math.random()<0.6) cut.sparks.push({x:Math.random()*W,y:H+8,
    v:70+Math.random()*150, r:2+Math.random()*3, a:1});
  cut.sparks.forEach(s=>{ if(s.vx!==undefined){ s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=430*dt; }
                          else s.y-=s.v*dt; s.a-=dt*0.5; });
  cut.sparks=cut.sparks.filter(s=>s.a>0 && s.y>-20);
  cut.sparks.forEach(s=>{ g.globalAlpha=Math.max(0,s.a)*0.85; g.fillStyle=C.orb;
    g.beginPath(); g.arc(s.x,s.y,s.r,0,6.3); g.fill(); });
  g.globalAlpha=1;

  // 몇 번째인지
  g.textAlign='right'; g.fillStyle='rgba(120,95,75,.45)';
  g.font='400 15px "Gowun Dodum", sans-serif';
  g.fillText((cut.idx+1)+' / '+cut.results.length, W-18, 30);
  g.restore();

  if(q>=1) nextReveal();
}

function drawCut(dt){
  cut.t+=dt;
  if(cut.phase==='intro') drawIntro(dt); else drawReveal(dt);
}

"use strict";
/* 집 — 방과 가구 — 꺅두기 하우스 */

/* ===============================================================
   집 — 방 그리기와 가구 자리
   =============================================================== */

/* 어디에 있나 — 'room'(집 안) · 'yard'(정원) */
let place = 'room';

/* 방 좌표 — 정원은 화면 전체를 쓴다 */
const roomW   = () => W * (place === 'yard' ? 1 : HOUSE().wide);
const roomL   = () => (W - roomW()) / 2;
const roomR   = () => roomL() + roomW();
const rx      = t => roomL() + roomW() * t;
const wallBot = () => H * (place === 'yard' ? 0.44 : HOUSE().tall);
const walkTop = () => wallBot() + (H - wallBot()) * 0.06;     // 벽 바로 앞까지 갈 수 있다
const walkBot = () => H - (H - wallBot()) * 0.06;
const yAt     = t => walkTop() + t * (walkBot() - walkTop());
const depthAt = y => 0.72 + 0.38 * ((y - walkTop()) / (walkBot() - walkTop()));
const zoneOf  = t => t < 0.34 ? 'kitchen' : t < 0.67 ? 'living' : 'bed';
const ZONE_X  = { kitchen:[0.02, 0.32], living:[0.35, 0.65], bed:[0.68, 0.98] };

/* 공용 그리기 도구 */
function ink(w){ g.strokeStyle = '#5A4A40'; g.lineWidth = w || LW(); g.lineJoin = 'round'; g.lineCap = 'round'; }
function rrect(x, y, w, h, r){
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function box(x, y, w, h, r, fill){ g.fillStyle = fill; rrect(x, y, w, h, r); g.fill(); g.stroke(); }
function shadow(cx, base, w){
  g.save(); g.globalAlpha = 0.10; g.fillStyle = '#7A6250';
  g.beginPath(); g.ellipse(cx, base + 1, w, w * 0.22, 0, 0, 7); g.fill(); g.restore();
}

/* ===============================================================
   자리 배치 — 구역(주방·거실·침실)마다 앞뒤 줄로 나눠 놓는다
   꾸미기 모드에서 옮긴 자리는 S.pos 에 저장되어 그게 우선
   =============================================================== */
const ROW_Y = { 1:0.16, 0:0.58, 2:0.66 };
function layoutHome(){
  const zones = { kitchen:{ 0:[], 1:[], 2:[] }, living:{ 0:[], 1:[], 2:[] }, bed:{ 0:[], 1:[], 2:[] } };
  const wall = { kitchen:[], living:[], bed:[] };
  const add = (id, f) => {
    const z = f.zone || 'living';
    if(f.on === 'wall') wall[z].push(id);
    else zones[z][f.row || 0].push(id);
  };
  for(const id of S.furn){ const f = FURN(id); if(f) add(id, f); }
  PLACES.forEach(p => { if(p.id !== 'door') add(p.id, p); });

  const out = { floor: [], wall: [] };
  ZONES.forEach(z => {
    const [a, b] = ZONE_X[z];
    [1, 0, 2].forEach(row => {
      const list = zones[z][row];
      list.forEach((id, i) => {
        let t = list.length === 1 ? 0.5 : (i + 0.5) / list.length;
        let x = a + (b - a) * t;
        /* 거실 벽쪽 줄은 현관 자리를 비켜 간다 */
        if(z === 'living' && row === 1 && Math.abs(x - 0.5) < 0.09)
          x = x < 0.5 ? 0.5 - 0.11 : 0.5 + 0.11;
        out.floor.push({ id, zone:z, x, y: ROW_Y[row], row });
      });
    });
    wall[z].forEach((id, i) => {
      const t = wall[z].length === 1 ? 0.5 : (i + 0.5) / wall[z].length;
      out.wall.push({ id, zone:z, x: a + (b - a) * t });
    });
  });
  /* 옮겨둔 자리 반영 */
  out.floor.forEach(o => { const p = S.pos[o.id]; if(p){ o.x = p.x; o.y = p.y; } });
  out.wall.forEach(o => { const p = S.pos[o.id]; if(p){ o.x = p.x; } });
  out.door = { id:'door', x: S.pos.door ? S.pos.door.x : 0.5 };
  return out;
}
let LAY = layoutHome();
function relayout(){ LAY = layoutHome(); }
function spotOf(id){ return LAY.floor.find(o => o.id === id) || LAY.wall.find(o => o.id === id); }

/* ===============================================================
   방
   =============================================================== */
function drawRoom(){
  const HS = HOUSE(), WA = WALLNOW(), FL = FLOORNOW();
  const wb = wallBot(), L = roomL(), R = roomR();
  g.fillStyle = '#E0D5C6'; g.fillRect(0, 0, W, H);

  const wg = g.createLinearGradient(0, 0, 0, wb);
  wg.addColorStop(0, WA.a); wg.addColorStop(1, WA.b);
  g.fillStyle = wg; g.fillRect(L, 0, R - L, wb);

  /* 벽지 무늬 */
  g.save(); g.beginPath(); g.rect(L, 0, R - L, wb); g.clip();
  if(S.house === 0 && S.wall === 'w0'){
    g.strokeStyle = 'rgba(150,125,90,.26)'; g.lineWidth = LW() * 0.5;
    for(let x = L; x < R; x += roomW() * 0.055){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, wb); g.stroke(); }
    g.fillStyle = 'rgba(120,100,70,.16)';
    g.beginPath(); g.moveTo(L + roomW() * 0.62, 0);
    g.lineTo(L + roomW() * 0.69, wb * 0.32); g.lineTo(L + roomW() * 0.59, wb * 0.28);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(80,66,48,.4)';
    g.beginPath(); g.moveTo(L + roomW() * 0.22, 0);
    g.lineTo(L + roomW() * 0.25, wb * 0.2); g.lineTo(L + roomW() * 0.2, wb * 0.34); g.stroke();
  }else if(WA.pat === 'stripe'){
    g.strokeStyle = 'rgba(120,160,140,.3)'; g.lineWidth = LW() * 0.9;
    for(let x = L + 10; x < R; x += roomW() * 0.07){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, wb); g.stroke(); }
  }else if(WA.pat === 'grid'){
    g.strokeStyle = 'rgba(120,150,180,.26)'; g.lineWidth = LW() * 0.55;
    for(let x = L; x < R; x += roomW() * 0.07){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, wb); g.stroke(); }
    for(let y = wb * 0.1; y < wb; y += wb * 0.18){ g.beginPath(); g.moveTo(L, y); g.lineTo(R, y); g.stroke(); }
  }else{
    g.fillStyle = 'rgba(190,170,140,.35)';
    const gx = roomW() * 0.075, gy = wb * 0.17;
    for(let x = L + gx * 0.5; x < R; x += gx)
      for(let y = wb * 0.12; y < wb - 6; y += gy){
        const o = (Math.round(y / gy) % 2) * gx * 0.5;
        g.beginPath(); g.arc(x + o, y, Math.max(1.8, 2.4 * uiK() * 0.7), 0, 7); g.fill();
      }
  }
  g.restore();

  /* 바닥 */
  const fg = g.createLinearGradient(0, wb, 0, H);
  fg.addColorStop(0, FL.a); fg.addColorStop(1, FL.b);
  g.fillStyle = fg; g.fillRect(L, wb, R - L, H - wb);
  g.save(); g.beginPath(); g.rect(L, wb, R - L, H - wb); g.clip();
  g.strokeStyle = 'rgba(120,95,60,.18)'; g.lineWidth = LW() * 0.5;
  for(let i = 1; i < 6; i++){ const y = wb + (H - wb) * (i / 6);
    g.beginPath(); g.moveTo(L, y); g.lineTo(R, y); g.stroke(); }
  for(let i = 0; i <= 12; i++){ const t = i / 12;
    g.beginPath(); g.moveTo(rx(t), wb); g.lineTo(rx(0.5 + (t - 0.5) * 1.4), H); g.stroke(); }
  g.restore();

  /* 벽 아래 그늘 · 걸레받이 */
  const sh = g.createLinearGradient(0, wb - (H - wb) * 0.26, 0, wb);
  sh.addColorStop(0, 'rgba(120,100,70,0)'); sh.addColorStop(1, 'rgba(120,100,70,.14)');
  g.fillStyle = sh; g.fillRect(L, wb - (H - wb) * 0.26, R - L, (H - wb) * 0.26);
  const tw = (H - wb) * 0.075;
  g.fillStyle = S.house === 0 ? '#D9CDB4' : '#FFF8F0';
  g.fillRect(L, wb - tw, R - L, tw);
  ink(); g.beginPath(); g.moveTo(L, wb - tw); g.lineTo(R, wb - tw);
  g.moveTo(L, wb); g.lineTo(R, wb); g.stroke();
  if(S.house === 2){
    g.fillStyle = '#FFF8F0'; g.fillRect(L, H * 0.04, R - L, H * 0.018);
    g.beginPath(); g.moveTo(L, H * 0.058); g.lineTo(R, H * 0.058); g.stroke();
  }
  ink(); g.beginPath(); g.moveTo(L, 0); g.lineTo(L, H); g.moveTo(R, 0); g.lineTo(R, H); g.stroke();
  if(HOUSE().wide < 1){
    g.save(); g.globalAlpha = .35; g.fillStyle = '#8C8172';
    g.fillRect(0, 0, L, H); g.fillRect(R, 0, W - R, H); g.restore();
  }

  /* 구역 이름 (꾸미기 모드에서만) */
  if(deco){
    g.save(); g.globalAlpha = .5; g.textAlign = 'center';
    g.font = '700 ' + (16 * uiK()) + 'px Gaegu, sans-serif'; g.fillStyle = '#5A4A40';
    ZONES.forEach(z => {
      const [a, b] = ZONE_X[z];
      g.fillText(ZONE_NAME[z], rx((a + b) / 2), wb + (H - wb) * 0.12);
      if(b < 0.99){ g.setLineDash([6, 8]); ink(LW() * 0.6); g.globalAlpha = .3;
        g.beginPath(); g.moveTo(rx(b + 0.015), wb); g.lineTo(rx(b + 0.015), H); g.stroke();
        g.setLineDash([]); g.globalAlpha = .5; }
    });
    g.restore();
  }

  /* 조명 · 창문 */
  const s = Math.min(roomW() * 0.09, wb * 0.32);
  if(S.house === 0){
    drawBulb(rx(0.2), 0, wb * 0.24);
    drawWindow(rx(0.8), wb * 0.46, s * 0.8, true);
  }else{
    drawWindow(rx(0.16), wb * 0.48, s, false);
    if(S.house === 2){ drawWindow(rx(0.84), wb * 0.48, s, false); drawLamp(rx(0.5), 0, wb * 0.15); }
    else drawBulb(rx(0.84), 0, wb * 0.2);
  }
}
function drawBulb(cx, top, len){
  ink(); g.beginPath(); g.moveTo(cx, top); g.lineTo(cx, top + len); g.stroke();
  const r = len * 0.22;
  g.save(); g.globalAlpha = .3; g.fillStyle = '#FFE08A';
  g.beginPath(); g.arc(cx, top + len + r, r * 2.6, 0, 7); g.fill(); g.restore();
  box(cx - r, top + len, r * 2, r * 2.1, r, '#FFE9A8');
}
function drawLamp(cx, top, len){
  ink(); g.beginPath(); g.moveTo(cx, top); g.lineTo(cx, top + len); g.stroke();
  const w = len * 1.2;
  g.save(); g.globalAlpha = .26; g.fillStyle = '#FFE08A';
  g.beginPath(); g.moveTo(cx - w, top + len * 3.4); g.lineTo(cx + w, top + len * 3.4);
  g.lineTo(cx + w * 0.42, top + len); g.lineTo(cx - w * 0.42, top + len); g.closePath(); g.fill(); g.restore();
  g.fillStyle = '#F3EAE1';
  g.beginPath(); g.moveTo(cx - w * 0.62, top + len + w * 0.4); g.lineTo(cx + w * 0.62, top + len + w * 0.4);
  g.lineTo(cx + w * 0.32, top + len); g.lineTo(cx - w * 0.32, top + len); g.closePath();
  g.fill(); ink(); g.stroke();
}
function drawWindow(cx, cy, s, old){
  g.save();
  box(cx - s * 0.95, cy - s * 0.75, s * 1.9, s * 1.5, s * 0.14, old ? '#BFD9E4' : '#CDEBFA');
  g.save(); rrect(cx - s * 0.95, cy - s * 0.75, s * 1.9, s * 1.5, s * 0.14); g.clip();
  g.fillStyle = '#FFFFFF'; g.globalAlpha = .75;
  g.beginPath(); g.arc(cx - s * 0.32, cy - s * 0.2, s * 0.3, 0, 7);
  g.arc(cx + s * 0.02, cy - s * 0.3, s * 0.22, 0, 7); g.fill();
  g.globalAlpha = .5; g.fillStyle = '#8FBF92';
  g.beginPath(); g.ellipse(cx + s * 0.5, cy + s * 0.62, s * 0.5, s * 0.22, 0, 0, 7); g.fill();
  g.restore();
  ink();
  g.beginPath(); g.moveTo(cx, cy - s * 0.75); g.lineTo(cx, cy + s * 0.75);
  g.moveTo(cx - s * 0.95, cy); g.lineTo(cx + s * 0.95, cy); g.stroke();
  if(!old){
    g.fillStyle = '#EFA6B8';
    [-1, 1].forEach(d => {
      g.beginPath(); g.moveTo(cx + d * s * 0.95, cy - s * 0.9);
      g.quadraticCurveTo(cx + d * s * 0.72, cy - s * 0.1, cx + d * s * 0.95, cy + s * 0.75);
      g.lineTo(cx + d * s * 1.16, cy + s * 0.75); g.lineTo(cx + d * s * 1.16, cy - s * 0.9);
      g.closePath(); g.fill(); g.stroke(); });
    g.fillStyle = '#E39FB2';
    g.fillRect(cx - s * 1.2, cy - s * 0.95, s * 2.4, s * 0.1);
    g.strokeRect(cx - s * 1.2, cy - s * 0.95, s * 2.4, s * 0.1);
  }
  g.restore();
}

/* ===============================================================
   가구 하나
   =============================================================== */
function drawFurn(id, cx, base, s, glow){
  g.save();
  if(glow){
    g.save(); g.globalAlpha = 0.28 + Math.sin(home.t * 5) * 0.16;
    g.fillStyle = '#FFE08A';
    g.beginPath(); g.ellipse(cx, base - s * 0.4, s * 1.05, s * 0.8, 0, 0, 7); g.fill(); g.restore();
  }
  ink();
  switch(id){
    case 'bowl': {
      shadow(cx, base, s * 0.5);
      g.fillStyle = '#E4C48E'; g.beginPath();
      g.moveTo(cx - s * 0.46, base - s * 0.32); g.lineTo(cx + s * 0.46, base - s * 0.32);
      g.quadraticCurveTo(cx + s * 0.3, base, cx, base);
      g.quadraticCurveTo(cx - s * 0.3, base, cx - s * 0.46, base - s * 0.32);
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#C88B5A';
      g.beginPath(); g.ellipse(cx, base - s * 0.32, s * 0.46, s * 0.13, 0, 0, 7); g.fill(); g.stroke();
      if(S.dugi.full < 70){ g.fillStyle = '#E0A45C';
        g.beginPath(); g.ellipse(cx, base - s * 0.35, s * 0.3, s * 0.1, 0, 0, 7); g.fill(); g.stroke(); }
      break;
    }
    case 'tub': {
      shadow(cx, base, s * 0.55);
      g.fillStyle = '#8FC0D8'; g.beginPath();
      g.moveTo(cx - s * 0.5, base - s * 0.4); g.lineTo(cx + s * 0.5, base - s * 0.4);
      g.quadraticCurveTo(cx + s * 0.36, base, cx, base);
      g.quadraticCurveTo(cx - s * 0.36, base, cx - s * 0.5, base - s * 0.4);
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#7FC4E4';
      g.beginPath(); g.ellipse(cx, base - s * 0.4, s * 0.5, s * 0.13, 0, 0, 7); g.fill(); g.stroke();
      g.fillStyle = '#FFFFFF';
      [[-0.18, -0.48, 0.1], [0.08, -0.55, 0.075], [0.24, -0.46, 0.055]].forEach(([dx, dy, r]) => {
        g.beginPath(); g.arc(cx + dx * s, base + dy * s, r * s, 0, 7); g.fill(); g.stroke(); });
      break;
    }
    case 'plant': {                                     // 물 줄수록 자란다
      const st = Math.min(4, S.dugi.plant || 0);
      shadow(cx, base, s * 0.36);
      g.fillStyle = '#D98E6A'; g.beginPath();
      g.moveTo(cx - s * 0.33, base - s * 0.44); g.lineTo(cx + s * 0.33, base - s * 0.44);
      g.lineTo(cx + s * 0.24, base); g.lineTo(cx - s * 0.24, base); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#C67A58';
      g.fillRect(cx - s * 0.33, base - s * 0.44, s * 0.66, s * 0.1);
      g.strokeRect(cx - s * 0.33, base - s * 0.44, s * 0.66, s * 0.1);
      const hgt = (0.28 + st * 0.18) * s;
      ink(); g.beginPath(); g.moveTo(cx, base - s * 0.44); g.lineTo(cx, base - s * 0.44 - hgt); g.stroke();
      g.fillStyle = '#8FBF92';
      for(let i = 0; i <= st; i++){
        const y = base - s * 0.44 - hgt * (0.35 + i * 0.2), d = i % 2 ? 1 : -1;
        g.beginPath(); g.ellipse(cx + d * s * 0.22, y, s * 0.24, s * 0.13, d * 0.5, 0, 7);
        g.fill(); g.stroke();
      }
      if(st >= 4){
        g.fillStyle = '#EFA6B8';
        for(let i = 0; i < 5; i++){ const a = i / 5 * 6.283;
          g.beginPath(); g.ellipse(cx + Math.cos(a) * s * 0.13, base - s * 0.44 - hgt + Math.sin(a) * s * 0.13,
                                   s * 0.1, s * 0.08, a, 0, 7); g.fill(); g.stroke(); }
        g.fillStyle = '#FFE08A';
        g.beginPath(); g.arc(cx, base - s * 0.44 - hgt, s * 0.08, 0, 7); g.fill(); g.stroke();
      }
      break;
    }
    case 'ball': {
      shadow(cx, base, s * 0.3);
      const bx = home.ball.flying ? 0 : 0, bob = Math.abs(Math.sin(home.t * 1.4)) * s * 0.05;
      g.fillStyle = '#EFA6B8';
      g.beginPath(); g.arc(cx + bx, base - s * 0.28 - bob, s * 0.28, 0, 7); g.fill(); g.stroke();
      g.strokeStyle = '#E39FB2';
      g.beginPath(); g.arc(cx + bx, base - s * 0.28 - bob, s * 0.28, 2.4, 3.9); g.stroke();
      g.beginPath(); g.arc(cx + bx, base - s * 0.28 - bob, s * 0.28, -0.7, 0.8); g.stroke(); ink();
      break;
    }
    case 'bed': {
      shadow(cx, base, s * 0.95);
      box(cx - s * 0.92, base - s * 0.5, s * 1.84, s * 0.5, s * 0.1, '#C9A06A');
      box(cx - s * 0.88, base - s * 0.72, s * 1.2, s * 0.3, s * 0.12, '#FFF8F0');
      g.fillStyle = '#AD9ED4';
      rrect(cx - s * 0.2, base - s * 0.7, s * 1.1, s * 0.34, s * 0.12); g.fill(); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.35)';
      rrect(cx - s * 0.2, base - s * 0.7, s * 1.1, s * 0.12, s * 0.08); g.fill();
      box(cx + s * 0.78, base - s * 0.88, s * 0.14, s * 0.88, s * 0.06, '#C9A06A');
      break;
    }
    case 'fridge': {
      shadow(cx, base, s * 0.5);
      box(cx - s * 0.44, base - s * 1.3, s * 0.88, s * 1.3, s * 0.1, '#FFF8F0');
      g.beginPath(); g.moveTo(cx - s * 0.44, base - s * 0.85); g.lineTo(cx + s * 0.44, base - s * 0.85); g.stroke();
      g.fillStyle = '#D9C4A0';
      [[-0.78, 0.2], [-1.16, 0.2]].forEach(([y, h]) => {
        g.fillRect(cx + s * 0.26, base + s * y, s * 0.07, s * h);
        g.strokeRect(cx + s * 0.26, base + s * y, s * 0.07, s * h); });
      g.fillStyle = '#EFA6B8';
      g.beginPath(); g.arc(cx - s * 0.2, base - s * 1.1, s * 0.06, 0, 7); g.fill(); g.stroke();
      break;
    }
    case 'sink': {
      shadow(cx, base, s * 0.6);
      box(cx - s * 0.6, base - s * 0.62, s * 1.2, s * 0.62, s * 0.07, '#D9CDB4');
      box(cx - s * 0.52, base - s * 0.72, s * 1.04, s * 0.14, s * 0.05, '#C9DCE4');
      g.fillStyle = '#AFC9D4';
      g.beginPath(); g.ellipse(cx - s * 0.16, base - s * 0.65, s * 0.22, s * 0.06, 0, 0, 7); g.fill(); g.stroke();
      ink(LW() * 0.9);
      g.beginPath(); g.moveTo(cx + s * 0.3, base - s * 0.72);
      g.lineTo(cx + s * 0.3, base - s * 0.98);
      g.quadraticCurveTo(cx + s * 0.3, base - s * 1.08, cx + s * 0.12, base - s * 1.06); g.stroke(); ink();
      break;
    }
    case 'table': {
      shadow(cx, base, s * 0.6);
      box(cx - s * 0.62, base - s * 0.5, s * 1.24, s * 0.14, s * 0.06, '#D9B884');
      [-0.5, 0.5].forEach(d => { g.fillStyle = '#C9A06A';
        g.fillRect(cx + d * s - s * 0.05, base - s * 0.36, s * 0.1, s * 0.36);
        g.strokeRect(cx + d * s - s * 0.05, base - s * 0.36, s * 0.1, s * 0.36); });
      g.fillStyle = '#FFF8F0';
      g.beginPath(); g.ellipse(cx + s * 0.22, base - s * 0.56, s * 0.11, s * 0.09, 0, 0, 7);
      g.fill(); g.stroke();
      break;
    }
    case 'rug': {
      g.fillStyle = '#F6C8D4';
      g.beginPath(); g.ellipse(cx, base, s * 1.4, s * 0.42, 0, 0, 7); g.fill(); g.stroke();
      g.strokeStyle = '#E39FB2';
      g.beginPath(); g.ellipse(cx, base, s * 1.0, s * 0.3, 0, 0, 7); g.stroke();
      g.beginPath(); g.ellipse(cx, base, s * 0.58, s * 0.17, 0, 0, 7); g.stroke(); ink();
      break;
    }
    case 'sofa': {
      shadow(cx, base, s * 0.95);
      box(cx - s * 0.9, base - s * 0.6, s * 1.8, s * 0.46, s * 0.14, '#9DC9E8');
      box(cx - s * 0.98, base - s * 0.72, s * 0.3, s * 0.58, s * 0.12, '#8BBBDC');
      box(cx + s * 0.68, base - s * 0.72, s * 0.3, s * 0.58, s * 0.12, '#8BBBDC');
      box(cx - s * 0.66, base - s * 0.9, s * 1.32, s * 0.34, s * 0.12, '#B4D8F0');
      g.fillStyle = '#EFA6B8';
      rrect(cx + s * 0.1, base - s * 0.86, s * 0.34, s * 0.3, s * 0.08); g.fill(); g.stroke();
      break;
    }
    case 'tv': {
      shadow(cx, base, s * 0.62);
      box(cx - s * 0.32, base - s * 0.14, s * 0.64, s * 0.14, s * 0.04, '#B99A6E');
      box(cx - s * 0.66, base - s * 0.9, s * 1.32, s * 0.78, s * 0.09, '#8A7264');
      box(cx - s * 0.56, base - s * 0.82, s * 1.12, s * 0.6, s * 0.05, '#8FC0D8');
      g.save(); rrect(cx - s * 0.56, base - s * 0.82, s * 1.12, s * 0.6, s * 0.05); g.clip();
      g.fillStyle = 'rgba(255,255,255,.5)';
      g.beginPath(); g.moveTo(cx - s * 0.5, base - s * 0.22); g.lineTo(cx - s * 0.1, base - s * 0.86);
      g.lineTo(cx + s * 0.06, base - s * 0.86); g.lineTo(cx - s * 0.34, base - s * 0.22);
      g.closePath(); g.fill(); g.restore();
      break;
    }
    case 'shelf': {
      shadow(cx, base, s * 0.55);
      box(cx - s * 0.5, base - s * 1.1, s, s * 1.1, s * 0.07, '#C9A06A');
      [0.74, 0.39].forEach(t => { g.beginPath();
        g.moveTo(cx - s * 0.5, base - s * t); g.lineTo(cx + s * 0.5, base - s * t); g.stroke(); });
      [['#EFA6B8', 0], ['#8FC0D8', 1], ['#8FBF92', 2]].forEach(([c, i]) => {
        g.fillStyle = c; const bx = cx - s * 0.42 + i * s * 0.17;
        g.fillRect(bx, base - s * 0.72, s * 0.12, s * 0.3);
        g.strokeRect(bx, base - s * 0.72, s * 0.12, s * 0.3); });
      g.fillStyle = '#AD9ED4';
      g.fillRect(cx - s * 0.1, base - s * 0.37, s * 0.4, s * 0.3);
      g.strokeRect(cx - s * 0.1, base - s * 0.37, s * 0.4, s * 0.3);
      break;
    }
    case 'cake': {
      shadow(cx, base, s * 0.42);
      box(cx - s * 0.4, base - s * 0.5, s * 0.8, s * 0.5, s * 0.07, '#F7EEDC');
      g.fillStyle = '#EFA6B8';
      rrect(cx - s * 0.4, base - s * 0.62, s * 0.8, s * 0.18, s * 0.07); g.fill(); g.stroke();
      [-0.22, 0, 0.22].forEach(d => {
        g.fillStyle = '#FFF8F0';
        g.fillRect(cx + d * s - s * 0.02, base - s * 0.8, s * 0.04, s * 0.18);
        g.strokeRect(cx + d * s - s * 0.02, base - s * 0.8, s * 0.04, s * 0.18);
        g.fillStyle = '#FFE08A';
        g.beginPath(); g.ellipse(cx + d * s, base - s * 0.85, s * 0.05, s * 0.08, 0, 0, 7);
        g.fill(); g.stroke(); });
      break;
    }
    case 'piano': {
      shadow(cx, base, s * 0.6);
      box(cx - s * 0.56, base - s * 0.5, s * 1.12, s * 0.5, s * 0.07, '#AD9ED4');
      g.fillStyle = '#FFF8F0';
      g.fillRect(cx - s * 0.5, base - s * 0.52, s, s * 0.16);
      g.strokeRect(cx - s * 0.5, base - s * 0.52, s, s * 0.16);
      for(let i = 1; i < 7; i++){ const x = cx - s * 0.5 + s * (i / 7);
        g.beginPath(); g.moveTo(x, base - s * 0.52); g.lineTo(x, base - s * 0.36); g.stroke(); }
      break;
    }
    case 'lamp': {
      shadow(cx, base, s * 0.3);
      g.fillStyle = '#D9C4A0';
      g.beginPath(); g.moveTo(cx - s * 0.2, base); g.lineTo(cx + s * 0.2, base);
      g.lineTo(cx + s * 0.05, base - s * 0.8); g.lineTo(cx - s * 0.05, base - s * 0.8);
      g.closePath(); g.fill(); g.stroke();
      g.save(); g.globalAlpha = .28; g.fillStyle = '#FFE08A';
      g.beginPath(); g.arc(cx, base - s * 1.0, s * 0.8, 0, 7); g.fill(); g.restore();
      g.fillStyle = '#FFE9A8';
      g.beginPath(); g.moveTo(cx - s * 0.44, base - s * 0.8); g.lineTo(cx + s * 0.44, base - s * 0.8);
      g.lineTo(cx + s * 0.28, base - s * 1.2); g.lineTo(cx - s * 0.28, base - s * 1.2);
      g.closePath(); g.fill(); g.stroke();
      break;
    }
    case 'toybox': {
      shadow(cx, base, s * 0.5);
      box(cx - s * 0.5, base - s * 0.5, s, s * 0.5, s * 0.07, '#E0A45C');
      g.beginPath(); g.moveTo(cx - s * 0.5, base - s * 0.36); g.lineTo(cx + s * 0.5, base - s * 0.36); g.stroke();
      ['#EFA6B8', '#8FC0D8'].forEach((c, i) => {
        g.fillStyle = c;
        g.beginPath(); g.arc(cx - s * 0.2 + i * s * 0.4, base - s * 0.58, s * 0.13, 0, 7);
        g.fill(); g.stroke(); });
      break;
    }
    case 'cushion': {
      shadow(cx, base, s * 0.45);
      g.fillStyle = '#F6C8D4';
      rrect(cx - s * 0.42, base - s * 0.34, s * 0.84, s * 0.34, s * 0.16); g.fill(); g.stroke();
      g.strokeStyle = '#E39FB2';
      g.beginPath(); g.moveTo(cx - s * 0.3, base - s * 0.17); g.lineTo(cx + s * 0.3, base - s * 0.17);
      g.stroke(); ink();
      break;
    }
    case 'hammock': {
      shadow(cx, base, s * 0.7);
      ink(LW() * 0.9);
      [-1, 1].forEach(d => { g.beginPath();
        g.moveTo(cx + d * s * 0.8, base); g.lineTo(cx + d * s * 0.8, base - s * 0.9); g.stroke(); });
      g.fillStyle = '#EAD9B8';
      g.beginPath(); g.moveTo(cx - s * 0.8, base - s * 0.78);
      g.quadraticCurveTo(cx, base - s * 0.2, cx + s * 0.8, base - s * 0.78);
      g.quadraticCurveTo(cx, base - s * 0.42, cx - s * 0.8, base - s * 0.78);
      g.closePath(); g.fill(); g.stroke(); ink();
      break;
    }
    case 'trophy': {
      shadow(cx, base, s * 0.38);
      box(cx - s * 0.3, base - s * 0.16, s * 0.6, s * 0.16, s * 0.05, '#C9A06A');
      g.fillStyle = '#FFD36E';
      g.beginPath(); g.moveTo(cx - s * 0.3, base - s * 0.7); g.lineTo(cx + s * 0.3, base - s * 0.7);
      g.quadraticCurveTo(cx + s * 0.22, base - s * 0.2, cx, base - s * 0.16);
      g.quadraticCurveTo(cx - s * 0.22, base - s * 0.2, cx - s * 0.3, base - s * 0.7);
      g.closePath(); g.fill(); g.stroke();
      [-1, 1].forEach(d => { g.beginPath();
        g.ellipse(cx + d * s * 0.36, base - s * 0.56, s * 0.12, s * 0.16, 0, 0, 7); g.stroke(); });
      break;
    }
    /* 벽 */
    case 'frame': {
      box(cx - s * 0.44, base - s * 0.64, s * 0.88, s * 0.64, s * 0.05, '#C9A06A');
      box(cx - s * 0.34, base - s * 0.55, s * 0.68, s * 0.46, s * 0.03, '#FFF8F0');
      g.fillStyle = '#8FBF92';
      g.beginPath(); g.moveTo(cx - s * 0.26, base - s * 0.14); g.lineTo(cx - s * 0.04, base - s * 0.42);
      g.lineTo(cx + s * 0.14, base - s * 0.14); g.closePath(); g.fill(); g.stroke();
      break;
    }
    case 'clock': {
      g.fillStyle = '#FFF8F0';
      g.beginPath(); g.arc(cx, base - s * 0.36, s * 0.36, 0, 7); g.fill(); g.stroke();
      g.fillStyle = '#5A4A40';
      for(let i = 0; i < 12; i++){ const a = i / 12 * 6.283;
        g.beginPath(); g.arc(cx + Math.cos(a) * s * 0.28, base - s * 0.36 + Math.sin(a) * s * 0.28,
                             s * 0.018, 0, 7); g.fill(); }
      const a = home.t * 0.5; ink(LW() * 0.8);
      g.beginPath(); g.moveTo(cx, base - s * 0.36);
      g.lineTo(cx + Math.cos(a) * s * 0.17, base - s * 0.36 + Math.sin(a) * s * 0.17);
      g.moveTo(cx, base - s * 0.36);
      g.lineTo(cx + Math.cos(a * 6) * s * 0.25, base - s * 0.36 + Math.sin(a * 6) * s * 0.25);
      g.stroke(); ink();
      break;
    }
    case 'garland': {
      const w = s * 1.9;
      g.beginPath(); g.moveTo(cx - w / 2, base - s * 0.5);
      g.quadraticCurveTo(cx, base - s * 0.16, cx + w / 2, base - s * 0.5); g.stroke();
      ['#EFA6B8', '#8FC0D8', '#8FBF92', '#FFE08A', '#AD9ED4'].forEach((c, i) => {
        const t = (i + 0.5) / 5, x = cx - w / 2 + w * t;
        const y = base - s * 0.5 + Math.sin(t * Math.PI) * s * 0.34;
        g.fillStyle = c; g.beginPath(); g.moveTo(x - s * 0.11, y); g.lineTo(x + s * 0.11, y);
        g.lineTo(x, y + s * 0.28); g.closePath(); g.fill(); g.stroke(); });
      break;
    }
    case 'poster': {
      box(cx - s * 0.4, base - s * 0.7, s * 0.8, s * 0.7, s * 0.04, '#FFF3D6');
      g.fillStyle = '#EFA6B8';
      g.beginPath(); g.arc(cx, base - s * 0.45, s * 0.18, 0, 7); g.fill(); g.stroke();
      g.fillStyle = '#8A7264';
      g.fillRect(cx - s * 0.26, base - s * 0.2, s * 0.52, s * 0.05);
      g.fillRect(cx - s * 0.18, base - s * 0.12, s * 0.36, s * 0.04);
      break;
    }
    case 'window2': { drawWindow(cx, base - s * 0.5, s * 0.55, false); break; }
    /* 방 자체 */
    case 'wardrobe': {
      shadow(cx, base, s * 0.55);
      box(cx - s * 0.52, base - s * 1.4, s * 1.04, s * 1.4, s * 0.09, '#C9A06A');
      g.beginPath(); g.moveTo(cx, base - s * 1.34); g.lineTo(cx, base - s * 0.06); g.stroke();
      g.fillStyle = '#B98F58';
      g.fillRect(cx - s * 0.46, base - s * 1.34, s * 0.92, s * 0.1);
      g.strokeRect(cx - s * 0.46, base - s * 1.34, s * 0.92, s * 0.1);
      g.fillStyle = '#F3EAE1';
      [-0.11, 0.11].forEach(d => { g.beginPath();
        g.arc(cx + d * s, base - s * 0.7, s * 0.055, 0, 7); g.fill(); g.stroke(); });
      break;
    }
    case 'gacha': {
      shadow(cx, base, s * 0.5);
      box(cx - s * 0.46, base - s * 1.34, s * 0.92, s * 1.34, s * 0.11, '#EFA6B8');
      g.fillStyle = '#FFF8F0';
      g.beginPath(); g.arc(cx, base - s * 0.95, s * 0.33, 0, 7); g.fill(); g.stroke();
      ['#8FBF92', '#8FC0D8', '#FFE08A', '#AD9ED4'].forEach((c, i) => {
        g.fillStyle = c;
        g.beginPath(); g.arc(cx - s * 0.15 + (i % 2) * s * 0.3,
                             base - s * 1.04 + Math.floor(i / 2) * s * 0.18, s * 0.08, 0, 7);
        g.fill(); g.stroke(); });
      g.fillStyle = '#F3EAE1';
      rrect(cx - s * 0.2, base - s * 0.5, s * 0.4, s * 0.24, s * 0.05); g.fill(); g.stroke();
      break;
    }
    case 'door': {
      box(cx - s * 0.58, base - s * 1.62, s * 1.16, s * 1.62, s * 0.09, '#D98E6A');
      box(cx - s * 0.44, base - s * 1.48, s * 0.88, s * 0.54, s * 0.06, '#C87A58');
      box(cx - s * 0.44, base - s * 0.86, s * 0.88, s * 0.7, s * 0.06, '#C87A58');
      g.fillStyle = '#FFE08A';
      g.beginPath(); g.arc(cx + s * 0.36, base - s * 0.8, s * 0.08, 0, 7); g.fill(); g.stroke();
      g.fillStyle = '#F3EAE1';
      rrect(cx - s * 0.32, base - s * 1.8, s * 0.64, s * 0.2, s * 0.06); g.fill(); g.stroke();
      g.fillStyle = '#C9784F';
      g.beginPath(); g.arc(cx, base - s * 1.7, s * 0.05, 0, 7); g.fill(); g.stroke();
      break;
    }
  }
  g.restore();
}

/* ===============================================================
   정원 — 집 밖. 가게 · 뽑기 기계 · 알바 게시판이 있다
   =============================================================== */
const yardDeco = [];
function seedYard(){
  yardDeco.length = 0;
  for(let i = 0; i < 7; i++)
    yardDeco.push({ x: (i * 0.147 + 0.05) % 1, y: 0.1 + ((i * 0.31) % 0.75),
                    k: i % 3 === 0 ? 'flower' : 'tuft', c: ['#EFA6B8','#FFE08A','#FFFFFF'][i % 3] });
}
seedYard();

function drawYard(){
  const wb = wallBot();
  /* 하늘 */
  const sk = g.createLinearGradient(0, 0, 0, wb);
  sk.addColorStop(0, '#CFEAF7'); sk.addColorStop(1, '#EAF6FB');
  g.fillStyle = sk; g.fillRect(0, 0, W, wb);
  /* 구름 */
  g.save(); g.fillStyle = '#FFFFFF'; g.globalAlpha = .9;
  [[0.14, 0.22, 1], [0.52, 0.14, 0.75], [0.82, 0.26, 0.9]].forEach(([cx, cy, sc]) => {
    const x = W * cx, y = wb * cy, r = wb * 0.11 * sc;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.arc(x + r * 0.9, y + r * 0.2, r * 0.75, 0, 7);
    g.arc(x - r * 0.9, y + r * 0.25, r * 0.65, 0, 7); g.fill();
  });
  g.restore();
  /* 먼 언덕 */
  g.fillStyle = '#C3E3C0';
  g.beginPath(); g.moveTo(0, wb);
  g.quadraticCurveTo(W * 0.22, wb - H * 0.12, W * 0.46, wb);
  g.quadraticCurveTo(W * 0.72, wb - H * 0.16, W, wb);
  g.closePath(); g.fill();
  /* 잔디 */
  const gr = g.createLinearGradient(0, wb, 0, H);
  gr.addColorStop(0, '#A9D9A2'); gr.addColorStop(1, '#8CC486');
  g.fillStyle = gr; g.fillRect(0, wb, W, H - wb);
  /* 울타리 */
  const fy = wb, fh = (H - wb) * 0.12;
  g.save(); ink(LW() * 0.8); g.fillStyle = '#E3D2B4';
  for(let x = 0; x < W; x += W * 0.045){
    rrect(x, fy - fh, W * 0.018, fh, W * 0.008); g.fill(); g.stroke();
  }
  g.beginPath(); g.moveTo(0, fy - fh * 0.58); g.lineTo(W, fy - fh * 0.58); g.stroke();
  g.restore();
  /* 흙길 */
  g.save(); g.fillStyle = '#E4D2AE';
  g.beginPath();
  g.moveTo(rx(0.09), wb); g.lineTo(rx(0.17), wb);
  g.lineTo(rx(0.62), H); g.lineTo(rx(0.30), H);
  g.closePath(); g.fill();
  g.globalAlpha = .35; g.fillStyle = '#CDB78F';
  for(let i = 1; i < 6; i++){
    const t = i / 6, y = wb + (H - wb) * t;
    g.beginPath(); g.ellipse(rx(0.13 + t * 0.33), y, W * 0.02, (H - wb) * 0.02, 0, 0, 7); g.fill();
  }
  g.restore();
  /* 풀·꽃 */
  yardDeco.forEach(d => {
    const x = rx(d.x), y = yAt(d.y), s = 9 * uiK() * depthAt(y);
    g.save(); ink(LW() * 0.6);
    if(d.k === 'flower'){
      g.strokeStyle = '#6FA86B';
      g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - s * 1.4); g.stroke();
      g.fillStyle = d.c; ink(LW() * 0.6);
      for(let i = 0; i < 5; i++){
        const a = i / 5 * 6.283;
        g.beginPath(); g.arc(x + Math.cos(a) * s * 0.42, y - s * 1.4 + Math.sin(a) * s * 0.42, s * 0.34, 0, 7);
        g.fill(); g.stroke();
      }
      g.fillStyle = '#FFE08A'; g.beginPath(); g.arc(x, y - s * 1.4, s * 0.26, 0, 7); g.fill(); g.stroke();
    }else{
      g.strokeStyle = '#6FA86B'; g.lineWidth = LW() * 0.8;
      [-0.5, 0, 0.5].forEach(o => {
        g.beginPath(); g.moveTo(x + o * s, y);
        g.quadraticCurveTo(x + o * s * 2, y - s * 0.9, x + o * s * 3.2, y - s * 1.3); g.stroke();
      });
    }
    g.restore();
  });
}

/* 정원에 있는 것 하나 */
function drawYardThing(id, cx, base, s, glow){
  g.save();
  if(glow){
    g.save(); g.globalAlpha = 0.28 + Math.sin(home.t * 5) * 0.16;
    g.fillStyle = '#FFE08A';
    g.beginPath(); g.ellipse(cx, base - s * 0.5, s * 1.2, s * 0.95, 0, 0, 7); g.fill(); g.restore();
  }
  ink();
  const label = (txt, y, col) => {
    g.fillStyle = col || '#5A4A40'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '700 ' + (14 * uiK()) + 'px Gaegu, sans-serif';
    g.fillText(txt, cx, y);
  };
  switch(id){
    case 'house': {                                   /* 우리 집 */
      shadow(cx, base, s * 0.9);
      const w = s * 1.7, h = s * 1.35;
      box(cx - w / 2, base - h, w, h, s * 0.1, '#FFF3E2');
      g.fillStyle = '#D98E72';                        /* 지붕 */
      g.beginPath(); g.moveTo(cx - w * 0.62, base - h);
      g.lineTo(cx, base - h - s * 0.62); g.lineTo(cx + w * 0.62, base - h);
      g.closePath(); g.fill(); g.stroke();
      box(cx - s * 0.28, base - s * 0.86, s * 0.56, s * 0.86, s * 0.09, '#C98A5E');   /* 문 */
      g.fillStyle = '#FFE08A';
      g.beginPath(); g.arc(cx + s * 0.16, base - s * 0.44, s * 0.05, 0, 7); g.fill(); g.stroke();
      box(cx + s * 0.44, base - h + s * 0.26, s * 0.38, s * 0.32, s * 0.06, '#CDEBFA'); /* 창 */
      label('우리 집', base - h - s * 0.82);
      break;
    }
    case 'shop': {                                    /* 가게 */
      shadow(cx, base, s * 1.0);
      const w = s * 1.9, h = s * 1.4;
      box(cx - w / 2, base - h, w, h, s * 0.1, '#FFFBF0');
      /* 줄무늬 차양 */
      const ay = base - h + s * 0.34, ah = s * 0.32;
      for(let i = 0; i < 6; i++){
        g.fillStyle = i % 2 ? '#FFFBF0' : '#EFA6B8';
        const x0 = cx - w * 0.56 + (w * 1.12 / 6) * i;
        g.beginPath(); g.moveTo(x0, ay); g.lineTo(x0 + w * 1.12 / 6, ay);
        g.lineTo(x0 + w * 1.12 / 6, ay + ah); g.lineTo(x0, ay + ah); g.closePath();
        g.fill(); g.stroke();
      }
      box(cx - w * 0.38, ay + ah + s * 0.12, w * 0.76, s * 0.6, s * 0.07, '#DFF0F8');   /* 진열창 */
      g.fillStyle = '#E7B075';
      [-0.2, 0.05, 0.28].forEach((o, i) => {
        g.beginPath(); g.arc(cx + o * w, ay + ah + s * 0.42, s * 0.11, 0, 7); g.fill(); g.stroke(); });
      /* 간판 */
      box(cx - s * 0.62, base - h - s * 0.46, s * 1.24, s * 0.42, s * 0.1, '#FFE08A');
      label('상점', base - h - s * 0.25);
      break;
    }
    case 'gmach': {                                   /* 뽑기 기계 */
      shadow(cx, base, s * 0.5);
      const w = s * 0.86, h = s * 1.25;
      box(cx - w / 2, base - h * 0.52, w, h * 0.52, s * 0.08, '#EFA6B8');   /* 아래 통 */
      g.fillStyle = '#CDEBFA';                                             /* 유리 돔 */
      g.beginPath(); g.arc(cx, base - h * 0.58, w * 0.52, Math.PI, 0); g.fill(); g.stroke();
      g.save(); g.beginPath(); g.arc(cx, base - h * 0.58, w * 0.52, Math.PI, 0); g.clip();
      ['#FFE08A','#8FC0D8','#8FBF92','#EFA6B8','#AD9ED4'].forEach((c, i) => {
        g.fillStyle = c;
        g.beginPath(); g.arc(cx - w * 0.3 + (i % 3) * w * 0.3, base - h * 0.62 + Math.floor(i / 3) * w * 0.26,
                             w * 0.14, 0, 7); g.fill();
      });
      g.restore();
      g.beginPath(); g.arc(cx, base - h * 0.58, w * 0.52, Math.PI, 0); g.stroke();
      g.fillStyle = '#FFF8F0';                                             /* 손잡이 */
      g.beginPath(); g.arc(cx, base - h * 0.3, w * 0.12, 0, 7); g.fill(); g.stroke();
      box(cx - w * 0.26, base - h * 0.16, w * 0.52, h * 0.13, s * 0.04, '#F3EAE1');   /* 배출구 */
      label('뽑기', base - h - s * 0.1);
      break;
    }
    case 'board': {                                   /* 알바 게시판 */
      shadow(cx, base, s * 0.55);
      ink(); g.strokeStyle = '#A3805A'; g.lineWidth = LW() * 1.6;
      g.beginPath(); g.moveTo(cx - s * 0.3, base); g.lineTo(cx - s * 0.3, base - s * 0.7);
      g.moveTo(cx + s * 0.3, base); g.lineTo(cx + s * 0.3, base - s * 0.7); g.stroke();
      ink();
      box(cx - s * 0.72, base - s * 1.4, s * 1.44, s * 0.78, s * 0.08, '#E3C79C');
      ['#FFF8F0','#FDF2DE','#FFFFFF'].forEach((c, i) => {
        g.fillStyle = c;
        const px = cx - s * 0.52 + i * s * 0.44;
        rrect(px, base - s * 1.3, s * 0.36, s * 0.42, s * 0.03); g.fill(); g.stroke();
        g.strokeStyle = '#C2A88A'; g.lineWidth = LW() * 0.5;
        for(let l = 0; l < 3; l++){
          g.beginPath(); g.moveTo(px + s * 0.06, base - s * 1.22 + l * s * 0.1);
          g.lineTo(px + s * 0.3, base - s * 1.22 + l * s * 0.1); g.stroke();
        }
        ink();
      });
      label('알바', base - s * 1.55);
      break;
    }
  }
  g.restore();
}

"use strict";
/* 두기 — 행동과 돌봄 — 꺅두기 하우스 */

/* ===============================================================
   두기 — 행동 · 돌봄 조작 · 그리기
   =============================================================== */
const home = {
  x: 0.5, y: 0.75, vx: 0, vy: 0, face: 1, t: 0,
  near: null, target: null, autoAct: null,
  act: null,                 // 진행 중인 동작 {kind, t, ...}
  bubble: '', bubbleT: 0, say: '', sayT: 0,
  parts: [], dusts: [],
  ball: { x: 0.5, y: 0.6, vx: 0, vy: 0, fly: false, home: true },
  idle: 0, idleGoal: null, pet: { n: 0, dist: 0, t: 0 },
  drag: null, aim: null, sweep: false, hover: null
};
const keys = {};
let deco = false;                          // 꾸미기 모드
let mini = null;                           // 오버레이 미니게임 {kind,...}

/* ===== 먼지 ===== */
function seedDust(){
  home.dusts = [];
  const n = S.dugi.clean < 25 ? 5 : S.dugi.clean < 45 ? 4 : S.dugi.clean < 65 ? 2 : 0;
  for(let i = 0; i < n; i++)
    home.dusts.push({ x: 0.1 + ((i * 0.27 + 0.13) % 0.8), y: 0.3 + ((i * 0.37) % 0.6),
                      seed: Math.random() * 6, r: 1 });
}
seedDust();

/* ===== 다가갈 수 있는 것 ===== */
function homeSpots(){
  if(place === 'yard') return YARD.map(o => ({ ...o }));
  const list = [];
  for(const o of LAY.floor){
    const f = FURN(o.id);
    if(f && f.act) list.push({ id:o.id, name:f.name, x:o.x, y:o.y, act:f.act });
    const p = PLACES.find(q => q.id === o.id);
    if(p && p.act) list.push({ id:o.id, name:p.name, x:o.x, y:o.y, act:p.act });
  }
  list.push({ id:'door', name:'현관', x:LAY.door.x, y:0.02, act:'out' });
  return list;
}
const furnPos = id => { const o = spotOf(id); return o ? { x:o.x, y:o.y } : { x:0.5, y:0.5 }; };

/* ===============================================================
   돌봄
   =============================================================== */
function careGain(kind, mult){
  const c = CARE[kind]; mult = mult || 1;
  const add = { feed:{ full:24 }, wash:{ clean:30 }, play:{ fun:22, energy:-8 },
                sleep:{ energy:34, fun:3 }, water:{ fun:12 }, clean:{ clean:14, fun:3 } }[kind] || {};
  for(const k in add){
    let v = add[k] * (v0 => v0)(1);
    if(kind === 'feed'  && k === 'full')   v += boost('full');
    if(kind === 'sleep' && k === 'energy') v += boost('energy');
    if(kind === 'wash'  && k === 'clean')  v += boost('clean');
    if((kind === 'play' || kind === 'water') && k === 'fun') v += boost('fun');
    addStat(k, v * (k === 'energy' && v < 0 ? 1 : mult));
  }
  addLove((CARE[kind].love || 3) * mult);
  clearRequest(kind);
  bumpDaily('care:' + kind, 1);
  home.bubble = CARE[kind].verb; home.bubbleT = 1.8;
  save(); refreshBar(); paintCareBar();
}
function canCare(kind){
  const d = S.dugi;
  if(kind === 'feed'  && d.full   >= 98) return { no:'배가 아주 불러요' };
  if(kind === 'sleep' && d.energy >= 98) return { no:'지금은 안 졸려요' };
  if(kind === 'wash'  && d.clean  >= 98) return { no:'이미 뽀송뽀송해요' };
  if(kind === 'clean' && !home.dusts.length) return { no:'방이 깨끗해요' };
  if(kind === 'play'  && d.energy <= 8)  return { no:'기운이 없어요. 재워주세요' };
  return true;
}
/* 버튼이나 가구에서 시작 */
function doCare(kind){
  if(deco) return false;
  if(place !== 'room'){ toast('집 안에서만 할 수 있어요', ''); sfxNo(); return false; }
  const ok = canCare(kind);
  if(ok !== true){ toast(ok.no, ''); sfxNo(); return false; }
  if(kind === 'feed' || kind === 'wash'){ openMini(kind); return true; }
  if(kind === 'clean'){ home.sweep = true; toast('먼지를 문질러 치워요', ''); return true; }
  if(kind === 'play'){ armBall(); return true; }
  if(kind === 'sleep'){ goAct('bed', 'sleep'); return true; }
  if(kind === 'water'){ goAct('plant', 'water'); return true; }
  return false;
}
/* 가구까지 걸어가서 하는 동작 */
function goAct(furnId, kind){
  const p = furnPos(furnId);
  home.target = { x: p.x + (kind === 'sleep' ? 0.0 : 0.045), y: Math.min(0.95, p.y + 0.16) };
  home.autoAct = { act:'__do', kind };
}
function beginAct(kind){
  home.act = { kind, t: 0 };
  if(kind === 'sleep') sfxCare('sleep');
  if(kind === 'water') sfxCare('water');
}
function finishAct(kind){
  if(kind === 'sleep'){ careGain('sleep'); puffs('z', 10); }
  if(kind === 'water'){
    const st = (S.dugi.plant || 0) + 1;
    if(st > 4){ S.dugi.plant = 0; addClover(120); addLove(8);
                toast('꽃이 피었어요!', '클로버 +120'); sfxCoin(5); }
    else S.dugi.plant = st;
    careGain('water'); puffs('drop', 12);
  }
}
function puffs(shape, n){
  const cx = rx(home.x), cy = yAt(home.y);
  const col = { z:'#AD9ED4', drop:'#8FC0D8', heart:'#EFA6B8', dot:'#E0A45C', bub:'#8FC0D8' }[shape];
  for(let i = 0; i < n; i++)
    home.parts.push({ x: cx + (Math.random() - 0.5) * 70, y: cy - 40 - Math.random() * 40,
                      vx: (Math.random() - 0.5) * 60, vy: -30 - Math.random() * 70,
                      life: 1 + Math.random() * 0.6, t: 0, c: col, s: shape });
}

/* ===== 공놀이 ===== */
function armBall(){
  const p = furnPos('ball');
  home.ball.home = false; home.ball.fly = false;
  home.ball.x = p.x; home.ball.y = Math.min(0.9, p.y + 0.12);
  home.ball.vx = home.ball.vy = 0;
  toast('공을 끌었다 놓으면 던져요', '두기가 물어와요');
}
function throwBall(vx, vy){
  home.ball.fly = true; home.ball.vx = vx; home.ball.vy = vy;
  sfxCare('play');
}
function updateBall(dt){
  const b = home.ball;
  if(b.home || !b.fly) return;
  b.x += b.vx * dt; b.y += b.vy * dt;
  b.vx *= 0.955; b.vy = b.vy * 0.955 + 0.25 * dt;
  if(b.x < 0.04){ b.x = 0.04; b.vx *= -0.5; }
  if(b.x > 0.96){ b.x = 0.96; b.vx *= -0.5; }
  if(b.y < 0.06){ b.y = 0.06; b.vy *= -0.5; }
  if(b.y > 0.96){ b.y = 0.96; b.vy *= -0.5; }
  if(Math.abs(b.vx) + Math.abs(b.vy) < 0.08){
    b.fly = false;
    home.target = { x: b.x, y: b.y };          // 두기가 물어오러 간다
    home.autoAct = { act:'__fetch' };
  }
}
function fetchBall(){
  const d = Math.hypot(home.ball.x - home.x, home.ball.y - home.y);
  home.ball.home = true;
  const far = Math.min(1.6, 0.8 + d * 2);
  careGain('play', far);
  home.bubble = '꺅! 재밌다'; home.bubbleT = 1.8;
  for(let i = 0; i < 8; i++) puffs('heart', 1);
}

/* ===============================================================
   오버레이 미니 — 밥 주기 · 씻기기
   =============================================================== */
function openMini(kind){
  if(kind === 'feed'){
    const pool = FOODS.slice().sort(() => Math.random() - 0.5).slice(0, 4);
    if(S.bag.snack) pool.push({ id:'snack', name:'간식', color:'#F6C88B', full:18, item:true });
    mini = { kind:'feed', t:0, foods:pool, picked:null, chew:0 };
  }else{
    const spots = [];
    const n = 7;
    for(let i = 0; i < n; i++)
      spots.push({ x:(Math.random() - 0.5) * 0.52, y:0.22 + Math.random() * 0.52,
                   r:0.055 + Math.random() * 0.045, hp:2, seed:Math.random() * 6 });
    mini = { kind:'wash', t:0, spots, total:n, bubbles:[], soap:!!S.bag.soap };
  }
  $('careBar').hidden = true;
}
function closeMini(done){
  if(mini && mini.kind === 'wash'){
    const left = mini.spots.filter(s => s.hp > 0).length;
    const ratio = 1 - left / mini.total;
    if(ratio > 0.1){
      careGain('wash', 0.4 + ratio * 0.6);
      if(ratio >= 0.999){ addLove(4); toast('반짝반짝!', '완벽하게 씻었어요'); }
      if(mini.soap){ S.bag.soap--; if(!S.bag.soap) delete S.bag.soap; }
    }
  }
  mini = null;
  $('careBar').hidden = !(mode === 'home' && place === 'room');
  save(); refreshBar(); paintCareBar();
}
function feedPick(f){
  if(!mini || mini.picked) return;
  mini.picked = f; mini.t = 0;
  const fav = f.id === S.dugi.fav;
  const mul = fav ? 2 : 1;
  addStat('full', (f.full || 20) + boost('full'));
  addStat('fun', fav ? 10 : 4);
  addLove((CARE.feed.love || 6) * mul);
  clearRequest('feed'); bumpDaily('care:feed', 1);
  if(f.item){ S.bag.snack--; if(!S.bag.snack) delete S.bag.snack; }
  if(fav){ toast('제일 좋아하는 ' + f.name + '!', '마음 두 배'); }
  else if(!S.favFound && Math.random() < 0.5) home.say = '음… 그냥 그래', home.sayT = 1.6;
  sfxCare('feed');
  save(); refreshBar();
}
function updateMini(dt){
  if(!mini) return;
  mini.t += dt;
  if(mini.kind === 'feed'){
    if(mini.picked && mini.t > 1.5) closeMini(true);
    return;
  }
  if(mini.kind === 'wash'){
    for(let i = mini.bubbles.length - 1; i >= 0; i--){
      const b = mini.bubbles[i]; b.t += dt; b.y -= b.v * dt;
      if(b.t > b.life) mini.bubbles.splice(i, 1);
    }
    if(!mini.spots.some(s => s.hp > 0)) closeMini(true);
  }
}
/* 미니 안에서 문지르기 */
function miniScrub(px, py, moved){
  if(!mini || mini.kind !== 'wash') return;
  const cx = W * 0.5, cy = H * 0.56, sz = Math.min(W * 0.42, H * 0.6);
  mini.spots.forEach(s => {
    if(s.hp <= 0) return;
    const sxp = cx + s.x * sz, syp = cy - sz * 0.5 + s.y * sz;
    if(Math.hypot(px - sxp, py - syp) < sz * (s.r + 0.05)){
      s.hp -= (mini.soap ? 2 : 1) * (moved ? 1 : 0.2);
      if(s.hp <= 0){
        sfxCare('wash');
        for(let i = 0; i < 6; i++) mini.bubbles.push({ x:sxp + (Math.random() - .5) * 30,
          y:syp, v:40 + Math.random() * 50, r:5 + Math.random() * 9, t:0, life:1 });
      }
    }
  });
}

/* ===============================================================
   진행
   =============================================================== */
function updateHome(dt){
  home.t += dt;
  if(home.bubbleT > 0) home.bubbleT -= dt;
  if(home.sayT > 0) home.sayT -= dt;
  if(leveledUp > 0) leveledUp -= dt;
  if(home.pet.t > 0) home.pet.t -= dt;
  updateBall(dt);
  if(mini){ updateMini(dt); return; }

  /* 진행 중인 동작 */
  if(home.act){
    home.act.t += dt;
    const dur = home.act.kind === 'sleep' ? 2.8 : 1.6;
    if(home.act.t > dur){ finishAct(home.act.kind); home.act = null; }
  }else if(!deco){
    let ax = 0, ay = 0;
    if(keys.a) ax -= 1; if(keys.d) ax += 1;
    if(keys.w) ay -= 1; if(keys.s) ay += 1;
    if(ax || ay){ home.target = null; home.idle = 0; home.idleGoal = null; }
    if(home.target){
      const dx = home.target.x - home.x, dy = home.target.y - home.y;
      if(Math.hypot(dx * 1.7, dy) < 0.03){
        home.target = null;
        const a = home.autoAct; home.autoAct = null;
        if(a){
          if(a.act === '__do') beginAct(a.kind);
          else if(a.act === '__fetch') fetchBall();
          else act(a);
        }
      }else{ ax = Math.sign(dx) * Math.min(1, Math.abs(dx) * 12);
             ay = Math.sign(dy) * Math.min(1, Math.abs(dy) * 7); }
    }
    /* 혼자 놀기 */
    if(!home.target && !ax && !ay){
      home.idle += dt;
      if(home.idle > 5 && !home.idleGoal) pickIdle();
    }
    const sp = 0.78;
    home.vx += (ax * sp - home.vx) * Math.min(1, dt * 13);
    home.vy += (ay * sp * 0.85 - home.vy) * Math.min(1, dt * 13);
    home.x = Math.max(0.03, Math.min(0.97, home.x + home.vx * dt));
    home.y = Math.max(0.02, Math.min(0.98, home.y + home.vy * dt));
    if(Math.abs(home.vx) > 0.02) home.face = home.vx > 0 ? 1 : -1;
  }

  /* 가까운 것 — 문 앞에 서면 문이 먼저 */
  let near = null, bd = (place === 'yard' ? 0.17 : 0.075);
  for(const s of homeSpots()){
    const d = Math.hypot((s.x - home.x) * 1.4, ((s.y || 0) - home.y) * 0.8);
    if(d < bd){ bd = d; near = s; }
  }
  if(place === 'room' && home.y < 0.12 && Math.abs(home.x - LAY.door.x) < 0.10)
    near = { id:'door', name:'현관', x:LAY.door.x, y:0.02, act:'out' };
  home.near = near;

  for(let i = home.parts.length - 1; i >= 0; i--){
    const p = home.parts[i]; p.t += dt;
    if(p.t >= p.life){ home.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 26 * dt;
  }
}

/* 혼자 하는 행동 */
const YARD_SAY = ['바깥 공기 좋다', '가게 구경할까?', '뽑기 한 번…', '오늘도 알바?', '꺅!'];
const IDLE_SAY = ['심심해~', '오늘 뭐 하지?', '배고픈가?', '낮잠 잘까', '꺅', '집이 좋아',
                  '알바 가야 하나', '두기두기'];
function pickIdle(){
  home.idle = 0;
  const d = S.dugi;
  if(place === 'yard'){
    home.target = { x:0.08 + Math.random() * 0.84, y:0.25 + Math.random() * 0.68 };
    home.idleGoal = 'walk';
    if(Math.random() < 0.45){
      home.say = YARD_SAY[Math.floor(Math.random() * YARD_SAY.length)]; home.sayT = 2.2;
    }
    return;
  }
  /* 조르는 게 있으면 그 앞에서 기다린다 */
  if(S.req){
    const f = FURNITURE.find(x => x.act === S.req.kind);
    if(f && hasFurn(f.id)){
      const p = furnPos(f.id);
      home.target = { x:p.x, y:Math.min(0.95, p.y + 0.15) };
      home.say = REQ_LINE[S.req.kind]; home.sayT = 2.4;
      home.idleGoal = 'wait';
      return;
    }
  }
  const picks = [];
  if(hasFurn('tv')) picks.push('tv');
  if(hasFurn('bed') && d.energy < 60) picks.push('bed');
  if(hasFurn('sofa')) picks.push('sofa');
  picks.push('walk', 'walk');
  const p = picks[Math.floor(Math.random() * picks.length)];
  if(p === 'walk'){
    home.target = { x:0.08 + Math.random() * 0.84, y:0.2 + Math.random() * 0.7 };
  }else{
    const q = furnPos(p);
    home.target = { x:q.x + (Math.random() - 0.5) * 0.05, y:Math.min(0.95, q.y + 0.16) };
  }
  if(Math.random() < 0.5 && loveLv(S.dugi.love) >= 4){
    home.say = IDLE_SAY[Math.floor(Math.random() * IDLE_SAY.length)]; home.sayT = 2.2;
  }
  home.idleGoal = p;
}

function act(spot){
  if(!spot) return;
  if(spot.act === 'wardrobe') return openModal('wardrobe');
  if(spot.act === 'gacha')    return openModal('gacha');
  if(spot.act === 'shop')     return openModal('shop');
  if(spot.act === 'job')      return openModal('job');
  if(spot.act === 'out')      return goYard();
  if(spot.act === 'in')       return goHome();
  doCare(spot.act);
}

/* ===============================================================
   포인터 — 쓰다듬기 · 청소 · 공 던지기 · 꾸미기
   =============================================================== */
function toRoom(px, py){
  return { x:(px - roomL()) / roomW(), y:(py - walkTop()) / (walkBot() - walkTop()) };
}
function onDugi(px, py){
  const cx = rx(home.x), cy = yAt(home.y), s = dugiH();
  return px > cx - s * 0.4 && px < cx + s * 0.4 && py > cy - s && py < cy + s * 0.1;
}
function homeDown(px, py){
  if(mini){
    if(mini.kind === 'wash') miniScrub(px, py, false);
    return;
  }
  const r = toRoom(px, py);
  if(deco){
    let best = null, bd = 0.08;
    LAY.floor.concat(LAY.wall).forEach(o => {
      const oy = o.y === undefined ? -0.1 : o.y;
      const d = Math.hypot((o.x - r.x) * 1.2, (oy - r.y) * 0.7);
      if(d < bd){ bd = d; best = o; }
    });
    if(best) home.drag = { id:best.id, wall:best.y === undefined };
    return;
  }
  if(!home.ball.home && !home.ball.fly){
    const b = home.ball;
    if(Math.hypot((b.x - r.x) * 1.4, (b.y - r.y) * 0.8) < 0.07){
      home.aim = { x:r.x, y:r.y, bx:b.x, by:b.y }; return;
    }
  }
  if(home.sweep){
    sweepAt(r); return;
  }
  if(onDugi(px, py)){ home.pet.dist = 0; home.pet.on = true; petOnce(); return; }
  /* 가까운 가구를 누르면 걸어가서 실행 */
  let spot = null, bd = (place === 'yard' ? 0.2 : 0.09);
  for(const s of homeSpots()){
    const d = Math.hypot((s.x - r.x) * 1.3, ((s.y || 0) - r.y) * 0.7);
    if(d < bd){ bd = d; spot = s; }
  }
  if(spot){
    home.target = place === 'yard'
      ? { x:spot.x, y:Math.min(0.95, (spot.y || 0.05) + 0.13) }
      : { x:spot.x + (spot.act === 'job' ? 0 : 0.04),
          y:Math.min(0.95, (spot.y || 0.05) + 0.16) };
    home.autoAct = spot;
  }else{
    home.target = { x:Math.max(0.03, Math.min(0.97, r.x)),
                    y:Math.max(0.02, Math.min(0.98, r.y)) };
    home.autoAct = null;
  }
  home.idle = 0;
}
function homeMove(px, py, down){
  home.hover = { x:px, y:py };
  if(mini){ if(down && mini.kind === 'wash') miniScrub(px, py, true); return; }
  const r = toRoom(px, py);
  if(!down) return;
  if(deco && home.drag){
    const id = home.drag.id;
    S.pos[id] = home.drag.wall
      ? { x:Math.max(0.05, Math.min(0.95, r.x)) }
      : { x:Math.max(0.04, Math.min(0.96, r.x)), y:Math.max(0.08, Math.min(0.78, r.y)) };
    relayout();
    return;
  }
  if(home.aim){ home.aim.x = r.x; home.aim.y = r.y; return; }
  if(home.sweep){ sweepAt(r); return; }
  if(home.pet.on){
    const d = Math.hypot(px - (home.pet.px || px), py - (home.pet.py || py));
    home.pet.dist += d;
    home.pet.px = px; home.pet.py = py;
    if(home.pet.dist > 42){ home.pet.dist = 0; petOnce(); }
  }
}
function homeUp(){
  if(home.drag){ home.drag = null; save(); return; }
  if(home.aim){
    const b = home.ball;
    const vx = (b.x - home.aim.x) * 2.6, vy = (b.y - home.aim.y) * 2.6;
    if(Math.hypot(vx, vy) > 0.15) throwBall(vx, vy);
    home.aim = null; return;
  }
  home.pet.on = false; home.pet.px = home.pet.py = null;
}
function petOnce(){
  if(home.pet.t > 0) return;
  home.pet.t = 0.12;
  S.stat.pet = (S.stat.pet || 0) + 1;
  addLove(0.8 * petMul()); addStat('fun', 0.6);
  bumpDaily('pet', 1);
  home.pet.n++;
  const cx = rx(home.x), cy = yAt(home.y) - dugiH() * 0.7;
  home.parts.push({ x:cx + (Math.random() - .5) * 40, y:cy, vx:(Math.random() - .5) * 40,
                    vy:-50 - Math.random() * 40, life:0.9, t:0, c:'#EFA6B8', s:'heart' });

}
function sweepAt(r){
  for(let i = home.dusts.length - 1; i >= 0; i--){
    const d = home.dusts[i];
    if(Math.hypot((d.x - r.x) * 1.4, (d.y - r.y) * 0.8) < 0.07){
      home.dusts.splice(i, 1);
      home.parts.push({ x:rx(d.x), y:yAt(d.y), vx:0, vy:-30, life:0.6, t:0, c:'#D9C4A0', s:'dot' });

      if(!home.dusts.length){ home.sweep = false; careGain('clean'); }

const dugiH = () => Math.min(H * 0.215, roomW() * 0.2) * (look().scale || 1) * depthAt(yAt(home.y));

function drawDugi(){
  const c = look();
  const cx = rx(home.x), cy = yAt(home.y);
  const baseH = dugiH();
  const moving = Math.abs(home.vx) > 0.03 || Math.abs(home.vy) > 0.03;
  let bob = moving ? Math.abs(Math.sin(home.t * 9)) * baseH * 0.07 : Math.sin(home.t * 2) * baseH * 0.015;
  let rot = moving ? Math.sin(home.t * 9) * 0.07 : Math.sin(home.t * 2) * 0.02;
  let sy = 1, sx = 1;

  const a = home.act;
  if(a){
    if(a.kind === 'sleep'){ rot = -1.45; bob = -baseH * 0.12; sy = 0.95; }
    if(a.kind === 'water'){ rot = 0.1; bob = Math.abs(Math.sin(a.t * 7)) * baseH * 0.05; }
  }
  if(home.pet.t > 0){ sy = 1 + 0.05 * Math.sin(home.t * 30); sx = 1 - 0.03 * Math.sin(home.t * 30); }
  if(leveledUp > 0){ const k = Math.max(0, leveledUp / 2.6); sy = 1 + Math.sin(leveledUp * 14) * 0.12 * k; }

  shadow(cx, cy, baseH * 0.32);
  const im = IMG[c.run];
  g.save();
  g.translate(cx, cy - bob - (c.float || 0) * 0.3);
  g.rotate(rot); g.scale((c.flip === false ? 1 : -1) * home.face * sx, sy);
  if(im && im.complete && im.naturalWidth) g.drawImage(im, -baseH * 0.5, -baseH, baseH, baseH);
  g.restore();

  if(a && a.kind === 'sleep'){
    g.save(); g.globalAlpha = 0.2 * Math.min(1, a.t * 1.6); g.fillStyle = '#5A4A40';
    g.fillRect(0, 0, W, H); g.restore();
    for(let i = 0; i < 3; i++){
      const p = ((a.t * 0.5 + i * 0.33) % 1);
      g.save(); g.globalAlpha = 1 - p; g.fillStyle = '#AD9ED4';
      g.font = '700 ' + ((16 + p * 14) * uiK()) + 'px Gaegu, sans-serif';
      g.fillText('z', cx + baseH * 0.4 + p * 26, cy - baseH * 0.7 - p * 46);
      g.restore();
    }
  }
  const topY = cy - baseH - 10 * uiK();
  if(home.bubbleT > 0) speech(cx, topY, home.bubble);
  else if(home.sayT > 0) speech(cx, topY, home.say);
  else if(S.req && CARE[S.req.kind]) speech(cx, topY, REQ_LINE[S.req.kind], true);
  else {
    const low = STATS.find(s => S.dugi[s.id] < 30);
    if(low) moodIcon(cx, topY, low.color);
  }
}
function speech(tx, ty, text, want){
  g.save();
  g.font = '700 ' + (19 * uiK()) + 'px Gaegu, sans-serif';
  const w = g.measureText(text).width + 28 * uiK(), h = 32 * uiK();
  const x = Math.max(6, Math.min(W - w - 6, tx - w / 2));
  const y = ty - h + (want ? Math.sin(home.t * 3) * 2 * uiK() : 0);
  g.fillStyle = want ? '#FFF3D6' : '#FFF8F0'; ink();
  rrect(x, y, w, h, 13 * uiK()); g.fill(); g.stroke();
  g.fillStyle = want ? '#FFF3D6' : '#FFF8F0';
  g.beginPath(); g.moveTo(tx - 7 * uiK(), y + h - 1); g.lineTo(tx, y + h + 9 * uiK());
  g.lineTo(tx + 7 * uiK(), y + h - 1); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(tx - 7 * uiK(), y + h - 1); g.lineTo(tx, y + h + 9 * uiK());
  g.lineTo(tx + 7 * uiK(), y + h - 1); g.stroke();
  g.fillStyle = '#5A4A40'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, x + w / 2, y + h / 2 + 1);
  g.restore();
}
function moodIcon(cx, ty, col){
  const s = 14 * uiK();
  g.save(); g.translate(cx, ty - s * 0.4 + Math.sin(home.t * 3) * 2);
  g.fillStyle = col || '#C9A9A9'; ink();
  g.beginPath(); g.arc(0, 0, s, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#5A4A40'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '700 ' + (s * 1.3) + 'px Gaegu, sans-serif'; g.fillText('!', 0, 1);
  g.restore();
}
function drawParts(){
  for(const p of home.parts){
    const k = 1 - p.t / p.life, s = 9 * uiK();
    g.save(); g.globalAlpha = Math.max(0, k); g.fillStyle = p.c; ink(LW() * 0.7);
    if(p.s === 'heart'){
      g.beginPath(); g.moveTo(p.x, p.y + s * 0.5);
      g.bezierCurveTo(p.x - s, p.y - s * 0.3, p.x - s * 0.4, p.y - s, p.x, p.y - s * 0.35);
      g.bezierCurveTo(p.x + s * 0.4, p.y - s, p.x + s, p.y - s * 0.3, p.x, p.y + s * 0.5);
      g.fill(); g.stroke();
    }else if(p.s === 'drop'){
      g.beginPath(); g.moveTo(p.x, p.y - s);
      g.quadraticCurveTo(p.x + s * 0.7, p.y + s * 0.2, p.x, p.y + s * 0.6);
      g.quadraticCurveTo(p.x - s * 0.7, p.y + s * 0.2, p.x, p.y - s);
      g.fill(); g.stroke();
    }else if(p.s === 'z'){
      g.fillStyle = '#AD9ED4'; g.font = '700 ' + (s * 2.2) + 'px Gaegu, sans-serif';
      g.textAlign = 'center'; g.fillText('z', p.x, p.y);
    }else{
      g.beginPath(); g.arc(p.x, p.y, s * 0.55, 0, 7); g.fill(); g.stroke();
    }
    g.restore();
  }
}
function drawDust(d){
  const cx = rx(d.x), cy = yAt(d.y), s = 22 * uiK() * depthAt(cy);
  g.save(); ink(LW() * 0.8); g.fillStyle = '#CFC3AA';
  if(home.sweep){ g.shadowColor = '#FFE08A'; g.shadowBlur = 14; }
  g.beginPath();
  for(let k = 0; k < 7; k++){
    const a = k / 7 * 6.283, r = s * (0.42 + 0.2 * Math.sin(k * 2.1 + d.seed));
    g[k ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.5);
  }
  g.closePath(); g.fill(); g.stroke();
  g.restore();
}
function drawBall(){

function drawPrompt(){

function drawHome(dt){
  if(place === 'yard'){ drawYardScene(); return; }

function drawMini(){
  const k = uiK();
  g.save();
  g.fillStyle = 'rgba(250,245,238,.86)'; g.fillRect(0, 0, W, H);
  const cx = W * 0.5, cy = H * 0.56, sz = Math.min(W * 0.42, H * 0.6);
  const c = look(), im = IMG[c.run];

  if(mini.kind === 'feed'){
    /* 두기 + 음식 카드 */
    const chew = mini.picked ? Math.sin(mini.t * 18) * 0.05 : 0;
    g.save(); g.translate(cx, cy + sz * 0.42);
    g.scale((c.flip === false ? 1 : -1) * (1 + chew), 1 - chew);
    if(im && im.complete) g.drawImage(im, -sz * 0.5, -sz, sz, sz);
    g.restore();
    g.fillStyle = '#4E4038'; g.textAlign = 'center';
    g.font = '700 ' + (26 * k) + 'px Gaegu, sans-serif';
    g.fillText(mini.picked ? '냠냠!' : '뭘 줄까요?', cx, H * 0.16);
    if(!mini.picked){
      g.font = '400 ' + (14 * k) + 'px Gowun Dodum, sans-serif';
      g.fillStyle = '#8A7264';
      g.fillText('좋아하는 음식을 찾으면 마음이 두 배로 올라요', cx, H * 0.21);
    }
    const n = mini.foods.length, cw = Math.min(W * 0.16, 110 * k), gap = cw * 0.24;
    const total = n * cw + (n - 1) * gap, x0 = cx - total / 2;
    mini.foods.forEach((f, i) => {
      const x = x0 + i * (cw + gap), y = H * 0.76;
      if(mini.picked === f){
        const p = Math.min(1, mini.t * 2.4);
        const fx2 = x + cw / 2 + (cx - (x + cw / 2)) * p, fy2 = y + cw / 2 + (cy - (y + cw / 2)) * p;
        drawFood(f, fx2, fy2, cw * 0.42 * (1 - p * 0.5));
        return;
      }
      if(mini.picked) return;
      g.fillStyle = '#FFFFFF'; g.strokeStyle = '#EFE4D8'; g.lineWidth = LW() * 0.7;
      rrect(x, y, cw, cw * 0.86, 18 * k); g.fill(); g.stroke(); ink();
      drawFood(f, x + cw / 2, y + cw * 0.36, cw * 0.26);
      g.fillStyle = '#5A4A40'; g.textAlign = 'center';
      g.font = '700 ' + (15 * k) + 'px Gaegu, sans-serif';
      g.fillText(f.name, x + cw / 2, y + cw * 0.74);
      f._hit = { x, y, w:cw, h:cw * 0.86 };
    });
  }else{
    /* 씻기기 */
    g.save(); g.translate(cx, cy + sz * 0.42);
    g.scale(c.flip === false ? 1 : -1, 1);
    if(im && im.complete) g.drawImage(im, -sz * 0.5, -sz, sz, sz);
    g.restore();
    mini.spots.forEach(s => {
      if(s.hp <= 0) return;
      const x = cx + s.x * sz, y = cy - sz * 0.5 + s.y * sz, r = sz * s.r;
      g.save(); ink(LW() * 0.8); g.fillStyle = s.hp > 1 ? '#B59B72' : '#CBB89A';
      g.beginPath();
      for(let i = 0; i < 8; i++){ const a = i / 8 * 6.283;
        const rr = r * (0.8 + 0.3 * Math.sin(i * 2.3 + s.seed));
        g[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
      g.closePath(); g.fill(); g.stroke(); g.restore();
    });
    mini.bubbles.forEach(b => {
      g.save(); g.globalAlpha = Math.max(0, 1 - b.t / b.life) * 0.9;
      g.fillStyle = '#FFFFFF'; ink(LW() * 0.5);
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); g.stroke(); g.restore();
    });
    const done = mini.spots.filter(s => s.hp <= 0).length;
    g.fillStyle = '#4E4038'; g.textAlign = 'center';
    g.font = '700 ' + (26 * k) + 'px Gaegu, sans-serif';
    g.fillText('문질러서 씻겨요', cx, H * 0.14);
    const bw = Math.min(W * 0.5, 320 * k), bx = cx - bw / 2, by = H * 0.19;
    g.fillStyle = '#FFFFFF'; g.strokeStyle = '#EFE4D8'; g.lineWidth = LW() * 0.7;
    rrect(bx, by, bw, 16 * k, 8 * k); g.fill(); g.stroke();
    g.fillStyle = '#8FBF92';
    rrect(bx + 2, by + 2, (bw - 4) * (done / mini.total), 12 * k, 6 * k); g.fill();
    if(mini.soap){
      g.fillStyle = '#8A7264'; g.font = '400 ' + (13 * k) + 'px Gowun Dodum, sans-serif';
      g.fillText('거품비누를 쓰는 중 — 한 번에 지워져요', cx, H * 0.24);
    }
  }
  g.restore();
}
function drawFood(f, x, y, r){
  g.save(); ink(); g.fillStyle = f.color;
  if(f.id === 'carrot'){
    g.beginPath(); g.moveTo(x, y + r); g.lineTo(x - r * 0.5, y - r * 0.5);
    g.lineTo(x + r * 0.5, y - r * 0.5); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#8FBF92';
    g.beginPath(); g.ellipse(x, y - r * 0.6, r * 0.45, r * 0.22, 0, 0, 7); g.fill(); g.stroke();
  }else if(f.id === 'bread'){
    rrect(x - r * 0.7, y - r * 0.55, r * 1.4, r * 1.1, r * 0.35); g.fill(); g.stroke();
    g.strokeStyle = '#C9A06A';
    g.beginPath(); g.moveTo(x - r * 0.4, y - r * 0.2); g.lineTo(x + r * 0.4, y - r * 0.2); g.stroke();
  }else if(f.id === 'berry'){
    g.beginPath(); g.moveTo(x, y + r * 0.9);
    g.quadraticCurveTo(x - r * 0.8, y - r * 0.2, x, y - r * 0.7);
    g.quadraticCurveTo(x + r * 0.8, y - r * 0.2, x, y + r * 0.9);
    g.fill(); g.stroke();
    g.fillStyle = '#8FBF92';
    g.beginPath(); g.ellipse(x, y - r * 0.7, r * 0.4, r * 0.18, 0, 0, 7); g.fill(); g.stroke();
  }else if(f.id === 'fish'){
    g.beginPath(); g.ellipse(x, y, r * 0.85, r * 0.5, 0, 0, 7); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(x + r * 0.7, y); g.lineTo(x + r * 1.2, y - r * 0.4);
    g.lineTo(x + r * 1.2, y + r * 0.4); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#5A4A40';
    g.beginPath(); g.arc(x - r * 0.4, y - r * 0.1, r * 0.08, 0, 7); g.fill();
  }else if(f.id === 'icecre'){
    g.beginPath(); g.arc(x, y - r * 0.2, r * 0.6, 0, 7); g.fill(); g.stroke();
    g.fillStyle = '#D9B884';
    g.beginPath(); g.moveTo(x - r * 0.45, y + r * 0.1); g.lineTo(x + r * 0.45, y + r * 0.1);
    g.lineTo(x, y + r * 1.1); g.closePath(); g.fill(); g.stroke();
  }else{
    rrect(x - r * 0.7, y - r * 0.5, r * 1.4, r, r * 0.25); g.fill(); g.stroke();
  }
  g.restore();
}

  events = buildEvents(song); evIndex = 0;
  APPROACH = diff.approach / settings.speed;
  WIN = { perfect:BASE_WIN.perfect * diff.wmul, great:BASE_WIN.great * diff.wmul, good:BASE_WIN.good * diff.wmul };
  score = 0; combo = 0; maxCombo = 0; tally = { perfect:0, great:0, good:0, miss:0 }; accSum = 0;
  fx = []; texts = []; parts = []; flyers = []; bubs = []; lastSection = -1;
  stars = Array.from({ length:40 }, () => ({ x:Math.random(), y:Math.random() * 0.55,
                                             r:Math.random() * 1.6 + 0.7, p:Math.random() * 6.3 }));
  charState = 'run'; charTimer = 0;
  songStart = ctx.currentTime + 0.35;
  mode = 'play'; showScreen(null);
}
function endGame(){
  mode = 'result';
  const total = notes.length || 1, acc = Math.round((accSum / total) * 100);
  let grade;
  if(tally.miss === 0 && tally.good === 0) grade = '네잎클로버';
  else if(acc >= 90) grade = '세잎';
  else if(acc >= 70) grade = '잎사귀';
  else grade = '새싹';
  const gmul = { '네잎클로버':1.6, '세잎':1.3, '잎사귀':1.05, '새싹':0.85 }[grade];
  const before = S.career.dish || 0;
  const pay = Math.round((score / 70 + maxCombo * 1.2 + 30) * gmul * diff.mult * payMult('dish'));

  $('gradeText').textContent = grade;
  $('scoreText').textContent = Math.round(score).toLocaleString('ko-KR');
  $('tPerfect').textContent = tally.perfect; $('tGreat').textContent = tally.great;
  $('tGood').textContent = tally.good; $('tMiss').textContent = tally.miss;
  $('tCombo').textContent = maxCombo; $('tAcc').textContent = acc + '%';
  const k = bestKey(song, diff), prev = S.best[k] || 0, isNew = score > prev;
  if(isNew) S.best[k] = Math.round(score);
  $('bestText').textContent = (isNew ? '새 기록! ' : '최고 기록 ') +
    (S.best[k] || 0).toLocaleString('ko-KR') + ' · ' + song.title + ' · ' + diff.name;
  $('resultArt').src = grade === '네잎클로버' ? SRC.clover : SRC[char.run];
  payOut(pay, 'dish', 'rewardText', song.title);
  careerUp('dish', before);
  showScreen($('resultScreen'));
  bgmStart();
}
/* 보상 정산 — 알바 세 개가 같이 쓴다 */
function payOut(pay, jobId, elId, label){

function pause(){
  if(mode !== 'play') return;
  mode = 'pause'; showScreen($('pauseScreen'));
  $('pauseInfo').textContent = song.title + ' · ' + diff.name + ' · ' +
    Math.round(score).toLocaleString('ko-KR') + '점 · ' + combo + '콤보';

}
let cdTimer = null;
function resumePlay(){
  if(mode !== 'pause' || cdTimer) return;
  $('pauseScreen').hidden = true; modal.hidden = true; modalOpen = null;
  const cd = $('countdown'), num = $('cdNum');
  const pop = () => { num.style.animation = 'none'; void num.offsetWidth; num.style.animation = ''; };
  let n = 3; cd.hidden = false; num.textContent = n; pop(); blip(660, 0.1);
  const tick = () => {
    n--;
    if(n > 0){ num.textContent = n; pop(); blip(660 + (3 - n) * 120, 0.1); cdTimer = setTimeout(tick, 650); }
    else{
      num.textContent = '시작!'; pop(); blip(1180, 0.13);
      cdTimer = setTimeout(() => { cd.hidden = true; cdTimer = null; mode = 'play'; showScreen(null);
                                   if(ctx) ctx.resume(); }, 480);
    }
  };
  cdTimer = setTimeout(tick, 650);
