/* 판정 */
function hit(lane){
  if(mode !== 'play') return;
  laneFlash[lane] = 1;
  const t = nowT(); let target = null, bd = 999;
  for(const n of notes){
    if(n.judged) continue;
    if(n.t - t > WIN.good + 0.05) break;
    if(n.lane !== lane) continue;
    const d = Math.abs(n.t - t);
    if(d <= WIN.good && d < bd){ bd = d; target = n; }
  }
  if(!target) return;
  const v = bd <= WIN.perfect ? 'perfect' : bd <= WIN.great ? 'great' : 'good';
  target.judged = true; target.verdict = v;
  if(target.type === 'hold') target.holding = true; else target.done = true;
  combo++; maxCombo = Math.max(maxCombo, combo);
  tally[v]++; accSum += VAL[v];
  score += 100 * VAL[v] * (1 + Math.min(combo / 10 * 0.1, 1.0)) * diff.mult;
  laneBeam[lane] = 1; comboPop = 1;
  perfectStreak = v === 'perfect' ? perfectStreak + 1 : 0;
  if(perfectStreak > 0 && perfectStreak % 10 === 0) shakeT = 0.18;
  spawnHitFx(lane, v);
  texts.length = 0;
  texts.push({ x:W * 0.5, y:judgeY() - H * 0.24, life:1, s:LABEL[v], big:v === 'perfect', v:v });
  if(combo % 10 === 0){ charState = 'jump'; jumpT = 0; } else { charState = 'run'; hitBounce = 1; }
  hitSound(lane, v);
}
function miss(n){
  n.judged = true; n.done = true; n.verdict = 'miss';
  combo = 0; tally.miss++; perfectStreak = 0; laneMiss[n.lane] = 1;
  texts.length = 0;
  texts.push({ x:W * 0.5, y:judgeY() - H * 0.24, life:1, s:LABEL.miss });
  missSound();
  charState = 'fall'; charTimer = 0.7;
}

/* ===============================================================
   설거지 알바 배경 — 분식집 주방
   =============================================================== */
function drawKitchen(t, prog){
  const k = uiK();
  /* 타일 벽 */
  const wg = g.createLinearGradient(0, 0, 0, H);
  wg.addColorStop(0, '#EAF6FB'); wg.addColorStop(1, '#DCEDF4');
  g.fillStyle = wg; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(120,150,165,.28)'; g.lineWidth = LW() * 0.5;
  const ts = Math.max(34, H * 0.085);
  for(let y = 0; y < H * 0.78; y += ts){
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    const off = (Math.round(y / ts) % 2) * ts * 0.5;
    for(let x = -ts; x < W + ts; x += ts){
      g.beginPath(); g.moveTo(x + off, y); g.lineTo(x + off, y + ts); g.stroke();
    }
  }
  /* 선반과 접시 */
  const shY = H * 0.12;
  g.fillStyle = '#D9B884'; ink();
  g.fillRect(W * 0.70, shY, W * 0.30, H * 0.022); g.strokeRect(W * 0.70, shY, W * 0.30, H * 0.022);
  for(let i = 0; i < 4; i++){
    const x = W * 0.735 + i * W * 0.068, r = Math.min(W * 0.028, H * 0.05);
    g.fillStyle = ['#FFF8F0', '#FFE3EC', '#DFF0FA', '#EAF6E4'][i % 4];
    g.beginPath(); g.ellipse(x, shY - r * 0.75, r, r * 0.95, 0, 0, 7); g.fill(); g.stroke();
    g.strokeStyle = 'rgba(120,95,75,.3)';
    g.beginPath(); g.ellipse(x, shY - r * 0.75, r * 0.55, r * 0.5, 0, 0, 7); g.stroke(); ink();
  }
  /* 오른쪽 창문 */
  const wx = W * 0.10, wy = H * 0.17, ws = Math.min(W * 0.07, H * 0.12);
  g.fillStyle = '#CDEBFA'; ink();
  roundRect(wx - ws, wy - ws * 0.8, ws * 2, ws * 1.6, ws * 0.14); g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.7)';
  g.beginPath(); g.arc(wx - ws * 0.3, wy - ws * 0.2, ws * 0.3, 0, 7); g.fill();
  g.beginPath(); g.moveTo(wx, wy - ws * 0.8); g.lineTo(wx, wy + ws * 0.8);
  g.moveTo(wx - ws, wy); g.lineTo(wx + ws, wy); g.stroke();
  /* 싱크대 상판 */
  const cy = judgeY() + laneW() * 0.55;
  g.fillStyle = '#C9DCE4'; g.fillRect(0, cy, W, H - cy);
  ink(); g.beginPath(); g.moveTo(0, cy); g.lineTo(W, cy); g.stroke();
  g.fillStyle = '#AFC9D4'; g.fillRect(0, cy + (H - cy) * 0.42, W, (H - cy) * 0.58);
  g.beginPath(); g.moveTo(0, cy + (H - cy) * 0.42); g.lineTo(W, cy + (H - cy) * 0.42); g.stroke();
  /* 수도꼭지 */
  const fx0 = fieldX() + fieldW() + 26 * k;
  if(fx0 < W - 40 * k){
    g.strokeStyle = '#8FA8B4'; g.lineWidth = LW() * 1.6;
    g.beginPath(); g.moveTo(fx0, cy); g.lineTo(fx0, cy - H * 0.16);
    g.quadraticCurveTo(fx0, cy - H * 0.22, fx0 - W * 0.05, cy - H * 0.2); g.stroke();
    ink();
  }
  /* 김 */
  g.save(); g.globalAlpha = .22; g.fillStyle = '#FFFFFF';
  for(let i = 0; i < 5; i++){
    const p = (t * 0.22 + i * 0.2) % 1;
    const x = W * (0.1 + i * 0.2) + Math.sin(t * 1.5 + i) * 18;
    g.beginPath(); g.arc(x, cy - p * H * 0.55, (18 + p * 26) * k * 0.7, 0, 7); g.fill();
  }
  g.restore();
}

/* 떠오르는 비눗방울 */
let bubs = [];
function bubbles(dt, playing){
  if(playing && Math.random() < dt * 9)
    bubs.push({ x: Math.random() * W, y: H * 0.98, r: (5 + Math.random() * 11) * uiK(),
                v: 26 + Math.random() * 60, p: Math.random() * 6.3, life: 1 });
  for(let i = bubs.length - 1; i >= 0; i--){
    const b = bubs[i];
    b.y -= b.v * dt; b.life -= dt * 0.22;
    if(b.y < -30 || b.life <= 0){ bubs.splice(i, 1); continue; }
    g.save(); g.globalAlpha = Math.max(0, Math.min(0.55, b.life * 0.6));
    g.fillStyle = '#FFFFFF'; g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = LW() * 0.5;
    const x = b.x + Math.sin(b.p + b.y * 0.02) * 9;
    g.beginPath(); g.arc(x, b.y, b.r, 0, 7); g.fill(); g.stroke();
    g.globalAlpha *= 0.9; g.fillStyle = '#FFFFFF';
    g.beginPath(); g.arc(x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.22, 0, 7); g.fill();
    g.restore();
  }
}

/* 한 프레임 */
function stepPlay(dt, ts){
  const playing = mode === 'play', frozen = mode === 'pause';
  const t = (playing || frozen) ? nowT() : ts / 1000;
  const prog = Math.max(0, Math.min(1, t / song.end));
  const th = lerpTheme(THEMES[song.theme], prog);
  th.ink = '#5A4A40';

  if(playing){
    const look2 = t + 0.25;
    while(evIndex < events.length && events[evIndex].t < look2){ events[evIndex].f(); evIndex++; }
    for(const n of notes){
      if(!n.judged && t - n.t > WIN.good) miss(n);
      if(n.holding && t >= n.t + n.dur){
        n.holding = false; n.done = true; score += 40 * diff.mult;
        combo++; maxCombo = Math.max(maxCombo, combo); hitSound(n.lane, 'perfect');
        fx.push({ x:laneX(n.lane), y:judgeY(), r:12, life:1, kind:'perfect' });
        texts.length = 0; texts.push({ x:W * 0.5, y:judgeY() - H * 0.24, life:1, s:'뽀득!' });
      }
      if(n.holding && !laneHold[n.lane] && t < n.t + n.dur - 0.12){
        n.holding = false; n.done = true;
        texts.length = 0; texts.push({ x:W * 0.5, y:judgeY() - H * 0.24, life:1, s:'놓쳤다' });
        for(let i = 0; i < 4; i++) fx.push({ x:laneX(n.lane), y:judgeY(), life:.7, kind:'dust',
          vx:(Math.random() - .5) * 120, vy:-30 - Math.random() * 80, r:2 + Math.random() * 3 });
      }
    }
    const section = Math.floor(t / (song.barDur * 4));
    if(section !== lastSection){ lastSection = section; if(t > 0) spawnFlyer(); }
    if(t > song.end + 0.9) endGame();
  }
  const beat = ((t / song.beat) % 1 + 1) % 1;
  const pulse = REDUCED ? 1 : 1 + Math.max(0, 0.012 * (1 - beat * 4));
  let shx = 0, shy = 0;
  if(shakeT > 0){ shakeT -= dt; if(!REDUCED){ shx = (Math.random() - .5) * 7; shy = (Math.random() - .5) * 7; } }
  g.save(); g.translate(W / 2 + shx, H / 2 + shy); g.scale(pulse, pulse); g.translate(-W / 2, -H / 2);
  drawKitchen(Math.max(0, t), prog);
  bubbles(playing ? dt : dt * 0.5, playing);
  laneField(t, th); drawNotes(t, th); drawChar(t, playing ? dt : 0, th);
  drawFx(playing ? dt : 0, th); drawHud(t, th);
  g.restore();
}

/* ===== 노트 ===== */
function wobble(x,y,r,seed,fill,stroke){
  g.beginPath();
  for(let a=0;a<=6.29;a+=Math.PI/12){
    const rr=r+Math.sin(a*3+seed)*r*0.055;
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
    a===0?g.moveTo(px,py):g.lineTo(px,py);
  }
  g.closePath();
  if(fill){ g.fillStyle=fill; g.fill(); }
  if(stroke){ g.strokeStyle=stroke; g.lineWidth=LW(); g.stroke(); }
}
function rgba(hex,a){
  return 'rgba('+parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+
         parseInt(hex.slice(5,7),16)+','+a+')';
}
/* 노트를 쳤을 때 터지는 것들 */
function spawnHitFx(lane, v){
  const x=laneX(lane), y=judgeY(), col=LANE_COL[lane], lw=laneW();
  const shards = v==='perfect'?4 : v==='great'?3 : 2;
  for(let i=0;i<shards;i++)
    fx.push({kind:'shard', x, y, w:lw*0.24, h:Math.max(7,lw*0.11), col, life:1,
             vx:(Math.random()-.5)*300, vy:-140-Math.random()*240,
             rot:Math.random()*6.3, vr:(Math.random()-.5)*16});
  fx.push({kind:'ripple', x, y, r:lw*0.30, life:1, col});
  if(v==='perfect'){
    for(let i=0;i<10;i++){ const a=Math.random()*6.283, sp=150+Math.random()*280;
      fx.push({kind:'star', x, y, r:3+Math.random()*3.5, life:1,
               vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-70, rot:Math.random()*6.3, vr:(Math.random()-.5)*10}); }
    fx.push({kind:'ring', x, y, r:lw*0.22, life:1, col:'#FFD98A'});
    fx.push({kind:'ring', x, y, r:lw*0.22, life:1, col, d:0.06});
  } else if(v==='great'){
    for(let i=0;i<6;i++) fx.push({kind:'dust', x, y, r:2+Math.random()*3, life:1, col,
      vx:(Math.random()-.5)*180, vy:-70-Math.random()*150});
    fx.push({kind:'ring', x, y, r:lw*0.2, life:1, col});
  } else {
    for(let i=0;i<3;i++) fx.push({kind:'dust', x, y, r:2+Math.random()*2, life:1, col:'#C9BFAE',
      vx:(Math.random()-.5)*110, vy:-45-Math.random()*90});
  }
}

function laneField(t,th){
  const x0=fieldX(), fw=fieldW(), top=fieldTop(), jy=judgeY(), lw=laneW();
  g.save();
  g.globalAlpha=0.42; g.fillStyle='#F2FAFD';
  roundRect(x0,top,fw,H-top-H*0.03,18); g.fill(); g.globalAlpha=1;
  g.lineWidth=LW(); g.strokeStyle=th.ink; g.globalAlpha=.5;
  roundRect(x0,top,fw,H-top-H*0.03,18); g.stroke(); g.globalAlpha=1;
  // 레인 구분선
  g.setLineDash([6,8]); g.lineWidth=LW()*0.7; g.strokeStyle='rgba(120,95,75,.25)';
  for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(x0+lw*i,top+8); g.lineTo(x0+lw*i,jy+lw*0.55); g.stroke(); }
  g.setLineDash([]);
  // 박자 줄
  const beat=song.beat, from=Math.ceil(nowT()/beat);
  for(let k=from;k<from+14;k++){
    const y=noteY(k*beat); if(y<top||y>jy) continue;
    g.strokeStyle= (k% (song.spb/2)===0) ? 'rgba(120,95,75,.16)' : 'rgba(120,95,75,.07)';
    g.lineWidth=LW()*0.7; g.beginPath(); g.moveTo(x0+4,y); g.lineTo(x0+fw-4,y); g.stroke();
  }
  // 눌린 줄이 위로 빛난다
  for(let i=0;i<4;i++){
    if(laneHold[i]) laneBeam[i]=Math.max(laneBeam[i],0.55);
    laneBeam[i]=Math.max(0,laneBeam[i]-0.05);
    laneMiss[i]=Math.max(0,laneMiss[i]-0.045);
    if(laneBeam[i]>0.01){
      const cx=laneX(i);
      const gr=g.createLinearGradient(0,jy,0,top);
      gr.addColorStop(0, rgba(LANE_COL[i], 0.50*laneBeam[i]));
      gr.addColorStop(0.55, rgba(LANE_COL[i], 0.14*laneBeam[i]));
      gr.addColorStop(1, rgba(LANE_COL[i], 0));
      g.fillStyle=gr; g.fillRect(cx-lw*0.44, top, lw*0.88, jy-top);
    }
    if(laneMiss[i]>0.01){
      const cx=laneX(i);
      g.fillStyle=rgba('#C9A9A9', 0.22*laneMiss[i]);
      g.fillRect(cx-lw*0.44, top, lw*0.88, jy-top);
    }
  }
  // 판정선 + 리시버
  g.strokeStyle=th.ink; g.lineWidth=LW(); g.beginPath();
  for(let x=x0;x<=x0+fw;x+=10) g.lineTo(x, jy+Math.sin(x*0.08)*1.2);
  g.stroke();
  const bp=((t/song.beat)%1+1)%1, pulse=REDUCED?1:1+Math.max(0,0.10*(1-bp*3));
  for(let i=0;i<4;i++){
    const cx=laneX(i), punch=1+laneFlash[i]*0.42, r=lw*0.33*pulse*punch;
    laneFlash[i]=Math.max(0,laneFlash[i]-0.07);
    g.globalAlpha=0.28+laneFlash[i]*0.7;
    g.fillStyle=laneMiss[i]>0.2?'#C9A9A9':LANE_COL[i];
    g.beginPath(); g.arc(cx,jy,r,0,6.3); g.fill(); g.globalAlpha=1;
    if(laneFlash[i]>0.02){                       // 눌릴 때 바깥 테
      g.globalAlpha=laneFlash[i]*0.8; g.lineWidth=LW();
      g.strokeStyle=LANE_COL[i];
      g.beginPath(); g.arc(cx,jy,r*1.28,0,6.3); g.stroke(); g.globalAlpha=1;
    }
    g.lineWidth=LW(); g.strokeStyle=th.ink;
    g.beginPath(); g.arc(cx,jy,lw*0.33*pulse,0,6.3); g.stroke();
    g.font='700 '+Math.round(lw*0.34)+'px "Gaegu", sans-serif';
    g.textAlign='center'; g.fillStyle=th.ink; g.globalAlpha=laneHold[i]?1:0.55;
    g.fillText(keyLabel(settings.keys[i]), cx, jy+lw*0.72); g.globalAlpha=1;
  }
  g.restore();
}
function drawNotes(t,th){
  const lw=laneW(), jy=judgeY(), top=fieldTop();
  const nw=lw*0.74, nh=Math.max(14,lw*0.30);
  for(const n of notes){
    if(n.t-t>APPROACH+0.3) break;
    const x=laneX(n.lane), col=LANE_COL[n.lane];
    if(n.type==='hold'){
      if(n.done) continue;
      const yHead = n.holding ? jy : noteY(n.t);
      const yTail = noteY(n.t+n.dur);
      if(yTail>jy+nh*2 && !n.holding) {}
      if(noteY(n.t)>jy+H*0.2 && !n.holding) continue;
      const a=Math.min(yHead,yTail), bnd=Math.max(yHead,yTail);
      if(bnd<top-40) continue;
      g.globalAlpha=n.judged?0.95:0.8; g.fillStyle=col;
      roundRect(x-nw*0.34, a, nw*0.68, Math.max(6,bnd-a), nw*0.3); g.fill();
      g.globalAlpha=1; g.lineWidth=LW(); g.strokeStyle=th.ink;
      roundRect(x-nw*0.34, a, nw*0.68, Math.max(6,bnd-a), nw*0.3); g.stroke();
      // 머리·꼬리 알약
      if(!n.judged) plate(x, noteY(n.t), nw*0.46, col, th.ink);
      g.fillStyle='#FFF8F0'; roundRect(x-nw*0.34,yTail-nh*0.34,nw*0.68,nh*0.68,nh*0.3); g.fill(); g.stroke();
      if(n.holding && Math.random()<0.35)
        fx.push({x:x+(Math.random()-.5)*nw,y:jy,life:.6,kind:'dust',
                 vx:(Math.random()-.5)*70,vy:-70-Math.random()*70,r:2+Math.random()*2});
    } else {
      if(n.done) continue;
      const y=noteY(n.t);
      if(y>jy+H*0.18) continue;
      if(y<top-30) continue;
      plate(x, y, nw*0.46, col, th.ink);
    }
  }
}
/* 접시 한 장 */
function plate(x, y, r, col, ink2){
  g.fillStyle=col;
  g.beginPath(); g.ellipse(x, y, r, r*0.8, 0, 0, 6.3); g.fill();

function drawFx(dt,th){
  for(const f of fx){
    if(f.d>0){ f.d-=dt; continue; }

      case 'shard':
        f.life-=dt*1.9; f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=1500*dt; f.rot+=f.vr*dt; break;
      case 'star':
        f.life-=dt*1.5; f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=700*dt; f.rot+=f.vr*dt;
        f.vx*=0.96; break;
      case 'ripple': f.life-=dt*2.4; f.r+=dt*laneW()*3.2; break;
      case 'dust':   f.life-=dt*1.7; f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=520*dt; break;

    }
  }
  fx=fx.filter(f=>f.life>0);

      g.closePath(); g.fill(); g.stroke(); g.restore();
    } else if(f.kind==='ripple'){
      g.strokeStyle=f.col; g.lineWidth=LW()*a+1;

const MAP = ['warm','hop','duck','gap1','twin','rest','stair','mix','gap2','zig','shelf','rush','rest','finale','goal'];

function buildMap(){
  segs = []; ents = [];
  let x = 0;
  for(const k of MAP) x += CHUNK[k](x);
  MAPEND = x;
  segs.sort((a,b) => a.y - b.y || a.x0 - b.x0);
  const merged = [];
  for(const sg of segs){
    const last = merged[merged.length-1];
    if(last && last.y === sg.y && Math.abs(last.x1 - sg.x0) < 1) last.x1 = sg.x1;
    else merged.push(sg);
  }
  segs = merged.sort((a,b) => a.x0 - b.x0);
  /* 코스가 어려우면 장애물을 더 깔아둔다 (최소 간격은 지킨다) */
  if(CO.dense > 1){
    const ob = () => ents.filter(e => e.kind==='spike' || e.kind==='bar').sort((a,b)=>a.x-b.x);
    const extra = Math.round((CO.dense - 1) * 14);
    for(let i=0;i<extra;i++){
      const sg = segs[Math.floor(Math.random()*segs.length)];
      if(sg.x1 - sg.x0 < 700) continue;
      const x = sg.x0 + 250 + Math.random()*(sg.x1 - sg.x0 - 500);
      if(x > MAPEND - 1400) continue;

      if(list.some(e => Math.abs(e.x - x) < 380)) continue;
      if(Math.random() < 0.55) spike(x, sg.y); else bar(x, sg.y);
      ents.sort((a,b)=>a.x-b.x);
    }
  }
  ents.sort((a,b) => a.x - b.x);
  const flag = ents.find(e => e.kind === 'goal');

  const id = skillIdOf(me); energy = 0; SFX.skill();
  skill = id; skillT = SKILLS[id].dur; toastFx(SKILLS[id].name);
  for(let i=0;i<18;i++) fx.push({ kind:'star', x:player.x, y:player.y+40,
    vx:(Math.random()-.5)*420, vy:Math.random()*420, life:0.7, t:0, c:skillOf(me).color });
}

/* ===== 효과 ===== */
function puff(x, y, n){ for(let i=0;i<n;i++) fx.push({ kind:'dust', x: x+(Math.random()-.5)*26, y:y+4, vx:(Math.random()-.5)*230-60,
  vy:Math.random()*55+10, life:0.4, t:0 }); }
function ring(x, y){ fx.push({ kind:'ring', x, y, life:0.42, t:0, c:'#FFF8F0' }); }
function pop(x, y, c){ for(let i=0;i<10;i++) fx.push({ kind:'star', x, y, c,
  vx:(Math.random()-.5)*300, vy:Math.random()*300+60, life:0.5, t:0 }); }
let toastT = 0, toastTx = '';
function toastFx(t){ toastTx = t; toastT = 1.2; }

/* ===============================================================
   진행
   =============================================================== */
function update(dt){
  tick += dt;
  if(toastT > 0) toastT -= dt;
  for(let i=fx.length-1;i>=0;i--){ const p = fx[i]; p.t += dt;
    if(p.t >= p.life){ fx.splice(i,1); continue; }
    if(p.kind !== 'ring'){ p.x += (p.vx||0)*dt; p.y += (p.vy||0)*dt; p.vy = (p.vy||0) - 700*dt; } }
  if(shake > 0) shake = Math.max(0, shake - dt*2.6);
  if(state !== 'play') return;

  /* 스킬 시간 */
  if(skillT > 0){ skillT -= dt; if(skillT <= 0){ skillT = 0; skill = null; } }
  energy = Math.min(100, energy + dt*4.5);

  /* 속도 */
  speed = Math.min(CO.vmax, speed + VACC*dt);
  let v = speed * (skill === 'slow' ? 0.72 : 1) * (skill === 'dash' ? 1.55 : 1);
  player.x += v*dt; dist += v*dt;
  score += v*dt*0.06;

  /* 슬라이드 */
  if(player.sliding){
    player.slideT += dt;
    if((!held.slide && !(CO.slippery && player.slideT < 0.55)) || player.slideT > 1.6 || !player.onGround) player.sliding = false;
    else if(Math.random() < dt*22) puff(player.x - 14, player.y, 1);
  }else if(held.slide && player.onGround) { player.sliding = true; player.slideT = 0; }

  /* 중력·점프 */
  const prevY = player.y, prevX = player.x - v*dt;
  let gr = GRAV;
  if(skill === 'glide' && player.vy < 0) gr = held.jump ? 520 : 900;
  player.vy -= gr*dt;
  if(skill === 'glide' && player.vy < -260) player.vy = -260;
  player.y += player.vy*dt;

  if(player.buf > 0){ player.buf -= dt; }
  if(player.onGround) player.coyote = 0.11; else player.coyote = Math.max(0, player.coyote - dt);

  /* 착지 판정 */
  let landed = false;
  if(player.vy <= 0){
    for(const s of segsAt(player.x)){
      if(prevY >= s.y - 1 && player.y <= s.y){
        player.y = s.y; player.vy = 0;
        if(!player.onGround){ puff(player.x, s.y, 5); }
        player.onGround = true; player.jumps = 0; landed = true;
        if(player.buf > 0){ player.buf = 0; doJump(); }
        break;
      }
    }
  }
  if(!landed){
    const under = groundAt(player.x, player.y);
    if(player.onGround && (!under || Math.abs(under.y - player.y) > 2)) player.onGround = false;
    else if(under && player.y < under.y && player.vy <= 0){ player.y = under.y; player.vy = 0; player.onGround = true; player.jumps = 0; }
  }

  /* 구덩이에 빠짐 */
  if(player.y < -300) fell();

  /* 부딪힘 · 젤리 — 한 프레임에 지나쳐버리지 않도록 이동 구간 전체를 본다 */
  const ph = player.sliding ? PH_SLIDE : PH;
  const px0 = Math.min(prevX, player.x) - PW/2, px1 = Math.max(prevX, player.x) + PW/2;
  const py0 = Math.min(prevY, player.y), py1 = Math.max(prevY, player.y) + ph;
  for(const e of ents){
    if(e.gone) continue;
    if(e.x < player.x - 500) continue;
    if(e.x > player.x + 900) break;

    if(e.kind === 'jelly' || e.kind === 'big'){
      if(skill === 'magnet'){
        const d = Math.hypot(e.x - player.x, e.y - (player.y+40));
        if(d < 300){ e.x += (player.x - e.x)*Math.min(1, dt*7); e.y += ((player.y+40) - e.y)*Math.min(1, dt*7); }
      }
      const r = e.kind === 'big' ? 52 : 40;
      if(Math.abs(e.x - player.x) < r && Math.abs(e.y - (player.y + ph*0.5)) < r + 14){
        e.gone = true; combo++; maxCombo = Math.max(maxCombo, combo);
        const mult = skill === 'slow' ? 2 : 1;
        if(e.kind === 'big'){ jellyN += 5; score += 250*mult; energy = Math.min(100, energy + 28); SFX.big(); pop(e.x, e.y, '#FFD36E'); }
        else { jellyN++; score += (10 + Math.min(20, combo))*mult; energy = Math.min(100, energy + 6); SFX.jelly(combo); pop(e.x, e.y, '#8FBF92'); }
      }
      continue;
    }
    if(e.kind === 'goal'){
      if(player.x >= e.x){ finish(true); }
      continue;
    }
    /* 장애물 */
    const ex0 = e.x - e.w/2, ex1 = e.x + e.w/2, ey0 = e.y, ey1 = e.y + e.h;
    if(px1 > ex0 && px0 < ex1 && py1 > ey0 && py0 < ey1){
      if(skill === 'dash'){ e.gone = true; score += 60; pop(e.x, e.y + e.h/2, '#EFA6B8'); SFX.hit(); shake = 0.5; }
      else if(player.inv > 0){ /* 무적 중 */ }
      else hurt(e);
    }
  }
  if(player.inv > 0) player.inv -= dt;

  /* 카메라 */
  const want = player.x - Math.max(170, (W/SC)*0.26);
  camX += (want - camX) * Math.min(1, dt*12);
  const wantY = clamp(player.y - 300, 0, 260);      // 높이 올라가면 화면도 같이 따라간다
  camY += (wantY - camY) * Math.min(1, dt*(wantY > camY ? 10 : 3.5));
}

const hits = [];
function hurt(e){
  hits.push({ x:Math.round(player.x), kind:e.kind, sliding:player.sliding, y:Math.round(player.y) });
  player.hp--; player.inv = 1.5; combo = 0; e.gone = true;
  SFX.hit(); shake = 1; pop(e.x, e.y + e.h/2, '#C9A9A9');
  speed = Math.max(V0, speed - 60);
  if(player.hp <= 0) finish(false);
}
function fell(){
  hits.push({ x:Math.round(player.x), kind:'구덩이', y:Math.round(player.y) });
  player.hp--; combo = 0; SFX.hit(); shake = 1;
  if(player.hp <= 0){ finish(false); return; }
  const next = segs.find(s => s.x1 > player.x + 40) || segs[segs.length-1];
  player.x = Math.max(player.x, next.x0 + 70); player.y = next.y + 120;
  player.vy = 0; player.inv = 1.8; player.onGround = false; player.jumps = 1;
  speed = Math.max(CO.v0*0.8, speed - 80);
  toastFx('앗!');
}

/* ===============================================================
   그리기
   =============================================================== */
function drawSky(){
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, CO.sky[0]); gr.addColorStop(0.62, CO.sky[1]); gr.addColorStop(1, '#FFF8F0');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);

  /* 구름 */
  g.fillStyle = 'rgba(255,255,255,.92)';
  const cw = 760, off = (camX*0.18) % cw;
  for(let i=-1;i<W/(cw*SC)+2;i++){
    const bx = i*cw*SC - off*SC;
    [[0,96,44],[190,132,32],[420,80,38]].forEach(([dx,dy,r],k)=>{
      const x = bx + dx*SC, y = H*0.10 + dy*SC*0.5 + camY*SC*0.25 + Math.sin(tick*0.4+k+i)*3;
      g.beginPath();
      g.arc(x, y, r*SC, 0, 7); g.arc(x+r*0.8*SC, y+6*SC, r*0.75*SC, 0, 7); g.arc(x-r*0.8*SC, y+7*SC, r*0.66*SC, 0, 7);
      g.fill();
    });
  }
  /* 먼 언덕 */
  const hillY = GYs + camY*SC*0.55, bushY = GYs + camY*SC*0.82;
  const hw = 620;
  g.fillStyle = '#CFE7C6';
  const ho = (camX*0.42) % hw;
  for(let i=-1;i<W/(hw*SC)+2;i++){
    const x = i*hw*SC - ho*SC;
    g.beginPath(); g.moveTo(x-40*SC, GYs);
    g.quadraticCurveTo(x+150*SC, GYs-210*SC, x+340*SC, GYs);
    g.quadraticCurveTo(x+460*SC, GYs-120*SC, x+660*SC, GYs);
    g.closePath(); g.fill();
  }
  /* 동네 집들 */
  const tw2 = 520, ho2 = (camX*0.58) % tw2;
  for(let i=-1;i<W/(tw2*SC)+2;i++){
    const x = i*tw2*SC - ho2*SC + 40*SC;
    const hh = (120 + ((i*37)%3)*34)*SC, wwid = 150*SC;
    const top = bushY - hh;
    g.fillStyle = ['#F4E3C8','#EBD9F0','#DCEFF7'][Math.abs(i)%3];
    g.beginPath(); g.rect(x, top, wwid, hh); g.fill();
    g.strokeStyle = 'rgba(120,95,75,.45)'; g.lineWidth = LW()*0.7; g.stroke();
    g.fillStyle = '#C9A06A';
    g.beginPath(); g.moveTo(x-12*SC, top); g.lineTo(x+wwid/2, top-34*SC);
    g.lineTo(x+wwid+12*SC, top); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#CDEBFA';
    g.fillRect(x+22*SC, top+26*SC, 34*SC, 30*SC); g.strokeRect(x+22*SC, top+26*SC, 34*SC, 30*SC);
    g.fillRect(x+92*SC, top+26*SC, 34*SC, 30*SC); g.strokeRect(x+92*SC, top+26*SC, 34*SC, 30*SC);
  }
  /* 가까운 덤불 */
  const bw = 380;
  g.fillStyle = '#B7DBAE';
  const bo = (camX*0.72) % bw;
  for(let i=-1;i<W/(bw*SC)+2;i++){
    const x = i*bw*SC - bo*SC;
    g.beginPath(); g.arc(x, bushY-6*SC, 56*SC, Math.PI, 0); g.arc(x+64*SC, bushY-6*SC, 40*SC, Math.PI, 0);
    g.rect(x-56*SC, bushY-8*SC, 164*SC, 12*SC); g.fill();
  }
}

function drawGround(){
  /* 땅 아래 — 구덩이가 깊어 보이도록 */
  const base = sy(0);
  if(base < H){
    const gr = g.createLinearGradient(0, base, 0, H);
    gr.addColorStop(0, '#E9DFCB'); gr.addColorStop(1, '#F6F1E4');
    g.fillStyle = gr; g.fillRect(0, base, W, H - base);
  }
  for(const s of segs){
    const x0 = sx(s.x0), x1 = sx(s.x1);
    if(x1 < -40 || x0 > W + 40) continue;
    const y = sy(s.y), h = H - y + 40;
    /* 흙 */
    g.fillStyle = '#E6D5B4';
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.lineTo(x1, y+h); g.lineTo(x0, y+h); g.closePath(); g.fill();
    /* 풀 */
    g.fillStyle = '#8FBF92';
    g.fillRect(x0, y, x1-x0, 13*SC);
    g.strokeStyle = '#5A4A40'; g.lineWidth = LW(); g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(x0, y+h); g.lineTo(x0, y);
    const stepPx = 26*SC;
    for(let x = x0; x < x1; x += stepPx) g.lineTo(Math.min(x1, x+stepPx), y + Math.sin((x/SC + s.x0)*0.05)*2.2*SC);
    g.lineTo(x1, y+h);
    g.stroke();
    /* 흙 점 */
    g.fillStyle = 'rgba(160,130,90,.32)';
    for(let x = Math.max(x0, -20); x < Math.min(x1, W+20); x += 60*SC){
      const k = Math.abs(Math.sin((x/SC+s.x0)*0.13));
      g.beginPath(); g.arc(x + 20*SC, y + (26 + k*40)*SC, 4.5*SC, 0, 7); g.fill();
    }
  }
}

/* 동전 — 배달하며 줍는 것 */
function coin(cx, cy, r, big){
  g.save(); g.translate(cx, cy);
  if(CO && CO.dark){ g.shadowColor = 'rgba(255,224,138,.9)'; g.shadowBlur = r * 1.6; }
  g.strokeStyle = '#5A4A40'; g.lineWidth = Math.min(r*0.34, LW()); g.lineJoin = 'round';
  g.fillStyle = big ? '#FFCB4F' : '#FFDD73';
  g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.stroke();
  g.shadowBlur = 0;
  g.fillStyle = big ? '#FFF0BE' : '#FFF6DA';
  g.beginPath(); g.arc(0, 0, r*0.68, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#8FBF92';
  for(let i=0;i<4;i++){
    g.save(); g.rotate(i*Math.PI/2 + Math.PI/4);
    g.beginPath(); g.arc(0, -r*0.26, r*0.2, 0, 7); g.fill();
    g.restore();
  }
  g.restore();
}

/* 네잎클로버 — 체력 아이콘으로 씀 */
function clover(cx, cy, r, fill, line){
  g.save();
  g.translate(cx, cy);
  g.strokeStyle = line || '#5A4A40'; g.lineWidth = Math.max(1.4, r*0.16); g.lineJoin = 'round';
  g.fillStyle = fill || '#8FBF92';
  for(let i=0;i<4;i++){
    g.save(); g.rotate(i*Math.PI/2 + Math.PI/4);
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(-r*0.85, -r*0.30, -r*0.62, -r*1.06, 0, -r*0.72);
    g.bezierCurveTo( r*0.62, -r*1.06,  r*0.85, -r*0.30, 0, 0);
    g.closePath(); g.fill(); g.stroke();
    g.restore();
  }
  g.beginPath(); g.moveTo(0, r*0.1); g.quadraticCurveTo(r*0.22, r*0.7, r*0.05, r*1.05);
  g.stroke();
  g.restore();
}

function drawEnt(e){
  const x = sx(e.x), yb = sy(e.y);
  if(x < -120 || x > W + 120) return;
  g.save();
  g.strokeStyle = '#5A4A40'; g.lineWidth = LW(); g.lineJoin = 'round';

  if(e.kind === 'spike'){                       // 가시 통나무
    const w = e.w*SC, h = e.h*SC;
    g.fillStyle = '#C89B6A';
    g.beginPath(); g.roundRect(x-w/2, yb-h, w, h, 9*SC); g.fill(); g.stroke();
    g.fillStyle = '#8B6242';
    for(let i=0;i<3;i++){
      const px = x - w/2 + w*(i+0.5)/3;
      g.beginPath(); g.moveTo(px-7*SC, yb-h); g.lineTo(px, yb-h-16*SC); g.lineTo(px+7*SC, yb-h);
      g.closePath(); g.fill(); g.stroke();
    }
    g.fillStyle = '#5A4A40';
    g.beginPath(); g.arc(x-8*SC, yb-h*0.5, 2.6*SC, 0, 7); g.arc(x+8*SC, yb-h*0.5, 2.6*SC, 0, 7); g.fill();
    g.beginPath(); g.arc(x, yb-h*0.26, 5.5*SC, Math.PI+0.2, -0.2); g.stroke();
  }
  else if(e.kind === 'bar'){                    // 위에서 내려온 덩굴 — 슬라이드로만 통과
    const w = 56*SC, y1 = sy(e.y), top = Math.min(sy(e.y + e.h), -20);
    g.fillStyle = '#A9805A';
    g.beginPath(); g.roundRect(x - w/2, top, w, y1 - top, [0, 0, w/2, w/2]); g.fill(); g.stroke();
    /* 잎 — 아래쪽부터 위로 번갈아 */
    g.fillStyle = '#8FBF92';
    for(let i=0;i<5;i++){
      const ly = y1 - (28 + i*52)*SC, sd = i%2 ? 1 : -1;
      if(ly < top) break;
      g.beginPath(); g.ellipse(x + sd*w*0.62, ly, 24*SC, 12*SC, sd*0.45, 0, 7); g.fill(); g.stroke();
    }
    /* 표정 */
    g.fillStyle = '#5A4A40';
    g.beginPath(); g.arc(x - 9*SC, y1 - 30*SC, 2.8*SC, 0, 7); g.arc(x + 9*SC, y1 - 30*SC, 2.8*SC, 0, 7); g.fill();
    g.beginPath(); g.arc(x, y1 - 24*SC, 5*SC, 0.2, Math.PI - 0.2); g.stroke();
    /* 지나갈 틈 표시 */
    g.save(); g.setLineDash([6*SC, 6*SC]); g.strokeStyle = 'rgba(120,95,75,.35)'; g.lineWidth = LW();
    g.beginPath(); g.moveTo(x - w*0.9, y1 + 2*SC); g.lineTo(x + w*0.9, y1 + 2*SC); g.stroke(); g.restore();
  }
  else if(e.kind === 'jelly' || e.kind === 'big'){
    const r = (e.kind === 'big' ? 27 : 16) * SC, bob = Math.sin(tick*3 + e.bx*0.02)*3*SC;
    const cy = yb + bob, spin = Math.abs(Math.cos(tick*2.2 + e.bx*0.01));
    g.fillStyle = e.kind === 'big' ? 'rgba(255,211,110,.45)' : 'rgba(255,224,138,.3)';
    g.beginPath(); g.arc(x, cy, r*(e.kind === 'big' ? 1.6 : 1.3), 0, 7); g.fill();
    g.save(); g.translate(x, cy); g.scale(0.35 + 0.65*spin, 1);
    coin(0, 0, r, e.kind === 'big'); g.restore();
  }
  else if(e.kind === 'goal'){
    const s2 = 120*SC, bx = x - s2*0.5, by = yb - s2;
    g.fillStyle = '#FFF3D6';                                  // 배달할 집
    g.beginPath(); g.rect(bx, by, s2, s2); g.fill(); g.stroke();
    g.fillStyle = '#D98E6A';
    g.beginPath(); g.moveTo(bx - s2*0.14, by); g.lineTo(x, by - s2*0.42);
    g.lineTo(bx + s2*1.14, by); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#C87A58';
    g.beginPath(); g.rect(x - s2*0.16, yb - s2*0.55, s2*0.32, s2*0.55); g.fill(); g.stroke();
    g.fillStyle = '#CDEBFA';
    g.beginPath(); g.rect(bx + s2*0.12, by + s2*0.16, s2*0.22, s2*0.22); g.fill(); g.stroke();
    g.beginPath(); g.rect(bx + s2*0.66, by + s2*0.16, s2*0.22, s2*0.22); g.fill(); g.stroke();
    g.fillStyle = '#5A4A40'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `700 ${20*SC}px Gaegu, sans-serif`;
    g.fillText('배달 도착', x, by - s2*0.58);
  }
  g.restore();
}

function drawPlayer(){
  const ph = player.sliding ? PH_SLIDE : PH;
  const x = sx(player.x), yb = sy(player.y);
  const air = !player.onGround;
  const im = IMG[me.run];                       // 입은 모습 그대로
  const baseH = 104 * (me.scale || 1) * stScale * SC;
  const bob = air ? 0 : Math.abs(Math.sin(tick * (8 + speed/90))) * 7 * SC;
  let rot = 0, sqx = 1, sqy = 1;

  if(player.sliding){ sqx = 1.28; sqy = 0.56; rot = 0.06; }        // 납작하게
  else if(air){
    if(player.vy > 0){ sqx = 0.90; sqy = 1.16; rot = -0.05; }      // 솟을 땐 길쭉
    else { sqx = 1.06; sqy = 0.94; rot = 0.04; }                   // 내려올 땐 살짝 납작
  }else{
    rot = Math.sin(tick*(8 + speed/90)) * 0.06;
    const k2 = Math.abs(Math.sin(tick*(8 + speed/90)));
    sqx = 1 + k2*0.03; sqy = 1 - k2*0.03;
  }

  g.save();
  const baseAlpha = (player.inv > 0 && Math.floor(player.inv*14) % 2 === 0) ? 0.35 : 1;
  g.globalAlpha = baseAlpha;

  if(skill === 'dash'){
    g.globalAlpha = baseAlpha * 0.35;
    for(let i=1;i<=3;i++){
      g.save(); g.translate(x - i*26*SC, yb - bob - (me.float||0)*SC*0.4);
      g.rotate(rot); g.scale((me.flip === false ? 1 : -1)*sqx, sqy);
      if(im && im.complete) g.drawImage(im, -baseH*0.5, -baseH, baseH, baseH);
      g.restore();
    }
    g.globalAlpha = baseAlpha;
  }

  g.translate(x, yb - bob - (me.float || 0) * SC * 0.4);
  g.rotate(rot); g.scale((me.flip === false ? 1 : -1) * sqx, sqy);
  /* 등에 멘 배달 가방 (몸 뒤쪽) */
  g.fillStyle = '#D98E6A'; g.strokeStyle = '#5A4A40'; g.lineWidth = LW();
  const bw2 = baseH*0.36;
  g.beginPath(); g.rect(baseH*0.30, -baseH*0.86, bw2, bw2*0.9); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(baseH*0.30, -baseH*0.86+bw2*0.34);
  g.lineTo(baseH*0.30+bw2, -baseH*0.86+bw2*0.34); g.stroke();
  if(im && im.complete && im.naturalWidth) g.drawImage(im, -baseH*0.5, -baseH, baseH, baseH);
  else { g.fillStyle = '#F3EAE1'; g.strokeStyle = '#5A4A40'; g.lineWidth = LW();
         g.beginPath(); g.ellipse(0, -baseH*0.4, baseH*0.3, baseH*0.36, 0, 0, 7); g.fill(); g.stroke(); }
  g.restore();

  /* 스킬 남은 시간 */
  if(skillT > 0){
    const sk = SKILLS[skill];
    g.save(); g.strokeStyle = sk.color; g.lineWidth = LW(); g.lineCap = 'round';
    g.beginPath(); g.arc(x, yb - ph*SC*0.5, PW*1.15*SC, -Math.PI/2, -Math.PI/2 + 6.283*(skillT/sk.dur));
    g.stroke(); g.restore();
  }
}
function drawFx(){
  for(const p of fx){
    const k = 1 - p.t/p.life, x = sx(p.x), y = sy(p.y);
    g.save(); g.globalAlpha = Math.max(0, k);
    if(p.kind === 'dust'){ g.fillStyle = '#D9C4A0'; g.beginPath(); g.arc(x, y, 7*SC*k, 0, 7); g.fill(); }
    else if(p.kind === 'ring'){ g.strokeStyle = p.c; g.lineWidth = LW();
      g.beginPath(); g.arc(x, y, (10 + 46*(1-k))*SC, 0, 7); g.stroke(); }
    else { g.fillStyle = p.c || '#FFD36E'; g.strokeStyle = '#5A4A40'; g.lineWidth = LW();
      g.beginPath(); g.arc(x, y, 6*SC*k + 2, 0, 7); g.fill(); g.stroke(); }
    g.restore();
  }
}

function drawHud(){
  const k = Math.max(0.85, Math.min(1.6, Math.min(W/960, H/540)));
  g.save(); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  /* 점수 */
  g.fillStyle = '#5A4A40';
  g.font = `700 ${34*k}px Gaegu, sans-serif`;
  g.fillText(Math.floor(score).toLocaleString(), 16*k, 40*k);
  /* 동전 */
  coin(26*k, 58*k, 11*k, false);
  g.fillStyle = '#5A4A40'; g.font = `700 ${20*k}px Gaegu, sans-serif`;
  g.fillText('× ' + jellyN + (combo > 2 ? '   ' + combo + ' 연속!' : ''), 41*k, 65*k);
  /* 체력 */
  for(let i=0;i<Math.max(CO.hp, player.hp);i++){
    g.globalAlpha = i < player.hp ? 1 : 0.2;
    clover(26*k + i*26*k, 92*k, 11*k, i < player.hp ? '#EFA6B8' : '#FFF8F0');
  }
  g.globalAlpha = 1;
  /* 스킬 게이지 */
  const gw = 150*k, gx = 16*k, gy = 112*k, sk = skillOf(me);
  g.fillStyle = '#FFF8F0'; g.strokeStyle = '#5A4A40'; g.lineWidth = LW();
  g.beginPath(); g.roundRect(gx, gy, gw, 16*k, 8*k); g.fill(); g.stroke();
  g.fillStyle = energy >= 100 ? sk.color : '#CFE0CB';
  g.beginPath(); g.roundRect(gx+2.5*k, gy+2.5*k, (gw-5*k)*(energy/100), 11*k, 6*k); g.fill();
  g.fillStyle = '#5A4A40'; g.font = `700 ${14*k}px Gaegu, sans-serif`;
  g.fillText(energy >= 100 ? (sk.name + '  [E]') : sk.name, gx, gy + 32*k);
  if(energy >= 100){
    g.globalAlpha = 0.5 + Math.sin(tick*6)*0.4; g.strokeStyle = sk.color; g.lineWidth = LW();
    g.beginPath(); g.roundRect(gx-3*k, gy-3*k, gw+6*k, 22*k, 11*k); g.stroke(); g.globalAlpha = 1;
  }
  /* 진행 막대 */
  const pw = Math.min(360*k, Math.max(120*k, W*0.34)), px = (W - pw)/2, py = (W < 620 ? 52*k : 22*k);
  g.fillStyle = '#FFF8F0'; g.strokeStyle = '#5A4A40'; g.lineWidth = LW();
  g.beginPath(); g.roundRect(px, py, pw, 12*k, 6*k); g.fill(); g.stroke();
  const pr = clamp(player.x / GOALX, 0, 1);
  g.fillStyle = '#EFA6B8';
  g.beginPath(); g.roundRect(px+2*k, py+2*k, Math.max(0,(pw-4*k)*pr), 8*k, 4*k); g.fill();
  const hi = IMG[me.run];
  if(hi && hi.complete && hi.naturalWidth) g.drawImage(hi, px + (pw-4*k)*pr - 14*k, py - 22*k, 30*k, 30*k);
  g.fillStyle = '#8A7264'; g.font = `${12*k}px Gowun Dodum, sans-serif`; g.textAlign = 'center';
  g.fillText(Math.floor(dist/10) + ' m', px + pw/2, py + 30*k);

  /* 알림 */
  if(toastT > 0){
    g.globalAlpha = Math.min(1, toastT*2.2);
    g.textAlign = 'center'; g.fillStyle = '#5A4A40';
    g.font = `700 ${34*k}px Gaegu, sans-serif`;
    g.fillText(toastTx, W/2, H*0.34);
    g.globalAlpha = 1;
  }
  g.restore();
}

function draw(){
  g.clearRect(0, 0, W, H);
  g.save();
  if(shake > 0) g.translate((Math.random()-.5)*10*shake*SC, (Math.random()-.5)*10*shake*SC);
  drawSky();
  drawGround();
  for(const e of ents){ if(!e.gone) drawEnt(e); }
  drawPlayer();
  drawFx();
  g.restore();
  if(CO.dark){                                   // 야간 — 두기 주변만 밝게
    const px = sx(player.x), py = sy(player.y + 40);
    const gr2 = g.createRadialGradient(px, py, H*0.10, px, py, H*0.62);
    gr2.addColorStop(0, 'rgba(20,22,40,0)'); gr2.addColorStop(1, 'rgba(20,22,40,.62)');
    g.fillStyle = gr2; g.fillRect(0, 0, W, H);
  }
  if(state === 'play' || state === 'pause') drawHud();
}

/* ===== 바깥에서 쓰는 창구 ===== */
function start(o){
  me = o.look || CHARS[0];
  stScale = 1;
  CO = COURSE(o.course || 'town');
  onEnd = o.onEnd;
  sync(); reset(); hits.length = 0; state = 'play';
  held.jump = held.slide = false;
  runBgmStart();
}
function finish(ok){
  if(state === 'over') return;
  state = 'over'; runBgmStop();
  ok ? SFX.goal() : SFX.over();
  const total = ents.filter(e => e.kind === 'jelly' || e.kind === 'big').length;
  if(ok) score += 500 + player.hp * 300;
  if(onEnd) onEnd({ score: Math.round(score), jelly: jellyN, dist, cleared: ok,
                    hp: player.hp, combo: maxCombo, total });
}
function frame(dt, active){
  sync();
  if(active) update(dt);
  draw();
}
function key(code, down){
  if(down){
    if(code === 'Space' || code === 'ArrowUp' || code === 'KeyW'){ held.jump = true; doJump(); }
    else if(code === 'ArrowDown' || code === 'KeyS') setSlide(true);
    else if(code === 'KeyE' || code === 'ShiftLeft') useSkill();
  }else{
    if(code === 'Space' || code === 'ArrowUp' || code === 'KeyW') held.jump = false;
    if(code === 'ArrowDown' || code === 'KeyS') setSlide(false);
  }
}
function pad(k, down){
  if(k === 'jump'){ held.jump = down; if(down) doJump(); }
  else if(k === 'slide') setSlide(down);
  else if(k === 'skill' && down) useSkill();
}
function pointer(yFrac, down){
  if(!down){ setSlide(false); return; }
  if(yFrac < 0.6) doJump(); else setSlide(true);
}
function quit(){ state = 'over'; runBgmStop(); goHome(); }
return { start, frame, key, pad, pointer, quit, resize: sync,
         state: () => state, peek: () => ({ state, player, ents, segs, speed, energy, skill, hits,
                                            score, jellyN, dist, maxCombo, MAPEND, GOALX }),
         debug: { doJump, setSlide, useSkill } };
})();

"use strict";
/* 카페 알바 — 기억력 — 꺅두기 하우스 */

/* ===============================================================
   카페 알바 — 손님 주문을 외워서 순서대로 담기
   =============================================================== */
const CafeGame = (function(){
"use strict";

const MENU = [
  { id:'coffee', name:'커피',   color:'#B98F58' },
  { id:'milk',   name:'우유',   color:'#FFF8F0' },
  { id:'juice',  name:'주스',   color:'#E0A45C' },
  { id:'cake',   name:'케이크', color:'#EFA6B8' },
  { id:'cookie', name:'쿠키',   color:'#D9B884' },
  { id:'tea',    name:'차',     color:'#8FBF92' }
];
let state = 'idle';          // show · input · good · bad · over
let order = [], input = [], round = 0, miss = 0, score = 0, tip = 0;
let t = 0, showI = 0, onEnd = null, guest = null, best = 0, hitBox = [];
const MISS_MAX = 3;

function start(o){
  onEnd = o.onEnd;
  round = 0; miss = 0; score = 0; tip = 0; state = 'show'; t = 0;
  best = S.cafeBest || 0;
  nextRound();
}
function nextRound(){
  round++;
  const len = Math.min(8, 2 + round);
  order = []; input = []; showI = 0; t = 0; state = 'show';
  for(let i = 0; i < len; i++) order.push(MENU[Math.floor(Math.random() * MENU.length)].id);
  guest = CHARS[Math.floor(Math.random() * CHARS.length)];
}
function tapMenu(id){
  if(state !== 'input') return;
  const want = order[input.length];
  input.push(id);
  if(id !== want){
    miss++; state = 'bad'; t = 0; sfxNo();
    if(miss >= MISS_MAX) setTimeout(() => finish(), 900);
    return;
  }
  blip(660 + input.length * 70, 0.06);
  if(input.length === order.length){
    const gain = 60 * order.length + Math.max(0, Math.round(80 - t * 12));
    score += gain; tip += order.length;
    state = 'good'; t = 0; sfxCoin(3);
  }
}
function finish(){
  if(state === 'over') return;
  state = 'over';
  if(onEnd) onEnd({ score: Math.round(score), rounds: round - 1, tip, miss });
}
function update(dt){
  t += dt;
  if(state === 'show'){
    const step = Math.max(0.42, 0.72 - round * 0.03);
    if(t > step){ t = 0; showI++; if(showI > order.length){ state = 'input'; t = 0; } }
  }else if(state === 'input'){
    if(t > order.length * 2.2 + 2){ miss++; state = 'bad'; t = 0; sfxNo();
      if(miss >= MISS_MAX) setTimeout(() => finish(), 900); }
  }else if(state === 'good'){
    if(t > 1.1) nextRound();
  }else if(state === 'bad'){
    if(t > 1.1){ if(miss >= MISS_MAX) finish(); else { input = []; state = 'show'; showI = 0; t = 0; } }
  }
}

/* ===== 그리기 ===== */
function cup(x, y, r, m){
  g.save(); ink();
  if(m.id === 'cake'){
    g.fillStyle = '#F7EEDC'; rrect(x - r, y - r * 0.4, r * 2, r * 1.1, r * 0.2); g.fill(); g.stroke();
    g.fillStyle = m.color; rrect(x - r, y - r * 0.72, r * 2, r * 0.4, r * 0.16); g.fill(); g.stroke();
    g.fillStyle = '#FF8FA6';
    g.beginPath(); g.arc(x, y - r * 0.9, r * 0.18, 0, 7); g.fill(); g.stroke();
  }else if(m.id === 'cookie'){
    g.fillStyle = m.color; g.beginPath(); g.arc(x, y, r * 0.9, 0, 7); g.fill(); g.stroke();
    g.fillStyle = '#7A5230';
    [[-0.3, -0.2], [0.25, 0.1], [0, 0.35], [0.35, -0.35]].forEach(([a, b2]) => {
      g.beginPath(); g.arc(x + a * r, y + b2 * r, r * 0.12, 0, 7); g.fill(); });
  }else{
    g.fillStyle = m.color;
    g.beginPath(); g.moveTo(x - r * 0.62, y - r * 0.7); g.lineTo(x + r * 0.62, y - r * 0.7);
    g.lineTo(x + r * 0.45, y + r * 0.8); g.lineTo(x - r * 0.45, y + r * 0.8);
    g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#FFF8F0';
    g.beginPath(); g.ellipse(x, y - r * 0.7, r * 0.62, r * 0.16, 0, 0, 7); g.fill(); g.stroke();
    if(m.id === 'coffee' || m.id === 'tea'){
      g.save(); g.globalAlpha = .55; g.strokeStyle = '#FFFFFF'; g.lineWidth = LW() * 0.7;
      for(let i = -1; i <= 1; i++){
        g.beginPath(); g.moveTo(x + i * r * 0.3, y - r * 0.95);
        g.quadraticCurveTo(x + i * r * 0.3 + r * 0.2, y - r * 1.25, x + i * r * 0.3, y - r * 1.5);
        g.stroke(); }
      g.restore();
    }
  }
  g.restore();
}
function draw(){
  const k = uiK();
  /* 카페 벽 */
  const wg = g.createLinearGradient(0, 0, 0, H);
  wg.addColorStop(0, '#F6EADB'); wg.addColorStop(1, '#EADBC6');
  g.fillStyle = wg; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(160,130,90,.18)'; g.lineWidth = LW() * 0.5;
  for(let y = H * 0.1; y < H * 0.62; y += H * 0.09){ g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  /* 메뉴판 */
  g.save(); ink(); g.fillStyle = '#C9A06A';
  rrect(W * 0.62, H * 0.06, W * 0.32, H * 0.2, 12 * k); g.fill(); g.stroke();
  g.fillStyle = '#3E3428'; g.textAlign = 'center';
  g.font = '700 ' + (20 * k) + 'px Gaegu, sans-serif';
  g.fillText('MENU', W * 0.78, H * 0.12);
  g.font = '400 ' + (12 * k) + 'px Gowun Dodum, sans-serif'; g.fillStyle = '#F3EAE1';
  g.fillText('커피 · 우유 · 주스', W * 0.78, H * 0.17);
  g.fillText('케이크 · 쿠키 · 차', W * 0.78, H * 0.21);
  g.restore();
  /* 카운터 */
  const cy = H * 0.62;
  g.fillStyle = '#D9B884'; g.fillRect(0, cy, W, H - cy);
  ink(); g.beginPath(); g.moveTo(0, cy); g.lineTo(W, cy); g.stroke();
  g.fillStyle = '#C9A06A'; g.fillRect(0, cy + (H - cy) * 0.3, W, (H - cy) * 0.7);
  g.beginPath(); g.moveTo(0, cy + (H - cy) * 0.3); g.lineTo(W, cy + (H - cy) * 0.3); g.stroke();

  /* 손님 */
  if(guest){
    const im = IMG[guest.run], gh = Math.min(H * 0.3, W * 0.2);
    if(im && im.complete){
      g.save(); g.translate(W * 0.16, cy + 6); g.scale(guest.flip === false ? 1 : -1, 1);
      g.drawImage(im, -gh * 0.5, -gh, gh, gh); g.restore();
    }
    /* 주문 말풍선 */
    const bw = Math.min(W * 0.52, 70 * k * Math.max(3, order.length)), bh = H * 0.19;
    const bx = W * 0.3, by = H * 0.26;
    g.save(); ink(); g.fillStyle = '#FFF8F0';
    rrect(bx, by, bw, bh, 18 * k); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(bx + 18 * k, by + bh); g.lineTo(bx + 6 * k, by + bh + 16 * k);
    g.lineTo(bx + 40 * k, by + bh); g.closePath(); g.fillStyle = '#FFF8F0'; g.fill(); g.stroke();
    const n = order.length, r = Math.min(bh * 0.3, bw / (n + 1) * 0.42);
    order.forEach((id, i) => {
      const m = MENU.find(x => x.id === id);
      const x = bx + bw * (i + 0.5) / n, y = by + bh * 0.5;
      const shown = state === 'show' ? i < showI
                  : state === 'input' ? i < input.length
                  : true;
      if(shown){
        cup(x, y, r, m);
        if(state === 'input' && i < input.length){
          g.fillStyle = '#8FBF92'; g.beginPath();
          g.arc(x + r * 0.8, y - r * 0.9, r * 0.28, 0, 7); g.fill(); ink(); g.stroke();
        }
      }else{
        g.fillStyle = '#E7DFCF'; ink(LW() * 0.8);
        rrect(x - r * 0.7, y - r * 0.8, r * 1.4, r * 1.7, r * 0.3); g.fill(); g.stroke();
        g.fillStyle = '#B3A894'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.font = '700 ' + (r * 1.2) + 'px Gaegu, sans-serif'; g.fillText('?', x, y);
      }
    });
    g.restore();
  }

  /* 메뉴 버튼 */
  hitBox = [];
  const bw2 = Math.min(W * 0.14, 120 * k), bh2 = bw2 * 0.82, gap = bw2 * 0.12;
  const total = MENU.length * bw2 + (MENU.length - 1) * gap, x0 = W / 2 - total / 2;
  MENU.forEach((m, i) => {
    const x = x0 + i * (bw2 + gap), y = H - bh2 - 16 * k;
    const on = state === 'input';
    g.save(); g.globalAlpha = on ? 1 : 0.45;
    ink(); g.fillStyle = '#FFF8F0';
    rrect(x, y, bw2, bh2, 14 * k); g.fill(); g.stroke();
    cup(x + bw2 / 2, y + bh2 * 0.4, bw2 * 0.2, m);
    g.fillStyle = '#5A4A40'; g.textAlign = 'center';
    g.font = '700 ' + (15 * k) + 'px Gaegu, sans-serif';
    g.fillText(m.name, x + bw2 / 2, y + bh2 * 0.88);
    g.restore();
    hitBox.push({ id:m.id, x, y, w:bw2, h:bh2 });
  });

  /* HUD */
  g.save(); g.textAlign = 'left'; g.fillStyle = '#5A4A40';
  g.font = '700 ' + (30 * k) + 'px Gaegu, sans-serif';
  g.fillText(Math.round(score).toLocaleString('ko-KR'), 16 * k, 40 * k);
  g.font = '700 ' + (17 * k) + 'px Gaegu, sans-serif';
  g.fillText(round + '번째 손님 · 주문 ' + order.length + '개', 16 * k, 64 * k);
  for(let i = 0; i < MISS_MAX; i++){
    g.globalAlpha = i < MISS_MAX - miss ? 1 : 0.2;
    g.fillStyle = '#EFA6B8'; ink(LW() * 0.8);
    g.beginPath(); g.arc(24 * k + i * 26 * k, 84 * k, 9 * k, 0, 7); g.fill(); g.stroke();
  }
  g.globalAlpha = 1;
  g.textAlign = 'center'; g.fillStyle = '#5A4A40';
  g.font = '700 ' + (26 * k) + 'px Gaegu, sans-serif';
  if(state === 'show') g.fillText('잘 외워두세요!', W / 2, H * 0.13);
  if(state === 'input') g.fillText('순서대로 담아요', W / 2, H * 0.13);
  if(state === 'good'){ g.fillStyle = '#8FBF92'; g.fillText('주문 완료! +' + order.length + ' 팁', W / 2, H * 0.13); }
  if(state === 'bad'){ g.fillStyle = '#C9A9A9'; g.fillText('앗, 틀렸어요', W / 2, H * 0.13); }
  g.restore();
}

function frame(dt, active){ if(active) update(dt); draw(); }
function pointer(px, py){
  if(state !== 'input') return;
  for(const b of hitBox)
    if(px > b.x && px < b.x + b.w && py > b.y && py < b.y + b.h){ tapMenu(b.id); return; }
}
function key(code){
  if(state !== 'input') return;
  const i = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6'].indexOf(code);
  if(i >= 0) tapMenu(MENU[i].id);
}
function quit(){ state = 'over'; goHome(); }
return { start, frame, pointer, key, quit, peek: () => ({ state, round, miss, score, order, input }),
         tap: tapMenu, MENU };
})();

"use strict";
/* 셸 — 화면 전환·입력·루프 — 꺅두기 하우스 */

  $('dailyPanel').hidden = true;
  home.x = 0.12; home.y = 0.28; home.target = null; home.autoAct = null;
  home.vx = home.vy = 0; home.act = null; home.sweep = false;
  home.ball.home = true; home.aim = null;
  toast('정원으로 나왔어요', '가게 · 뽑기 · 알바 게시판이 있어요');
  refreshBar();
}

/* ===== 배달 알바 ===== */
function startRun(){
  closeModal(); initAudio(); bgmStop();
  if(ctx && ctx.state === 'suspended') ctx.resume();
  mode = 'run'; $('topbar').hidden = true; $('careBar').hidden = true; showScreen(null);
  $('runPad').hidden = !(W < 760 || matchMedia('(pointer:coarse)').matches);
  DugiRun.start({ look: look(), course: S.course, onEnd: runEnd });
}
function runEnd(r){
  mode = 'runresult';
  $('runPad').hidden = true;
  const co = COURSE(S.course), before = S.career.deliver || 0;
  const pay = Math.round((r.jelly * 3.6 + r.dist / 110 + (r.cleared ? 90 + r.hp * 45 : 0))
                         * co.pay * payMult('deliver'));
  const grade = r.cleared ? (r.score > 6000 ? 'S' : r.score > 4500 ? 'A' : r.score > 3200 ? 'B' : 'C') : '-';
  $('runTitle').textContent = r.cleared ? '배달 완료!' : '배달 실패…';
  $('runArt').src = SRC[look().run];
  $('runScore').textContent = Math.round(r.score).toLocaleString('ko-KR');
  $('rDist').textContent = Math.floor(r.dist / 10) + ' m';
  $('rJelly').textContent = r.jelly + ' / ' + r.total;
  $('rCombo').textContent = r.combo;
  $('rGrade').textContent = grade;
  if(r.score > (S.runBest || 0)){ S.runBest = Math.round(r.score); $('runBest').textContent = '새 기록!'; }
  else $('runBest').textContent = '최고 기록 ' + (S.runBest || 0).toLocaleString('ko-KR');
  payOut(pay, 'deliver', 'runReward', co.name);
  careerUp('deliver', before);
  showScreen($('runResult'));
  bgmStart();
}

/* ===== 카페 알바 ===== */
function startCafe(){
  closeModal(); initAudio(); bgmStop();
  if(ctx && ctx.state === 'suspended') ctx.resume();
  mode = 'cafe'; $('topbar').hidden = true; $('careBar').hidden = true; showScreen(null);
  CafeGame.start({ onEnd: cafeEnd });
}
function cafeEnd(r){
  mode = 'caferesult';
  const before = S.career.cafe || 0;
  const pay = Math.round((r.score / 9 + r.tip * 12 + 40) * payMult('cafe'));
  $('runTitle').textContent = r.rounds >= 5 ? '오늘도 수고!' : '조금 아쉬워요';
  $('runArt').src = SRC[look().run];
  $('runScore').textContent = Math.round(r.score).toLocaleString('ko-KR');
  $('rDist').textContent = r.rounds + '명';
  $('rJelly').textContent = r.tip + '잔';
  $('rCombo').textContent = 3 - r.miss + ' / 3';
  $('rGrade').textContent = r.rounds >= 7 ? 'S' : r.rounds >= 5 ? 'A' : r.rounds >= 3 ? 'B' : 'C';
  if(r.score > (S.cafeBest || 0)){ S.cafeBest = Math.round(r.score); $('runBest').textContent = '새 기록!'; }
  else $('runBest').textContent = '최고 기록 ' + (S.cafeBest || 0).toLocaleString('ko-KR');
  $('runAgain').textContent = '한 번 더';
  payOut(pay, 'cafe', 'runReward', '카페 알바');
  careerUp('cafe', before);
  showScreen($('runResult'));
  bgmStart();
}

/* ===== 처음 시작 ===== */
function askName(){
  showScreen($('introScreen'));
  $('introName').value = S.dugi.name;
  $('topbar').hidden = true; $('careBar').hidden = true;
  setTimeout(() => $('introName').focus(), 200);
}
function finishIntro(){
  const v = ($('introName').value || '').trim().slice(0, 6) || '두기';
  S.dugi.name = v; S.named = true; save();
  initAudio(); goHome();
  toast(v + '와(과) 함께!', '두기를 쓰다듬어 보세요');
}

/* ===== 오늘의 할 일 ===== */
function paintDaily(){
  const el = $('dailyList'); if(!el) return;
  checkDaily();
  el.innerHTML = '';
  let left = 0;
  S.daily.list.forEach(row => {
    const def = dailyDef(row.id); if(!def) return;
    if(!row.got) left++;
    const li = document.createElement('div');
    li.className = 'dq' + (row.got ? ' got' : '');
    li.innerHTML = '<span class="chk">' + (row.got ? '✓' : '') + '</span>' +
      '<b>' + def.txt + '</b><i>' + Math.min(row.n, def.need) + '/' + def.need + '</i>' +
      '<span class="pay">' + CLOVER_SVG + def.pay + '</span>';
    el.appendChild(li);
  });
  const btn = $('dailyBtn');
  if(btn) btn.classList.toggle('alert', left > 0);
}

/* ===== 입력 ===== */
const KMAP = { KeyW:'w', KeyA:'a', KeyS:'s', KeyD:'d',
               ArrowUp:'w', ArrowLeft:'a', ArrowDown:'s', ArrowRight:'d' };

addEventListener('keydown', e => {
  audioKick();
  if(mode === 'run'){
    if(e.code === 'Escape'){ DugiRun.quit(); return; }
    if(!e.repeat) DugiRun.key(e.code, true);
    if(['Space','ArrowUp','ArrowDown','KeyW','KeyS','KeyE'].includes(e.code)) e.preventDefault();
    return;
  }
  if(mode === 'cafe'){
    if(e.code === 'Escape'){ CafeGame.quit(); return; }
    CafeGame.key(e.code); return;
  }
  if(mode === 'home' && !modalOpen){
    if(mini && e.code === 'Escape'){ closeMini(); return; }
    if(KMAP[e.code] && !mini){ e.preventDefault(); keys[KMAP[e.code]] = true; home.target = null; return; }
    if((e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter') && !mini){
      e.preventDefault(); if(home.near) act(home.near); return; }
  }
  if(modalOpen && e.code === 'Escape'){ closeModal(); return; }
  if(e.repeat) return;
  if(mode === 'cut'){
    if(e.code === 'Escape'){ e.preventDefault(); skipCut(); }
    else if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); advanceCut(); }
    return;
  }
  if(keyWait >= 0 && modalOpen === 'settings'){
    e.preventDefault();
    if(e.code !== 'Escape'){ settings.keys[keyWait] = e.code; save(); }
    keyWait = -1; openModal('settings'); return;
  }
  if(mode === 'play' && !modalOpen){
    const ln = laneOfCode(e.code);
    if(ln !== undefined){ e.preventDefault(); laneHold[ln] = true; hit(ln); return; }
  }
  if(e.code === 'Escape'){
    if(modalOpen) closeModal();
    else if(mode === 'play') pause();
    else if(mode === 'pause') resumePlay();
  }
});
addEventListener('keyup', e => {
  if(mode === 'run'){ DugiRun.key(e.code, false); return; }
  if(KMAP[e.code]) keys[KMAP[e.code]] = false;
  const ln = laneOfCode(e.code); if(ln !== undefined) laneHold[ln] = false;
});
addEventListener('blur', () => { for(const k in keys) keys[k] = false; });

let ptrDown = false;
function canvasXY(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  audioKick(); ptrDown = true;
  const p = canvasXY(e);
  if(mode === 'run'){ DugiRun.pointer(p.y / H, true); return; }
  if(mode === 'cafe'){ CafeGame.pointer(p.x, p.y); return; }
  if(mode === 'cut'){ advanceCut(); return; }
  if(mode === 'home'){
    if(mini && mini.kind === 'feed'){ miniClick(p.x, p.y); return; }
    homeDown(p.x, p.y); return;
  }
  if(mode !== 'play') return;
  const ln = Math.max(0, Math.min(3, Math.floor((p.x - fieldX()) / laneW())));
  touchLane[e.pointerId] = ln; laneHold[ln] = true; hit(ln);
});
cv.addEventListener('pointermove', e => {
  if(mode !== 'home') return;
  const p = canvasXY(e);
  homeMove(p.x, p.y, ptrDown);
});
cv.addEventListener('pointerup', e => {
  ptrDown = false;
  if(mode === 'run'){ DugiRun.pointer(0, false); return; }
  if(mode === 'home'){ homeUp(); return; }
  const ln = touchLane[e.pointerId];
  if(ln !== undefined){ laneHold[ln] = false; delete touchLane[e.pointerId]; }
});
cv.addEventListener('pointercancel', e => {
  ptrDown = false;
  if(mode === 'home'){ homeUp(); return; }
  const ln = touchLane[e.pointerId];
  if(ln !== undefined){ laneHold[ln] = false; delete touchLane[e.pointerId]; }
});
document.addEventListener('visibilitychange', () => { if(document.hidden && mode === 'play') pause(); });

document.addEventListener('pointerdown', e => {
  audioKick();
  if(e.target.closest('button,.songrow,.dcard,.lv,.cover,.sinfo,.shopcard,.jobcard,.tab')) uiClick();
}, true);
function audioKick(){
  initAudio();
  if(mode !== 'pause' && !cdTimer && ctx.state === 'suspended') ctx.resume();
  if(mode === 'home' || mode === 'result' || mode === 'runresult' || mode === 'caferesult') bgmStart();
}

/* 버튼 */
$('shopBtn').onclick = () => openModal('shop');
$('dexBtn').onclick  = () => openModal('wardrobe');
$('setBtn').onclick  = () => openModal('settings');
$('outBtn').onclick  = () => openModal('job');
$('dailyBtn').onclick = () => { $('dailyPanel').hidden = !$('dailyPanel').hidden; paintDaily(); };
$('decoBtn').onclick = () => {
  if(place !== 'room'){ toast('집 안에서만 꾸밀 수 있어요', ''); return; }
  deco = !deco; mini = null;
  $('decoBtn').classList.toggle('on', deco);
  $('careBar').hidden = deco || mode !== 'home' || place !== 'room';
  toast(deco ? '꾸미기 모드' : '꾸미기 끝', deco ? '가구를 끌어서 옮기세요' : '자리를 저장했어요');
  if(!deco) save();
};
$('modalClose').onclick = closeModal;
modal.addEventListener('pointerdown', e => { if(e.target === modal) closeModal(); });
$('pauseBtn').onclick = () => pause();
$('resumeBtn').onclick = () => resumePlay();
$('quitBtn').onclick = () => quitPlay();
$('againBtn').onclick = () => startGame();
$('homeBtn').onclick = () => goHome();
$('runAgain').onclick = () => { if(mode === 'caferesult') startCafe(); else startRun(); };
$('runHome').onclick = () => goHome();
$('introGo').onclick = () => finishIntro();
$('introName').addEventListener('keydown', e => { if(e.key === 'Enter') finishIntro(); });
$('skipBtn').onclick = () => skipCut();
$('fsBtn').onclick = () => toggleFs();
$('miniClose').onclick = () => closeMini();
function toggleFs(){
  try{
    if(!document.fullscreenElement){
      const el = document.documentElement, r = el.requestFullscreen || el.webkitRequestFullscreen;
      if(r) Promise.resolve(r.call(el)).catch(() => {});
    }else if(document.exitFullscreen) document.exitFullscreen();
  }catch(e){}
}
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('fs', !!document.fullscreenElement); resize();
});
[['rJump', 'jump'], ['rSlide', 'slide'], ['rSkill', 'skill']].forEach(([id, k]) => {
  const el = $(id); if(!el) return;
  el.addEventListener('pointerdown', e => { e.preventDefault(); DugiRun.pad(k, true); });
  el.addEventListener('pointerup', () => DugiRun.pad(k, false));
  el.addEventListener('pointercancel', () => DugiRun.pad(k, false));
});

/* ===== 메인 루프 ===== */
function frame(ts){
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  try{
    if(mode === 'cut' && cut){ drawCut(dt); }
    else if(mode === 'run' || mode === 'runresult'){ DugiRun.frame(dt, mode === 'run'); }
    else if(mode === 'cafe' || mode === 'caferesult'){ CafeGame.frame(dt, mode === 'cafe'); }
    else if(mode === 'play' || mode === 'pause' || mode === 'result'){ stepPlay(dt, ts); }
    else { updateHome(dt); drawHome(dt); }
    $('miniClose').hidden = !(mode === 'home' && mini);
  }catch(err){
    console.error('frame', err);            // 한 번 삐끗해도 게임은 계속 돈다
  }
  requestAnimationFrame(frame);
}

/* ===== 시작 ===== */
seedScenery();
resize();
applySkin();
checkDaily();
if(S.named) goHome(); else askName();
refreshBar();
requestAnimationFrame(frame);

})();
</script>
