  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);
       -webkit-font-smoothing:antialiased;overflow:hidden;}
  #app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:8px;box-sizing:border-box;gap:0;}
  #stage{position:relative;width:100%;height:100%;max-width:none;max-height:none;
         container-type:size;
         border:3px solid var(--line);border-radius:32px;overflow:hidden;background:var(--cream);
         box-shadow:0 12px 28px var(--sh2);}
  body.fs #app{padding:0;}
  body.fs #stage{border-radius:0;border-width:0;box-shadow:none;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
          justify-content:center;justify-content:safe center;gap:10px;text-align:center;
          background:rgba(252,248,243,.9);padding:14px 16px;box-sizing:border-box;
          overflow-y:auto;overscroll-behavior:contain;}
  .screen > *{flex:none;}
  .screen[hidden]{display:none!important;}
  .screen.scroll{justify-content:flex-start;overflow-y:auto;overscroll-behavior:contain;}

  h1{font-family:var(--display);font-weight:700;margin:0;font-size:clamp(32px,6.6vw,58px);
     line-height:1;text-wrap:balance;}
  h1 .sub{display:block;font-size:.32em;font-weight:400;color:var(--ink-soft);letter-spacing:2px;margin-top:8px;}
  h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:.5px;}
  .mascot{width:clamp(88px,15vw,132px);height:auto;}
  .mascot.sway{animation:sway 2.4s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}

  .btn{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.2vw,28px);
       border:3px solid var(--line);background:var(--pink);color:var(--ink);border-radius:24px;
       padding:7px 30px 11px;cursor:pointer;box-shadow:0 8px 20px var(--sh2);
       transition:transform .1s ease, box-shadow .1s ease;}
  .btn.ghost{background:var(--cream);}
  .btn.small{font-size:19px;padding:4px 18px 8px;box-shadow:0 6px 16px var(--sh2);}
  .btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px var(--sh2);}
  .btn:active{transform:translateY(1px);box-shadow:0 2px 6px var(--sh);}
  :is(.btn,.card,.chip):focus-visible{outline:3px solid var(--pink);outline-offset:3px;}

  .picks{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;}
  .pick{font-family:var(--body);border:3px solid var(--line);background:var(--cream);color:var(--ink);
        border-radius:22px;padding:5px 16px 7px;cursor:pointer;display:flex;flex-direction:column;
        align-items:flex-start;gap:0;min-width:116px;transition:transform .12s ease;}
  .pick:hover{transform:translateY(-2px) rotate(-.7deg);}
  .pick .lb{font-size:11.5px;color:var(--ink-soft);letter-spacing:1px;}
  .pick .vl{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.05;}
  .tagline{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

  .wallet{display:flex;align-items:center;justify-content:center;gap:7px;margin:0;font-size:13px;
          color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .wallet b{font-family:var(--display);font-size:20px;color:var(--ink);}
  .wallet span{border-left:2px solid #EFE4D8;padding-left:8px;}
  .cv{width:17px;height:17px;flex:none;}
  .reward{display:flex;align-items:center;justify-content:center;gap:5px;margin:6px 0 0;
          font-size:13px;color:var(--ink-soft);}
  .reward b{font-family:var(--display);font-size:19px;color:var(--clover);
            -webkit-text-stroke:0;}

  /* 도감 */
  .dex{width:100%;display:flex;flex-direction:column;gap:12px;}
  .dexrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;}
  .dcard{position:relative;border:3px solid var(--line);border-radius:22px;background:var(--cream);
         padding:16px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
         cursor:pointer;overflow:hidden;font-family:var(--body);
         transition:transform .12s ease, box-shadow .12s ease;}
  .dcard .art{height:62px;display:flex;align-items:flex-end;justify-content:center;}
  .dcard img{height:60px;width:auto;}
  .dcard .nm{font-family:var(--display);font-weight:700;font-size:14.5px;line-height:1.1;
             word-break:keep-all;text-align:center;}
  .dcard .meta{font-size:10px;color:var(--ink-soft);line-height:1.3;text-align:center;
               word-break:keep-all;max-height:2.7em;overflow:hidden;}
  .dcard .stars{position:absolute;top:3px;left:8px;font-size:11px;letter-spacing:-1px;color:#B0913F;}
  .dcard:hover{transform:translateY(-3px) rotate(-.8deg);}
  .dcard.sel{box-shadow:0 0 0 3px var(--clover) inset;}
  .dcard.r-base{background:linear-gradient(#FFFCF8,#F8F1E9);}
  .dcard.r-N{background:linear-gradient(#FFFCF8,#EEF5EA);}
  .dcard.r-R{background:linear-gradient(#FFFCF8,#E9F3F8);}
  .dcard.r-SR{background:linear-gradient(#FFFCF8,#FBE7EC);}
  .dcard.r-SSR{background:linear-gradient(#FFFCF8,#EDE6FA);}
  .dcard.locked img{filter:brightness(0);opacity:.2;}
  .dcard.locked .nm{color:var(--ink-soft);}
  .dcard.soon{border-style:dashed;opacity:.6;cursor:default;}
  .dcard.soon .art b{font-family:var(--display);font-size:26px;color:var(--ink-soft);line-height:62px;}
  .newbadge{position:absolute;top:3px;right:-20px;transform:rotate(28deg);background:var(--pink);
            border:3px solid var(--line);font-family:var(--display);font-weight:700;font-size:10px;
            padding:0 22px 1px;}
  .shake{animation:shake .32s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* 노래 목록 */
  .songlist{width:100%;display:flex;flex-direction:column;gap:9px;}
  .songrow{display:flex;align-items:center;gap:11px;border:3px solid var(--line);border-radius:24px;
           background:var(--cream);padding:8px 11px;transition:transform .12s ease,background .12s ease;}
  .songrow.on{background:var(--wool);box-shadow:0 8px 20px var(--sh2);transform:translate(-1px,-2px);}
  .songrow .cover{flex:none;width:62px;height:62px;border:3px solid var(--line);border-radius:19px;
                  overflow:hidden;cursor:pointer;display:block;}
  .songrow .cover svg{width:100%;height:100%;display:block;}
  .sinfo{display:flex;flex-direction:column;gap:1px;flex:1 1 auto;min-width:0;cursor:pointer;text-align:left;}
  .stitle{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.05;word-break:keep-all;}
  .smeta{font-size:11.5px;color:var(--ink-soft);}
  .sbest{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .levels{display:grid;grid-template-columns:repeat(2,minmax(58px,1fr));gap:4px;flex:none;}
  .lv{border:3px solid var(--line);border-radius:16px;background:var(--cream);cursor:pointer;
      padding:1px 6px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.05;
      font-family:var(--body);}
  .lv b{font-family:var(--display);font-size:13px;}
  .lv span{font-size:9.5px;color:var(--ink-soft);}
  .lv[data-d="easy"][aria-pressed="true"]{background:#E6F0E2;}
  .lv[data-d="normal"][aria-pressed="true"]{background:#9CCADF;}
  .lv[data-d="hard"][aria-pressed="true"]{background:#DCC7A9;}
  .lv[data-d="nightmare"][aria-pressed="true"]{background:#AD9ED4;}
  #goBtn{margin-top:4px;}
  @media (max-width:560px){
    .songrow{flex-wrap:wrap;} .levels{grid-template-columns:repeat(4,1fr);width:100%;}
  }

  /* 캐릭터 상세 */
  .detail{width:100%;display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;}
  .detail .art{flex:1 1 200px;min-height:190px;border:3px solid var(--line);border-radius:26px;
               display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .detail .art img{height:78%;width:auto;position:relative;z-index:1;}
  .detail .art i{position:absolute;inset:-30%;background:
      repeating-conic-gradient(from 0deg, rgba(255,255,255,.55) 0deg 12deg, rgba(255,255,255,0) 12deg 24deg);
      animation:spinRay 26s linear infinite;}
  @keyframes spinRay{to{transform:rotate(360deg)}}
  .detail .info{flex:1 1 220px;display:flex;flex-direction:column;gap:7px;justify-content:center;}
  .detail .rk{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
              border:3px solid var(--line);border-radius:1005px;padding:1px 12px 3px;font-size:12px;}
  .detail .rk .stars{color:#B0913F;letter-spacing:-1px;}
  .detail h3{font-family:var(--display);font-weight:700;font-size:clamp(24px,4.4vw,34px);margin:0;line-height:1.05;}
  .detail .desc{font-size:13px;color:var(--ink-soft);line-height:1.65;}
  .detail .facts{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-soft);}
  .detail .facts span b{font-family:var(--display);font-size:14px;color:var(--ink);}
  .detail .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;}

  /* 뽑기 */
  .gacha{width:100%;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .gtop{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);}
  .gtop b{font-family:var(--display);font-size:22px;color:var(--ink);}
  .gstage{position:relative;overflow:hidden;width:100%;min-height:172px;border:3px dashed #EFE4D8;
          border-radius:24px;display:flex;align-items:center;justify-content:center;padding:10px;
          box-sizing:border-box;}
  .orbwrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .orb{width:84px;height:84px;border-radius:50%;border:3px solid var(--line);
       background:radial-gradient(circle at 34% 28%, #fff 8%, var(--oc,#E6F0E2) 78%);
       animation:orbShake .17s linear infinite, orbGrow .95s ease-in both;}
  .orb.r-R{--oc:#9CCADF;animation:orbShake .13s linear infinite, orbGrow .95s ease-in both;}
  .orb.r-SR{--oc:#F0AABA;animation:orbShake .09s linear infinite, orbGrow .95s ease-in both,
            orbGlow .42s ease-in-out infinite;}
  @keyframes orbShake{0%{transform:translate(-1.5px,1px) rotate(-1.5deg)}
                      50%{transform:translate(1.5px,-1px) rotate(1.5deg)}
                      100%{transform:translate(-1.5px,1px) rotate(-1.5deg)}}
  @keyframes orbGrow{0%{scale:.25;opacity:0}55%{scale:1.05;opacity:1}100%{scale:1.2}}
  @keyframes orbGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,179,193,0)}
                     50%{box-shadow:0 0 30px 12px rgba(255,179,193,.8)}}
  .orbtext{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink-soft);}
  .flash{position:absolute;inset:0;background:#fff;animation:flashOut .5s ease-out both;pointer-events:none;z-index:3;}
  .flash.sr{background:linear-gradient(120deg,#FBE7EC,#FFF6C9,#E9F3F8,#FBE7EC);}
  @keyframes flashOut{0%{opacity:.96}100%{opacity:0}}
  .gstage.hasbanner{padding-top:38px;}
  .banner{position:absolute;left:0;right:0;top:7px;text-align:center;font-family:var(--display);
          font-weight:700;font-size:23px;color:#D4708A;z-index:4;pointer-events:none;
          animation:bannerLife 2.6s both;}
  @keyframes bannerLife{0%{opacity:0;transform:translateY(-16px) scale(.7)}
                        18%{opacity:1;transform:translateY(0) scale(1.12)}
                        26%{transform:none}82%{opacity:1;transform:none}
                        100%{opacity:0;transform:translateY(-8px) scale(.9)}}
  .ring{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
        border:3px solid var(--rc,#9CCADF);animation:ringOut .8s ease-out both;pointer-events:none;}
  @keyframes ringOut{0%{transform:scale(.3);opacity:.95}100%{transform:scale(8);opacity:0}}
  .spark{position:absolute;left:50%;top:50%;width:8px;height:8px;background:#FFD36E;
         border:3px solid var(--line);border-radius:50%;animation:sparkOut .75s ease-out both;pointer-events:none;}
  @keyframes sparkOut{0%{transform:translate(0,0) scale(.3);opacity:1}
                      100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
  .shakeSheet{animation:sheetShake .45s;}
  @keyframes sheetShake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}
                        40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}
                        80%{transform:translate(3px,-1px)}}
  .gidle{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.8;text-align:center;}
  .gidle small{font-size:11px;}
  .gresult{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%;}
  .gcard{position:relative;border:3px solid var(--line);border-radius:20px;padding:13px 4px 6px;
         display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden;z-index:2;
         animation:popN .46s cubic-bezier(.2,1.5,.5,1) both;}
  .gcard.r-R{animation:flipR .66s cubic-bezier(.2,1.1,.4,1) both;}
  .gcard.r-SR{animation:slamSR .72s cubic-bezier(.15,1.35,.4,1) both;
              box-shadow:0 0 0 3px #F9DDE4, 0 0 20px 4px rgba(255,179,193,.8);}
  @keyframes popN{0%{opacity:0;transform:scale(.55) rotate(-9deg)}100%{opacity:1;transform:none}}
  @keyframes flipR{0%{opacity:0;transform:perspective(500px) rotateY(-180deg) scale(.7)}
                   55%{opacity:1}100%{opacity:1;transform:none}}
  @keyframes slamSR{0%{opacity:0;transform:scale(2.8) rotate(12deg)}
                    50%{opacity:1;transform:scale(.88) rotate(-4deg)}
                    75%{transform:scale(1.06) rotate(2deg)}100%{transform:none}}
  .gcard .art{height:48px;display:flex;align-items:flex-end;}
  .gcard img{height:46px;width:auto;}
  .gcard .nm{font-family:var(--display);font-weight:700;font-size:12.5px;line-height:1.05;
             text-align:center;word-break:keep-all;}
  .gcard .meta{font-size:9.5px;color:var(--ink-soft);}
  .gcard .meta.dup{color:var(--clover);}
  .gcard .stars{position:absolute;top:2px;left:6px;font-size:10px;letter-spacing:-1px;color:#B0913F;}
  .gcard.r-N{background:linear-gradient(#FFFCF8,#EEF5EA);}
  .gcard.r-R{background:linear-gradient(#FFFCF8,#E9F3F8);}
  .gcard.r-SR{background:linear-gradient(#FFFCF8,#FBE7EC);box-shadow:0 0 0 3px #F9DDE4;}
  .gcard.shine::after{content:"";position:absolute;inset:-40%;background:
    linear-gradient(115deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);
    animation:sweep 1.5s ease-in-out .3s 2;}
  @keyframes sweep{0%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
  .gbtns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;}
  @media (max-width:560px){ .gresult{grid-template-columns:repeat(3,1fr);} }
  @media (prefers-reduced-motion:reduce){ .gcard,.orb,.flash,.banner,.ring,.spark{animation:none!important}
    .gcard.shine::after{animation:none} .shakeSheet{animation:none} }

  .modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
         background:rgba(120,95,75,.38);padding:16px;box-sizing:border-box;}
  .modal[hidden]{display:none!important;}
  .sheet{background:var(--cream);border:3px solid var(--line);border-radius:28px;box-shadow:0 12px 28px var(--sh2);
         padding:14px 16px 16px;width:100%;max-width:640px;max-height:100%;overflow-y:auto;}
  .sheet.wide{max-width:780px;
         display:flex;flex-direction:column;gap:10px;align-items:center;}
  .sheet .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .sheet #modalBody{width:100%;}
  .rgroup{width:100%;display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
  .rlabel{font-family:var(--display);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;
          justify-content:center;}
  .rlabel i{width:11px;height:11px;border:3px solid var(--line);border-radius:50%;display:inline-block;}
  .rlabel span{font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--ink-soft);}
  .card{position:relative;}
  .card .rr{position:absolute;top:-9px;right:-6px;font-size:10px;border:3px solid var(--line);
            border-radius:1005px;padding:0 6px 1px;white-space:nowrap;}
  .card.soon{opacity:.55;cursor:default;border-style:dashed;justify-content:center;}
  .card.soon .q{font-family:var(--display);font-weight:700;font-size:26px;line-height:56px;color:var(--ink-soft);}
  .sheet .card{min-width:88px;padding:7px 7px 8px;}
  .sheet .card img{height:48px;}
  .sheet .card .nm{font-size:15px;}
  .sheet .card .meta{font-size:10.5px;}
  .sheet .card.song{min-width:150px;}
  .sheet .card.song .nm{font-size:18px;}
  .sect{width:100%;max-width:760px;display:flex;flex-direction:column;gap:7px;align-items:center;}
  .sect > .row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;width:100%;}

  .card{font-family:var(--body);border:3px solid var(--line);background:var(--cream);border-radius:22px;
        padding:7px 9px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
        min-width:98px;flex:0 1 auto;transition:transform .12s ease,background .12s ease;}
  .card:hover{transform:translateY(-3px) rotate(-.8deg);}
  .card[aria-pressed="true"]{background:var(--wool);box-shadow:0 6px 16px var(--sh2);}
  .card img{height:56px;width:auto;}
  .card .nm{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.1;}
  .card .meta{font-size:11.5px;color:var(--ink-soft);line-height:1.35;}
  .song{min-width:150px;align-items:flex-start;text-align:left;gap:1px;}
  .song .nm{font-size:19px;}
  .song .best{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

  .chip{font-family:var(--display);font-size:18px;font-weight:700;border:3px solid var(--line);
        background:var(--cream);color:var(--ink);border-radius:1005px;padding:3px 17px 6px;cursor:pointer;}
  .chip[aria-pressed="true"]{background:var(--clover);}
  .chip[data-d="hard"][aria-pressed="true"]{background:var(--poot);}
  .chip[data-d="nightmare"][aria-pressed="true"]{background:var(--grape);}

  .keys{font-size:13px;color:var(--ink-soft);line-height:1.8;}
  .kbd{font-family:var(--display);font-weight:700;border:3px solid var(--line);border-radius:7px;
       padding:0 8px 1px;background:var(--wool);}

  .panel{border:3px solid var(--line);border-radius:26px;background:var(--cream);padding:12px 18px 14px;
         min-width:min(330px,88%);}
  .grade{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,40px);line-height:1;margin:0;}
  .score{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1;
         margin:2px 0 8px;font-variant-numeric:tabular-nums;}
  .tally{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 18px;font-size:14px;}
  .tally div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;}
  .tally b{font-weight:400;color:var(--ink-soft);}
  .best{font-size:13px;color:var(--ink-soft);margin:8px 0 0;}
  #skipBtn{position:absolute;bottom:14px;right:14px;z-index:6;font-family:var(--display);font-weight:700;
           font-size:17px;border:3px solid var(--line);background:rgba(252,248,243,.9);border-radius:1005px;
           padding:3px 18px 5px;cursor:pointer;animation:skipIn .5s both .4s;}
  @keyframes skipIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
  #homeBar{position:absolute;top:10px;left:58px;right:12px;z-index:6;display:flex;align-items:center;
           gap:8px;flex-wrap:wrap;}
  #homeBar span{display:flex;align-items:center;gap:5px;background:rgba(252,248,243,.92);
                border:3px solid var(--line);border-radius:1005px;padding:2px 12px 4px;font-size:12.5px;
                color:var(--ink-soft);}
  #homeBar b{font-family:var(--display);font-size:18px;color:var(--ink);}
  #homeBar button{margin-left:auto;font-family:var(--display);font-weight:700;font-size:15px;
                  border:3px solid var(--line);background:var(--cream);border-radius:1005px;
                  padding:2px 14px 4px;cursor:pointer;}
  #homeBar #homeSongBtn{margin-left:auto;background:var(--pink);}
  #homeBar #homeTitleBtn{margin-left:0;}
  #countdown{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
             background:rgba(252,248,243,.55);pointer-events:none;}
  #countdown[hidden]{display:none!important;}
  #cdNum{font-family:var(--display);font-weight:700;font-size:clamp(64px,16vw,140px);color:var(--ink);
         animation:cdPop .45s ease-out;}
  @keyframes cdPop{0%{transform:scale(1.9);opacity:0}45%{opacity:1}100%{transform:scale(1);opacity:1}}

  #toast{position:absolute;left:50%;top:52px;transform:translateX(-50%);z-index:40;
         background:var(--cream);border:3px solid var(--line);border-radius:24px;
         box-shadow:0 8px 20px var(--sh2);padding:9px 18px 11px;text-align:center;
         animation:toastIn .45s cubic-bezier(.2,1.4,.5,1) both;max-width:88%;}
  #toast[hidden]{display:none!important;}
  #toast h4{font-family:var(--display);font-weight:700;font-size:19px;margin:0 0 2px;}
  #toast p{margin:1px 0;font-size:12.5px;color:var(--ink-soft);}
  @keyframes toastIn{0%{opacity:0;transform:translate(-50%,-14px) scale(.85)}
                     100%{opacity:1;transform:translate(-50%,0) scale(1)}}

  /* 설정 */
  .setlist{width:100%;display:flex;flex-direction:column;gap:12px;}
  .setgroup{border:3px solid var(--line);border-radius:24px;background:var(--cream);
            padding:8px 14px 12px;display:flex;flex-direction:column;gap:9px;}
  .setgroup > h5{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:2px;
                 color:var(--ink-soft);margin:0;text-transform:none;}
  .setrow{display:flex;flex-direction:column;gap:3px;padding-top:7px;border-top:3px dashed #EFE4D8;}
  .setgroup > .setrow:first-of-type{border-top:0;padding-top:0;}
  .setrow > .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .setrow .lbl b{font-family:var(--display);font-weight:700;font-size:16px;}
  .setrow .lbl span{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .setrow .hint{font-size:10.5px;color:var(--ink-soft);line-height:1.45;opacity:.9;}
  .keyrow{display:flex;gap:7px;flex-wrap:wrap;}
  .keybtn{flex:1 1 0;min-width:52px;border:3px solid var(--line);border-radius:17px;background:var(--wool);
          font-family:var(--display);font-weight:700;font-size:19px;padding:2px 0 4px;cursor:pointer;}
  .keybtn.wait{background:var(--pink);animation:tapBlink .8s ease-in-out infinite;}
  .keybtn small{display:block;font-family:var(--body);font-weight:400;font-size:10px;color:var(--ink-soft);}
  input[type=range]{width:100%;accent-color:var(--clover);height:20px;margin:0;}
  .skinrow{display:flex;gap:7px;flex-wrap:wrap;}
  .skinbtn{border:3px solid var(--line);border-radius:18px;background:var(--cream);cursor:pointer;
           padding:4px 10px 6px;font-family:var(--body);display:flex;flex-direction:column;gap:3px;align-items:center;}
  .skinbtn[aria-pressed="true"]{background:var(--wool);box-shadow:0 6px 16px var(--sh2);}
  .skinbtn[disabled]{opacity:.45;cursor:default;}
  .skinbtn .nm{font-family:var(--display);font-weight:700;font-size:14px;}
  .swatch{display:flex;gap:3px;}
  .swatch i{width:13px;height:13px;border:3px solid var(--line);border-radius:4px;display:block;}
  .skinbtn small{font-size:9.5px;color:var(--ink-soft);}

  /* 도감 진행 */
  .dexbar{width:100%;display:flex;flex-direction:column;gap:4px;margin-bottom:2px;}
  .dexbar .track{height:14px;border:3px solid var(--line);border-radius:1005px;background:var(--cream);overflow:hidden;}
  .dexbar .fill{height:100%;background:var(--clover);}
  .dexbar .cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);}
  .dexbar .cap b{font-family:var(--display);font-size:15px;color:var(--ink);}

  #tapHint{position:absolute;bottom:20px;left:0;right:0;text-align:center;margin:0;z-index:6;
           font-size:12.5px;color:var(--ink-soft);pointer-events:none;animation:tapBlink 1.6s ease-in-out infinite;}
  @keyframes tapBlink{0%,100%{opacity:.35}50%{opacity:.95}}
  #fsBtn{position:absolute;top:10px;left:12px;z-index:6;font-size:15px;line-height:1;
         border:3px solid var(--line);background:rgba(252,248,243,.8);border-radius:18px;
         padding:4px 9px 5px;cursor:pointer;opacity:.5;transition:opacity .15s ease;}
  #fsBtn:hover{opacity:1;}
  body.fs #fsBtn{opacity:.25;}
  #pauseBtn{position:absolute;top:10px;right:12px;font-family:var(--display);font-weight:700;font-size:16px;
            border:3px solid var(--line);background:rgba(252,248,243,.85);border-radius:18px;padding:2px 12px 4px;
            cursor:pointer;}
  .credit{font-size:11px;color:var(--ink-soft);margin:0;max-width:520px;line-height:1.6;opacity:.85;}
  @media (prefers-reduced-motion:reduce){.mascot.sway{animation:none}}

  /* 무대가 낮아지면 타이틀 요소를 단계적으로 줄인다 */
  @container (max-height:430px){
    .screen{gap:7px;padding:10px 14px;}
    .mascot{width:clamp(48px,14cqh,74px);}
    h1{font-size:clamp(22px,8.5cqh,34px);}
    h1 .sub{font-size:.28em;margin-top:4px;}
    .keys{display:none;}
    .pick{padding:3px 12px 5px;min-width:96px;}
    .pick .vl{font-size:17px;}
    .btn{font-size:20px;padding:5px 22px 8px;}
  }
  @container (max-height:320px){
    .mascot{display:none;}
    h1 .sub{display:none;}
    .tagline{display:none;}
    h1{font-size:clamp(20px,9cqh,28px);}
  }

/* ══════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════ */

body{background:var(--ground);}

  o.step = 60/o.bpm/ (o.spb===6 ? 1 : 2) / (o.spb===6 ? 2 : 1);
  o.beat = 60/o.bpm;
  o.step = o.beat/2;                    // 8분음표 한 칸 (왈츠도 동일)
  o.barDur = o.step*o.spb;
  o.end = o.bars.length*o.barDur;
  return o;
}

const LOVE_NEED = [0, 40, 100, 190, 320, 500, 740, 1050, 1450, 1950];   // Lv1~10
const LOVE_MAX = LOVE_NEED.length;
function loveLv(v){ let l = 1; LOVE_NEED.forEach((n, i) => { if(v >= n) l = i + 1; }); return l; }
function loveProg(v){
  const l = loveLv(v);
  if(l >= LOVE_MAX) return 1;
  const a = LOVE_NEED[l - 1], b = LOVE_NEED[l];
  return (v - a) / (b - a);
}
function loveNext(v){ const l = loveLv(v); return l >= LOVE_MAX ? 0 : LOVE_NEED[l] - v; }

"use strict";
/* 채보 생성 — 꺅두기 하우스 */

/* ===== 채보 만들기 ===== */
function buildChart(song, diffId){
  const S = song.spb, STEP = song.step;
  const on = [];                                  // 멜로디 온셋 펼치기
  song.bars.forEach((bar,bi)=>{
    if(!bar || bi>=song.bars.length-2) return;
    bar.forEach(([st,name,len,tag])=>on.push({bi,st,name,len,tag,m:midi(name)}));
  });
  let picked;
  const major = S===6 ? 3 : 4;                     // 큰 박자 간격
  if(diffId==='easy')      picked = on.filter(o=>o.st%major===0);
  else                     picked = on.slice();

  if(diffId==='hard' || diffId==='nightmare'){     // 엇박 채우기
    const extra=[];
    for(let i=0;i<picked.length;i++){
      const a=picked[i], b=picked[i+1];
      const aPos=a.bi*S+a.st, bPos=b?b.bi*S+b.st:aPos+2;
      if(bPos-aPos>=2 && a.len<3) extra.push({bi:a.bi, st:a.st+1, name:a.name, len:1, fill:true, m:a.m});
    }
    picked = picked.concat(extra);
  }
  if(diffId==='nightmare'){                        // 남은 칸까지 전부
    const has = new Set(picked.map(o=>o.bi*S+o.st));
    const full=[];
    song.bars.forEach((bar,bi)=>{
      if(!bar || bi>=song.bars.length-2) return;
      const stride = song.step<0.22 ? 2 : 1;      // 빠른 곡은 한 칸 걸러
      for(let st=0; st<S; st+=stride){
        if(has.has(bi*S+st)) continue;
        const near = picked.filter(o=>o.bi===bi).sort((x,y)=>Math.abs(x.st-st)-Math.abs(y.st-st))[0];
        full.push({bi, st, name:near?near.name:'C5', len:1, fill:true, m:near?near.m:72});
      }
    });
    picked = picked.concat(full);
  }
  picked.sort((a,b)=>(a.bi*S+a.st)-(b.bi*S+b.st));

  // 음 높이로 레인(A·S·K·L) 배정 — 낮은 음이 왼쪽
  const ms=picked.map(o=>o.m), lo=Math.min(...ms), hi=Math.max(...ms), span=Math.max(1,hi-lo);
  const notes=[];
  let lastLane=-1, rep=0;
  const busy=[0,0,0,0];            // 그 줄의 롱노트가 끝나는 시각
  const lastAt=[-9,-9,-9,-9];      // 그 줄에서 마지막으로 친 시각
  const MINGAP=Math.max(0.085, STEP*0.9);

  picked.forEach(o=>{
    let type = o.len>=3 ? 'hold' : 'tap';
    if(diffId==='easy' && type==='hold' && o.len<4) type='tap';
    const t = o.bi*song.barDur + o.st*STEP;
    const dur = type==='hold' ? o.len*STEP*0.9 : 0;

    let want=Math.min(3, Math.floor((o.m-lo)/span*4));
    if(want===lastLane){ rep++; if(rep>=3){ want=(want+1)%4; rep=0; } } else rep=0;

    // 잡고 있는 줄이나 방금 친 줄은 피한다 (롱노트 한가운데 일반 노트가 겹치던 문제)
    const free = l => t >= busy[l]-0.02 && t-lastAt[l] >= MINGAP-1e-6;
    let lane = -1;
    if(free(want)) lane = want;
    else {
      for(let d=1; d<4 && lane<0; d++){
        for(const cand of [want-d, want+d]){
          if(cand>=0 && cand<4 && free(cand)){ lane=cand; break; }
        }
      }
    }
    if(lane<0) return;             // 네 줄이 다 막혔으면 이 노트는 버린다

    lastLane=lane; lastAt[lane]=t;
    if(type==='hold') busy[lane]=t+dur+0.06;

    notes.push({ t, lane, type, dur,
                 judged:false, holding:false, done:false, verdict:null, seed:Math.random()*6.28 });
  });
  return notes;
}

/* 소리 — 꺅두기 하우스 */

/* ===== 소리 ===== */
let ctx=null, master=null, musicGain=null, sfxGain=null, noiseBuf=null;
function initAudio(){
  if(ctx) return;
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
  musicGain = ctx.createGain(); musicGain.gain.value=0.5; musicGain.connect(master);
  sfxGain   = ctx.createGain(); sfxGain.gain.value=1.0;   sfxGain.connect(master);
  applyVolumes();
}
/* 설정의 볼륨을 실제 믹서에 반영 */
function applyVolumes(){
  if(!ctx) return;
  musicGain.gain.value = 0.5*settings.volMusic;
  sfxGain.gain.value   = 1.0*settings.volSfx;
  if(BGM.on && BGM.gain) BGM.gain.gain.setTargetAtTime(0.5*settings.volBgm, ctx.currentTime, 0.1);
}
function tone(time, freq, dur, o){
  const osc=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
  osc.type=o.type||'square'; osc.frequency.value=freq; if(o.detune) osc.detune.value=o.detune;
  f.type='lowpass'; f.frequency.value=o.cut||2600; f.Q.value=.6;
  const peak=o.gain||0.16;
  g.gain.setValueAtTime(0.0001,time);
  g.gain.exponentialRampToValueAtTime(peak,time+0.012);
  g.gain.exponentialRampToValueAtTime(peak*0.5,time+Math.min(0.13,dur*0.5));
  g.gain.exponentialRampToValueAtTime(0.0001,time+dur);
  osc.connect(f); f.connect(g); g.connect(musicGain);
  osc.start(time); osc.stop(time+dur+0.05);
}
function noise(){
  if(!noiseBuf){ noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.3,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  return noiseBuf;
}
function kick(t){ const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(48,t+0.13);
  g.gain.setValueAtTime(0.45,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.25); }
function hat(t,loud){ const s=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();
  s.buffer=noise(); f.type='highpass'; f.frequency.value=7200;
  g.gain.setValueAtTime(loud?0.09:0.04,t); g.gain.exponentialRampToValueAtTime(0.0001,t+(loud?0.07:0.04));
  s.connect(f); f.connect(g); g.connect(musicGain); s.start(t); s.stop(t+0.1); }
function clap(t){ const s=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();
  s.buffer=noise(); f.type='bandpass'; f.frequency.value=1700; f.Q.value=1.1;
  g.gain.setValueAtTime(0.16,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
  s.connect(f); f.connect(g); g.connect(musicGain); s.start(t); s.stop(t+0.2); }
/* 타격음 — 나무 타악기처럼 짧고 동그랗게. 레인마다 음이 다르다 */
const LANE_HZ=[523.25, 659.25, 783.99, 1046.50];   // 도 미 솔 높은도
function hitSound(lane, v){
  if(!ctx) return;
  const t=ctx.currentTime, base=LANE_HZ[lane]||523;
  const vol = v==='perfect'?0.17 : v==='great'?0.13 : 0.085;
  const cut = v==='perfect'?5600 : v==='great'?3200 : 1700;
  const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
  o.type='sine'; o.frequency.setValueAtTime(base,t);
  o.frequency.exponentialRampToValueAtTime(base*0.985,t+0.14);
  f.type='lowpass'; f.frequency.value=cut;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.19);
  o.connect(f); f.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.22);
  const o2=ctx.createOscillator(), g2=ctx.createGain();      // 배음
  o2.type='triangle'; o2.frequency.setValueAtTime(base*2.01,t);
  g2.gain.setValueAtTime(vol*0.35,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.10);
  o2.connect(g2); g2.connect(sfxGain); o2.start(t); o2.stop(t+0.12);
  if(v!=='good'){                                            // 톡 하는 어택
    const s=ctx.createBufferSource(), gn=ctx.createGain(), fn=ctx.createBiquadFilter();
    s.buffer=noise(); fn.type='highpass'; fn.frequency.value=v==='perfect'?4200:2800;
    gn.gain.setValueAtTime(vol*0.45,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+0.028);
    s.connect(fn); fn.connect(gn); gn.connect(sfxGain); s.start(t); s.stop(t+0.05);
  }
}
function missSound(){
  if(!ctx) return;
  const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
  o.type='triangle'; o.frequency.setValueAtTime(190,t); o.frequency.exponentialRampToValueAtTime(95,t+0.18);
  f.type='lowpass'; f.frequency.value=900;
  g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
  o.connect(f); f.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.26);
}

  f.type='lowpass'; f.frequency.value=4200;

/* 배경음 — 타이틀·집·결과 화면에서 잔잔하게 도는 8마디 루프 */
const BGM={on:false, gain:null, next:0, bar:0, timer:null};
const BGM_CH=[['C3','E3','G3','B3'],['A2','C3','E3','G3'],['F2','A2','C3','E3'],['G2','B2','D3','F3']];
const BGM_MEL=['E5','D5','C5','G4','A4','C5','D5','E5'];
function bgmTone(t,f,dur,vol,type,cut){
  const o=ctx.createOscillator(), g=ctx.createGain(), bf=ctx.createBiquadFilter();
  o.type=type; o.frequency.value=f; bf.type='lowpass'; bf.frequency.value=cut;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+dur*0.18);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(bf); bf.connect(g); g.connect(BGM.gain);
  o.start(t); o.stop(t+dur+0.05);
}
function bgmStart(){
  if(!ctx || BGM.on) return;
  BGM.gain=ctx.createGain(); BGM.gain.gain.value=0.0001; BGM.gain.connect(master);
  BGM.gain.gain.setTargetAtTime(0.5*settings.volBgm, ctx.currentTime, 0.6);
  BGM.on=true; BGM.next=ctx.currentTime+0.15; BGM.bar=0;
  BGM.timer=setInterval(bgmTick,150); bgmTick();
}
function bgmStop(){
  if(!BGM.on) return;
  clearInterval(BGM.timer); BGM.on=false;
  const g0=BGM.gain;
  try{ g0.gain.cancelScheduledValues(ctx.currentTime);
       g0.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.25); }catch(e){}
  setTimeout(()=>{ try{ g0.disconnect(); }catch(e){} }, 1200);
}
function bgmTick(){
  if(!BGM.on) return;
  const beat=60/84, bar=beat*4;
  while(BGM.next < ctx.currentTime+0.8){
    const t=BGM.next, ch=BGM_CH[BGM.bar%4];
    ch.forEach(n=> bgmTone(t, hz(n), bar*0.96, 0.05, 'triangle', 800));      // 패드
    for(let i=0;i<4;i++)                                                      // 아르페지오
      bgmTone(t+i*beat, hz(ch[(i+2)%4])*2, beat*0.55, 0.035, 'sine', 2600);
    if(BGM.bar%2===0)                                                         // 멜로디 한 음
      bgmTone(t+beat*2.5, hz(BGM_MEL[BGM.bar%8]), beat*1.1, 0.045, 'triangle', 2000);
    BGM.next+=bar; BGM.bar++;
  }
}

function blip(freq,vol){ if(!ctx) return;
  const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(freq,t); o.frequency.exponentialRampToValueAtTime(freq*1.6,t+0.05);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
  o.connect(g); g.connect(sfxGain||master); o.start(t); o.stop(t+0.14); }

function sweepUp(dur, rank){            // 뽑기 전 긴장감 — 올라가는 소리
  if(!ctx) return;
  const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
  o.type = rank==='SR' ? 'sawtooth' : 'triangle';
  o.frequency.setValueAtTime(180,t);
  o.frequency.exponentialRampToValueAtTime(rank==='SR'?1500:rank==='R'?900:620, t+dur);
  f.type='lowpass'; f.frequency.setValueAtTime(700,t); f.frequency.exponentialRampToValueAtTime(5000,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+dur*0.8);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.12);
  o.connect(f); f.connect(g); g.connect(sfxGain||master); o.start(t); o.stop(t+dur+0.2);
  if(rank!=='N'){                        // 심장 두근거림
    for(let i=0;i<4;i++){ const k=ctx.createOscillator(), kg=ctx.createGain(), tt=t+i*(dur/4);
      k.type='sine'; k.frequency.setValueAtTime(90,tt); k.frequency.exponentialRampToValueAtTime(45,tt+0.12);
      kg.gain.setValueAtTime(0.3,tt); kg.gain.exponentialRampToValueAtTime(0.0001,tt+0.18);
      k.connect(kg); kg.connect(sfxGain||master); k.start(tt); k.stop(tt+0.2); }
  }
}
function arp(freqs, gap, vol, type){    // 등급별 팡파르
  if(!ctx) return;
  const t0=ctx.currentTime;
  freqs.forEach((f,i)=>{
    const o=ctx.createOscillator(), g=ctx.createGain(), t=t0+i*gap;
    o.type=type||'triangle'; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.26);
    o.connect(g); g.connect(sfxGain||master); o.start(t); o.stop(t+0.3);
  });
}
function shimmer(){                      // 아주 귀함 반짝임
  if(!ctx) return;
  const t=ctx.currentTime, s=ctx.createBufferSource(), g=ctx.createGain(), f=ctx.createBiquadFilter();
  s.buffer=noise(); f.type='bandpass'; f.frequency.setValueAtTime(3000,t);
  f.frequency.exponentialRampToValueAtTime(9000,t+0.5); f.Q.value=2.2;
  g.gain.setValueAtTime(0.14,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
  s.connect(f); f.connect(g); g.connect(sfxGain||master); s.start(t); s.stop(t+0.65);
}

function buildEvents(song){
  const ev=[], S=song.spb, STEP=song.step;
  song.bars.forEach((bar,bi)=>{
    const base=bi*song.barDur, chord=CH[song.chords[bi]]||CH.C;
    for(let s=0;s<S;s++){
      const t=base+s*STEP;
      if(song.kick.includes(s)) ev.push({t,f:()=>kick(at(t))});
      if(song.clap.includes(s)) ev.push({t,f:()=>clap(at(t))});
      if(song.hat.includes(s))  ev.push({t,f:()=>hat(at(t), s%2===0)});
    }
    const bassSteps = S===6 ? [[0,0,1.2],[2,1,.6],[4,2,.6]] : [[0,0,1],[2,2,.5],[4,0,1],[6,1,.5]];
    bassSteps.forEach(([s,ci,mul])=>{
      const t=base+s*STEP;
      ev.push({t,f:()=>tone(at(t), hz(chord[ci]), song.beat*0.85*mul, {type:'triangle',gain:.2,cut:900})});
    });
    if(!bar) return;
    bar.forEach(([st,name,len])=>{
      const t=base+st*STEP, d=len*STEP*0.92;
      ev.push({t,f:()=>{ tone(at(t),hz(name),d,{type:song.wave,gain:.15,cut:song.cut});
                         tone(at(t),hz(name)*2.003,d*0.6,{type:'square',gain:.04,cut:4200,detune:6}); }});
    });
  });
  ev.sort((a,b)=>a.t-b.t);
  return ev;
}
let songStart=0;
function at(t){ return songStart+t; }
/* 스피커로 소리가 나오기까지 걸리는 지연까지 빼야 손과 귀가 맞는다 */
function nowT(){ return ctx ? ctx.currentTime-songStart-audioLat() + settings.offset/1000 : 0; }

/* 곡 카드 미리듣기 */
let previewUntil=0;
function preview(song){
  initAudio(); if(ctx.state==='suspended') ctx.resume();
  const t0=ctx.currentTime+0.06;
  if(t0 < previewUntil) return;
  let dur=0;
  song.bars.slice(2,4).forEach((bar,i)=>{
    if(!bar) return;
    const base=i*song.barDur;
    bar.forEach(([st,name,len])=>{
      const t=t0+base+st*song.step;
      tone(t,hz(name),len*song.step*0.9,{type:song.wave,gain:.14,cut:song.cut});
      dur=Math.max(dur,base+st*song.step+0.4);
    });
    song.kick.forEach(s=>kick(t0+base+s*song.step));
  });
  previewUntil=t0+dur;
}

function sfxCare(kind){

    feed:[[523,0],[659,0.08],[784,0.16]],

function sfxCoin(n){

    gn.gain.exponentialRampToValueAtTime(0.0001,t+i*0.06+0.25);
    o.connect(gn); gn.connect(sfxGain); o.start(t+i*0.06); o.stop(t+i*0.06+0.3);
  }
}

function lerpTheme(T,k){
  const a=T.a,b=T.b,o={};
  ['sky1','sky2','far','near','ground','ink','grass','orbC'].forEach(key=>o[key]=mix(a[key],b[key],k));
  o.orb=k<0.5?a.orb:b.orb; o.star=a.star+(b.star-a.star)*k;

function spawnParticles(dt,th){

  if(REDUCED) rate*=0.3;
  if(parts.length>240) return;
  let n=rate*dt; n = Math.floor(n) + (Math.random() < (n%1) ? 1 : 0);
  for(let i=0;i<n;i++){
    if(kind==='rain') parts.push({k:kind,x:Math.random()*W*1.2,y:-10,vx:-150,vy:760,life:1,c:col});
    else if(kind==='dust') parts.push({k:kind,x:W+10,y:groundY()-Math.random()*26,vx:-240-Math.random()*120,vy:-6-Math.random()*20,r:2+Math.random()*4,life:1,c:col});
    else if(kind==='sparkle') parts.push({k:kind,x:Math.random()*W,y:Math.random()*groundY()*0.9,vx:-14,vy:8,r:1.5+Math.random()*2,life:1,c:col});
    else parts.push({k:'petal',x:W+10,y:Math.random()*H*0.45,vx:-58-Math.random()*45,vy:18+Math.random()*26,r:3.5+Math.random()*2.5,life:1,ph:Math.random()*6.3,c:col});
  }
}
function drawParticles(dt){
  for(const p of parts){
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.k==='petal') p.x+=Math.sin((p.ph+=dt*2.4))*22*dt;
    if(p.k==='dust') p.life-=dt*1.1;
    else if(p.k==='sparkle') p.life-=dt*0.5;
    else if(p.k==='petal') p.life-=dt*0.09;
  }
  parts=parts.filter(p=>p.life>0 && p.y<H+20 && p.x>-30);
  for(const p of parts){
    g.globalAlpha=Math.max(0,Math.min(1,p.life))*(p.k==='sparkle'?0.5+0.5*Math.sin(performance.now()/300+p.x):1);
    if(p.k==='rain'){ g.strokeStyle=p.c; g.lineWidth=LW()*0.55; g.beginPath(); g.moveTo(p.x,p.y); g.lineTo(p.x-4,p.y+12); g.stroke(); }
    else { g.fillStyle=p.c; g.beginPath(); g.ellipse(p.x,p.y,p.r*(p.k==='petal'?1.5:1),p.r,p.k==='petal'?0.6:0,0,6.3); g.fill(); }
  }
  g.globalAlpha=1;
}
function spawnFlyer(){
  const k=THEMES[song.theme].flyer;
  if(k==='bird')   flyers.push({k, x:W+40, y:H*(0.12+Math.random()*0.18), vx:-110, ph:0});
  if(k==='shoot')  flyers.push({k, x:W*0.8, y:H*0.1, vx:-420, vy:180, life:1});
  if(k==='tumble') flyers.push({k, x:W+30, y:groundY()-12, vx:-230, rot:0});
}
function drawFlyers(dt,th){
  for(const f of flyers){
    f.x+=f.vx*dt; if(f.vy) f.y+=f.vy*dt; f.ph=(f.ph||0)+dt*8; if(f.k==='tumble') f.rot+=dt*7;
    g.strokeStyle=th.ink; g.lineWidth=LW()*0.7; g.lineCap='round';
    if(f.k==='bird'){
      for(let i=0;i<3;i++){
        const bx=f.x+i*26, by=f.y+Math.sin(f.ph+i)*5+(i%2)*12, w=7+Math.sin(f.ph+i)*3;
        g.beginPath(); g.moveTo(bx-9,by); g.quadraticCurveTo(bx-4,by-w,bx,by);
        g.quadraticCurveTo(bx+4,by-w,bx+9,by); g.stroke();
      }
    } else if(f.k==='shoot'){
      f.life-=dt*0.7; g.globalAlpha=Math.max(0,f.life); g.strokeStyle='#FFF3C4'; g.lineWidth=LW();
      g.beginPath(); g.moveTo(f.x,f.y); g.lineTo(f.x+46,f.y-20); g.stroke(); g.globalAlpha=1;
    } else {
      g.save(); g.translate(f.x,f.y); g.rotate(f.rot); g.strokeStyle='#B99A6B';
      g.beginPath(); g.arc(0,0,11,0,6.3); g.stroke();
      g.beginPath(); g.moveTo(-11,0); g.lineTo(11,0); g.moveTo(0,-11); g.lineTo(0,11); g.stroke(); g.restore();
    }
  }
  flyers=flyers.filter(f=>f.x>-140 && (f.life===undefined||f.life>0));
}

/* ===== 풍경 ===== */
function scene(t,th,prog){
  const gy=groundY();
  const grd=g.createLinearGradient(0,0,0,gy);
  grd.addColorStop(0,th.sky1); grd.addColorStop(1,th.sky2);
  g.fillStyle=grd; g.fillRect(0,0,W,gy);

  if(th.star>0.01){
    g.fillStyle='#FFF8F0';
    for(const s of stars){
      g.globalAlpha=th.star*(0.45+0.55*Math.abs(Math.sin(t*1.2+s.p)));
      g.beginPath(); g.arc(s.x*W,s.y*H,s.r,0,6.3); g.fill();
    }
    g.globalAlpha=1;
  }
  if(th.orb){
    const ox=W*(0.14+0.7*prog), oy=gy-H*(0.24+0.36*Math.sin(Math.PI*Math.min(1,prog+0.12)));
    g.fillStyle=th.orbC; g.globalAlpha=.95;
    if(th.orb==='moon'){
      g.beginPath(); g.arc(ox,oy,20,0,6.3); g.fill();
      g.globalAlpha=1; g.fillStyle=th.sky1;
      g.beginPath(); g.arc(ox+9,oy-6,17,0,6.3); g.fill();
    } else { g.beginPath(); g.arc(ox,oy,24,0,6.3); g.fill(); }
    g.globalAlpha=1;
  }
  // 먼 언덕 두 겹
  const hw=W*0.62, o1=(t*9)%hw;
  g.fillStyle=th.far;
  for(let i=-1;i<3;i++){ const x=i*hw-o1;
    g.beginPath(); g.moveTo(x,gy); g.quadraticCurveTo(x+hw*0.5,gy-H*0.30,x+hw,gy); g.closePath(); g.fill(); }
  const hw2=W*0.46, o2=(t*22)%hw2;
  g.fillStyle=th.near;
  for(let i=-1;i<4;i++){ const x=i*hw2-o2;
    g.beginPath(); g.moveTo(x,gy); g.quadraticCurveTo(x+hw2*0.5,gy-H*0.17,x+hw2,gy); g.closePath(); g.fill(); }
  // 중간 덤불
  g.fillStyle=th.far;
  for(const b of bushes){
    b.x-=0; const bx=((b.x-t*60)%(W+300)+W+300)%(W+300)-150;
    g.beginPath(); g.ellipse(bx,gy-6,26*b.s,14*b.s,0,Math.PI,0); g.fill();
  }
  // 땅
  g.fillStyle=th.ground; g.fillRect(0,gy,W,H-gy);
  g.strokeStyle=th.ink; g.lineWidth=LW(); g.beginPath();
  for(let x=0;x<=W;x+=14) g.lineTo(x,gy+Math.sin((x+t*230)*0.03)*1.6);
  g.stroke();
  // 소품 (구간마다 종류가 바뀐다)
  const section=Math.max(0,Math.floor(t/(song.barDur*4)));
  for(const p of props){
    p.x-=0;
    let px=((p.x-t*230)%(W+420)+W+420)%(W+420)-120;
    if(px>W+60 || p.kind===null) p.kind=propKind(section);
    drawProp(p.kind,px,gy+2,p.s,th);
  }
}

  '<g fill="#8FBF92" stroke="#5A4A40" stroke-width="1.6">' +
  '<circle cx="10" cy="5.6" r="3.5"/><circle cx="14.4" cy="10" r="3.5"/>' +
  '<circle cx="10" cy="14.4" r="3.5"/><circle cx="5.6" cy="10" r="3.5"/></g>' +
  '<path d="M10 11 L10 19" stroke="#8FBF92" stroke-width="1.8" fill="none"/></svg>';
const STARS = { base:1, N:1, R:2, SR:3, SSR:4 };
const starRow = rk => '<span class="stars">' + '★'.repeat(STARS[rk]) + '</span>';
let freshIds = new Set();

/* ===== 뽑기 로직 ===== */
const PULL1 = 110, PULL10 = 1000;
const REFUND = { N:30, R:60, SR:120 };
const RATE = [['N', 65], ['R', 27], ['SR', 8]];
const POOL = rk => CHARS.filter(c => c.rank === rk);
function rollRank(force){
  if(force) return force;
  let r = Math.random() * 100;
  for(const [rk, p] of RATE){ if(r < p) return rk; r -= p; }
  return 'N';
}
function pull(n){
  const cost = n === 10 ? PULL10 : PULL1;
  if(S.clover < cost) return null;
  addClover(-cost);
  const got = [];
  for(let i = 0; i < n; i++){
    const force = (n === 10 && i === 9 && !got.some(x => x.rank !== 'N')) ? 'R' : null;
    let rk = rollRank(force);
    S.pity = rk === 'SR' ? 0 : S.pity + 1;
    if(S.pity >= 80){ rk = 'SR'; S.pity = 0; }
    const pool = POOL(rk), c = pool[Math.floor(Math.random() * pool.length)];
    const isNew = !owns(c.id);
    if(isNew){ S.own.push(c.id); freshIds.add(c.id); }
    else addClover(REFUND[rk] || 30);
    got.push({ c, rank: rk, isNew, refund: isNew ? 0 : (REFUND[rk] || 30) });
  }
  checkRewards(); save(); refreshBar();
  return got;
}

/* 작은 캔버스에 집 그리기 */
function drawHouseIcon(cvs, level){
  const c = cvs.getContext('2d'), sw = cvs.width, sh = cvs.height;
  const og = g, oW = W, oH = H;
  g = c; W = sw; H = sh;
  c.clearRect(0, 0, sw, sh);
  const h = HOUSES[level] || HOUSES[0];
  const bw = sw * (0.42 + level * 0.16), bh = sh * 0.52, bx = sw / 2 - bw / 2, by = sh * 0.9 - bh;
  ink(3);
  g.fillStyle = h.wall; rrect(bx, by, bw, bh, 6); g.fill(); g.stroke();      // 몸통
  g.fillStyle = h.floor;                                                     // 지붕
  g.beginPath(); g.moveTo(bx - 8, by); g.lineTo(sw / 2, by - sh * 0.26);
  g.lineTo(bx + bw + 8, by); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = '#D98E6A';                                                   // 문
  rrect(sw / 2 - bw * 0.12, sh * 0.9 - bh * 0.42, bw * 0.24, bh * 0.42, 3); g.fill(); g.stroke();
  g.fillStyle = '#CDEBFA';                                                   // 창문
  for(let i = 0; i <= level; i++){
    const wx = bx + bw * (0.16 + i * 0.3);
    rrect(wx, by + bh * 0.2, bw * 0.16, bh * 0.22, 3); g.fill(); g.stroke();
  }
  g = og; W = oW; H = oH;
}

  });
  SONGS.forEach(s => {

             '<b>' + d.name + '</b><span>Lv ' + Math.max(1, Math.round(n / s.end * 6)) + '</span></button>';

      song = s; diff = DIFFS.find(d => d.id === b.dataset.d); paint(); preview(s); });

/* ===== 설정 ===== */
let keyWait = -1;
const KEY_LABEL = { ArrowLeft:'←', ArrowRight:'→', ArrowUp:'↑', ArrowDown:'↓', Space:'공백',
                    Semicolon:';', Quote:"'", Comma:',', Period:'.', Slash:'/' };
function keyLabel(code){
  if(KEY_LABEL[code]) return KEY_LABEL[code];
  if(code.startsWith('Key')) return code.slice(3);
  if(code.startsWith('Digit')) return code.slice(5);
  return code;
}
function buildSettings(body){
  const wrap = document.createElement('div'); wrap.className = 'setlist'; body.appendChild(wrap);
  const group = title => {
    const d = document.createElement('div'); d.className = 'setgroup';
    d.innerHTML = '<h5>' + title + '</h5>'; wrap.appendChild(d); return d;
  };
  const row = (parent, title, val, inner, hint) => {
    const d = document.createElement('div'); d.className = 'setrow';
    d.innerHTML = '<div class="lbl"><b>' + title + '</b><span>' + val + '</span></div>' + inner +
                  (hint ? '<div class="hint">' + hint + '</div>' : '');
    parent.appendChild(d); return d;
  };
  const slider = (parent, title, val, attrs, onInput, hint) => {
    const d = row(parent, title, val, '<input type="range" ' + attrs + '>', hint);
    d.querySelector('input').oninput = e => {
      d.querySelector('.lbl span').textContent = onInput(+e.target.value);
    };
    return d;
  };

  const g0 = group('두기');
  const nm = row(g0, '이름', S.dugi.name,
    '<input class="nameinput" type="text" maxlength="6" value="' + S.dugi.name.replace(/"/g, '') + '">');
  nm.querySelector('input').onchange = e => {
    const v = (e.target.value || '').trim().slice(0, 6) || '두기';
    S.dugi.name = v; save(); refreshBar(); nm.querySelector('.lbl span').textContent = v;
  };

  const g1 = group('리듬게임 조작');
  const kr = row(g1, '키 바꾸기', '누르고 새 키를 눌러요',
    '<div class="keyrow">' + settings.keys.map((k, i2) =>
      '<button class="keybtn" data-i="' + i2 + '" type="button">' + keyLabel(k) +
      '<small>' + (i2 + 1) + '번째</small></button>').join('') + '</div>');
  kr.querySelectorAll('.keybtn').forEach(btn => {
    btn.onclick = () => { kr.querySelectorAll('.keybtn').forEach(b => b.classList.remove('wait'));
                          btn.classList.add('wait'); btn.textContent = '...'; keyWait = +btn.dataset.i; };
  });
  slider(g1, '노트 속도', 'x' + settings.speed.toFixed(1),
    'min="0.6" max="2" step="0.1" value="' + settings.speed + '"',
    v => { settings.speed = v; save(); return 'x' + v.toFixed(1); },
    '올릴수록 노트가 짧게 보여서 타이밍이 또렷해져요.');
  slider(g1, '싱크 보정', settings.offset + ' ms',
    'min="-150" max="150" step="5" value="' + settings.offset + '"',
    v => { settings.offset = v; save(); return v + ' ms'; },
    '노트가 소리보다 빠르면 −쪽, 늦으면 +쪽.');

  const g2 = group('소리');
  [['volMusic', '노래'], ['volBgm', '배경음'], ['volSfx', '효과음']].forEach(([k, label]) => {
    slider(g2, label, Math.round(settings[k] * 100) + '%',
      'min="0" max="100" step="5" value="' + Math.round(settings[k] * 100) + '"',
      v => { settings[k] = v / 100; applyVolumes(); save(); if(k === 'volSfx') uiClick(); return v + '%'; });
  });

  const g3 = group('꾸미기');
  const need = { basic:0, strawberry:9, mint:13 };
  const sk = row(g3, '노트 색', '도감을 모으면 늘어나요',
    '<div class="skinrow">' + Object.entries(SKINS).map(([id, s]) => {
      const has = S.skins.includes(id);
      return '<button class="skinbtn" data-s="' + id + '" type="button"' + (has ? '' : ' disabled') +
        ' aria-pressed="' + (settings.skin === id) + '"><span class="nm">' + s.name + '</span>' +
        '<span class="swatch">' + s.col.map(c2 => '<i style="background:' + c2 + '"></i>').join('') + '</span>' +
        '<small>' + (has ? '보유' : '도감 ' + need[id] + '종') + '</small></button>';
    }).join('') + '</div>');
  sk.querySelectorAll('.skinbtn').forEach(btn => {
    if(btn.disabled) return;
    btn.onclick = () => { settings.skin = btn.dataset.s; applySkin(); save(); openModal('settings'); };
  });

  const rs = document.createElement('button');
  rs.className = 'btn ghost small'; rs.type = 'button'; rs.textContent = '기본값으로';
  rs.onclick = () => { settings.keys = [...DEFAULT_KEYS]; settings.speed = 1; settings.offset = 0;
    settings.volMusic = 0.8; settings.volBgm = 0.6; settings.volSfx = 0.9; settings.skin = 'basic';
    applySkin(); applyVolumes(); save(); openModal('settings'); };
  wrap.appendChild(rs);
}

function decorate(el, rank){

function renderPullResult(got){

               : '<span class="meta dup">겹침 +' + r.refund + '</span>');
    grid.appendChild(el);
    setTimeout(() => { decorate(el, r.rank); if(r.rank !== 'N') RANKSOUND[r.rank](); }, i * step + 60);

function playCutscene(got){
  lastPull = got;
  const top = got.some(r => r.rank === 'SR') ? 'SR' : got.some(r => r.rank === 'R') ? 'R' : 'N';
